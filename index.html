async function carregarMediaObraCard(o, escopo){
  const slot = escopo.querySelector(`[data-obra-media-id="${o.id}"]`);
  if(!slot) return;
  try{
    const partes = [];
    if(o.fotos_paths && o.fotos_paths.length){
      for(const path of o.fotos_paths){
        const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(path, 3600);
        if(data) partes.push(`<img src="${data.signedUrl}" class="obra-foto-thumb" alt="Foto da obra" data-ver-foto="${data.signedUrl}">`);
      }
    }
    if(o.audio_path){
      const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(o.audio_path, 3600);
      if(data) partes.push(`<audio controls src="${data.signedUrl}" style="height:28px; max-width:170px;"></audio>`);
    }
    if(o.video_path){
      const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(o.video_path, 3600);
      if(data) partes.push(`<a href="${data.signedUrl}" target="_blank" rel="noopener" class="icon-btn" style="font-size:10.5px; padding:4px 8px;">Ver vídeo</a>`);
    }
    slot.innerHTML = partes.join('');
    slot.querySelectorAll('[data-ver-foto]').forEach(img => {
      img.addEventListener('click', () => window.open(img.dataset.verFoto, '_blank'));
    });
  }catch(_e){
    slot.innerHTML = `<span style="font-size:10.5px; color:var(--linho-dim);">Não foi possível carregar os anexos agora.</span>`;
  }
}

// Agrupa as obras por cliente (telefone, ou nome se não houver
// telefone), preservando a ordem de chegada — quem teve a primeira obra
// mais cedo aparece primeiro, tanto na lista como dentro do "quarto" dele.
function agruparObrasPorCliente(obrasAscendentes){
  const mapa = new Map();
  (obrasAscendentes || []).forEach(o => {
    const chave = o.cliente_telefone || `nome:${(o.cliente_nome||'').toLowerCase()}`;
    if(!mapa.has(chave)) mapa.set(chave, { chave, nome: o.cliente_nome, telefone: o.cliente_telefone, obras: [] });
    const registo = mapa.get(chave);
    registo.obras.push(o);
    if(o.cliente_nome) registo.nome = o.cliente_nome; // fica sempre com o nome mais recente
  });
  return Array.from(mapa.values());
}

/* ======================================================================
   CEO — Clientes: cada cliente tem o seu "quarto", com toda a
   atividade (obras) por ordem de chegada, e o CEO pode registar uma
   obra nova diretamente a partir daqui.
   ====================================================================== */
async function renderCeoClientesTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar clientes…</div>`;
  try{
    const { data: obras, error } = await sb.from('obras').select('*').order('criado_em', { ascending: true });
    if(error) throw error;

    const clientes = agruparObrasPorCliente(obras);
    if(clientes.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não há clientes — aparecem aqui assim que a primeira obra for registada.</div>`;
      return;
    }

    container.innerHTML = `
      <div class="page-head" style="margin-bottom:16px; padding:0;">
        <p>${clientes.length} cliente${clientes.length>1?'s':''} — por ordem de chegada (quem chegou primeiro aparece primeiro).</p>
      </div>
      <input class="field" id="clientesBusca" placeholder="Procurar por nome ou telefone…" style="margin-bottom:16px;">
      <div class="produto-grid" id="clientesGrid"></div>
    `;

    function desenhar(termo){
      const grid = document.getElementById('clientesGrid');
      const filtrados = termo
        ? clientes.filter(c => (c.nome||'').toLowerCase().includes(termo.toLowerCase()) || (c.telefone||'').includes(termo))
        : clientes;
      if(filtrados.length === 0){ grid.innerHTML = `<div class="empty-state-small">Nenhum cliente encontrado.</div>`; return; }
      grid.innerHTML = '';
      filtrados.forEach((c) => {
        const idx = clientes.indexOf(c);
        const totalPago = c.obras.reduce((s,o) => s + Number(o.valor_pago||0), 0);
        const ultimaObra = c.obras[c.obras.length - 1];
        const card = document.createElement('div');
        card.className = 'obra-card';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div class="obra-top">
            <div>
              <div class="obra-cliente">#${idx+1} · ${esc(c.nome || 'Sem nome')}</div>
              <div class="obra-tipo">${esc(c.telefone || 'sem telefone')}</div>
            </div>
          </div>
          <div class="obra-valores">${c.obras.length} obra${c.obras.length>1?'s':''} · <span class="mono">${formatAOA(totalPago)}</span> pago no total</div>
          <div class="obra-valores" style="color:var(--linho-dim);">Última atividade: ${new Date(ultimaObra.criado_em).toLocaleDateString('pt-PT')}</div>
        `;
        card.addEventListener('click', () => renderClienteQuartoCeo(c, idx, container));
        grid.appendChild(card);
      });
    }
    desenhar('');
    document.getElementById('clientesBusca').addEventListener('input', (e) => desenhar(e.target.value));
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar os clientes: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

// O "quarto" do cliente — toda a atividade dele, mais antiga primeiro,
// dados editáveis, e um atalho para lhe registar uma obra nova ali mesmo.
async function renderClienteQuartoCeo(c, idx, container){
  container.innerHTML = `
    <span class="back-link" id="clienteVoltarBtn">← Voltar a Clientes</span>

    <div class="form-card">
      <h3>#${idx+1} · ${esc(c.nome || 'Sem nome')}</h3>
      <div class="form-row2">
        <div class="field"><label>Nome</label><input id="cq_nome" value="${escAttr(c.nome||'')}"></div>
        <div class="field"><label>WhatsApp</label><input id="cq_telefone" value="${escAttr(c.telefone||'')}" type="tel"></div>
      </div>
      <button class="icon-btn" id="cq_guardar_btn">Guardar alterações do cliente</button>
      <div class="error-banner" id="cq_error" style="display:none; margin-top:10px;"></div>
    </div>

    <div class="section-eyebrow" style="margin:22px 0 12px;">Atividade — ${c.obras.length} obra${c.obras.length>1?'s':''}, da mais antiga à mais recente</div>
    <div class="obras-coluna-grid obras-grid-compacto" id="cq_obras_grid"></div>

    <div class="form-card" style="margin-top:24px;">
      <h3>+ Nova obra para ${esc(c.nome || 'este cliente')}</h3>
      <div class="field"><label>Tipo de serviço</label>
        <select id="cq_tipo">
          <option value="">— Selecionar —</option>
          ${['Terno sob medida','Blazer','Calça','Camisa','Vestido','Fardamento','Ajuste / Reparação','Outro'].map(t => `<option>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Descrição (opcional)</label><textarea id="cq_desc" rows="2"></textarea></div>
      ${medidasGridHTML('cq', {})}
      ${materiaisUsadosBlocoHTML('cq')}
      <div class="form-row2">
        <div class="field"><label>A pagar (Kz)</label><input id="cq_apagar" type="number" min="0" placeholder="0"></div>
        <div class="field"><label>Já pago (Kz)</label><input id="cq_pago" type="number" min="0" placeholder="0" value="0"></div>
      </div>
      <div class="field"><label>Prioridade</label>
        <select id="cq_prioridade"><option value="normal">Normal</option><option value="urgente">Urgente</option></select>
      </div>
      <div class="error-banner" id="cq_nova_error" style="display:none;"></div>
      <button class="btn-submit" id="cq_nova_btn">Registar obra</button>
      <p style="font-size:11px; color:var(--linho-dim); margin-top:10px;">Sem fotos/vídeo/áudio aqui — para anexar, use a Caixa do Dia ou edite a obra depois em Obras.</p>
    </div>
  `;

  document.getElementById('clienteVoltarBtn').addEventListener('click', () => renderCeoClientesTab(container));
  ativarMedidasBloco('cq');
  await ativarMateriaisUsadosBloco('cq', 'cq_apagar');

  const grid = document.getElementById('cq_obras_grid');
  c.obras.forEach(o => {
    const card = document.createElement('div');
    card.className = 'obra-card';
    card.innerHTML = `
      <div class="obra-top">
        <div>
          <div class="obra-cliente">${esc(o.tipo_servico)}</div>
          <div class="obra-tipo">${o.descricao ? esc(o.descricao) : ''}</div>
        </div>
        <span class="estado-badge ${o.estado === 'concluido' ? 'estado-concluido' : o.estado === 'rejeitado' ? 'estado-rejeitado' : 'estado-por_concluir'}">
          ${o.estado === 'concluido' ? 'Concluída' : o.estado === 'rejeitado' ? 'Rejeitada' : (Number(o.valor_pago) > 0 ? 'Por fazer' : 'Pendente — sem sinal')}
        </span>
      </div>
      <div class="obra-valores">
        <span class="mono">${formatAOA(o.valor_pago)}</span> pago de <span class="mono">${formatAOA(o.valor_a_pagar)}</span>
        ${o.data_servico ? ' · ' + new Date(o.data_servico).toLocaleDateString('pt-PT') : ''}
      </div>
      ${obraMediaTiraHTML(o)}
    `;
    grid.appendChild(card);
  });
  c.obras.forEach(o => carregarMediaObraCard(o, grid));

  document.getElementById('cq_guardar_btn').addEventListener('click', async () => {
    const btn = document.getElementById('cq_guardar_btn');
    const errBox = document.getElementById('cq_error');
    errBox.style.display = 'none';
    const novoNome = document.getElementById('cq_nome').value.trim();
    const novoTel = document.getElementById('cq_telefone').value.trim();
    btn.textContent = 'A guardar…';
    btn.disabled = true;
    try{
      if(c.telefone){
        const { data: existente } = await sb.from('clientes').select('id').eq('telefone', c.telefone).maybeSingle();
        if(existente){
          await sb.from('clientes').update({ nome: novoNome || null, telefone: novoTel || null }).eq('id', existente.id);
        } else {
          await sb.from('clientes').insert({ nome: novoNome || null, telefone: novoTel || c.telefone });
        }
      } else if(novoTel){
        await sb.from('clientes').insert({ nome: novoNome || null, telefone: novoTel });
      }
      showToast('Cliente atualizado ✓ (o histórico de obras já registadas mantém o nome/telefone da altura)');
      btn.textContent = 'Guardar alterações do cliente';
      btn.disabled = false;
    }catch(e){
      errBox.textContent = 'Não foi possível guardar: ' + (e.message || 'erro desconhecido');
      errBox.style.display = 'block';
      btn.textContent = 'Guardar alterações do cliente';
      btn.disabled = false;
    }
  });

  document.getElementById('cq_nova_btn').addEventListener('click', async () => {
    const btn = document.getElementById('cq_nova_btn');
    const errBox = document.getElementById('cq_nova_error');
    errBox.style.display = 'none';
    const tipo = document.getElementById('cq_tipo').value.trim();
    if(!tipo){ errBox.textContent = 'Selecione o tipo de serviço.'; errBox.style.display = 'block'; return; }

    btn.textContent = 'A registar…';
    btn.disabled = true;
    const dadosMateriais = lerMateriaisUsados('cq');
    const payload = {
      cliente_nome: document.getElementById('cq_nome').value.trim() || c.nome,
      cliente_telefone: document.getElementById('cq_telefone').value.trim() || c.telefone || null,
      tipo_servico: tipo,
      descricao: document.getElementById('cq_desc').value.trim(),
      data_servico: new Date().toISOString().slice(0,10),
      quantidade: 1,
      valor_a_pagar: Number(document.getElementById('cq_apagar').value) || 0,
      valor_pago: Number(document.getElementById('cq_pago').value) || 0,
      prioridade: document.getElementById('cq_prioridade').value || 'normal',
      medidas: coletarMedidas('cq'),
      materiais_usados: dadosMateriais.materiais_usados,
      custo_materiais: dadosMateriais.custo_materiais,
      tempo_producao_horas: dadosMateriais.tempo_producao_horas,
      custo_producao: dadosMateriais.custo_producao,
      registado_por: currentAuthUser.id,
      estado: 'por_concluir'
    };
    try{
      let { error } = await sb.from('obras').insert(payload);
      if(error && error.code === '42703'){
        delete payload.prioridade;
        delete payload.materiais_usados;
        delete payload.custo_materiais;
        delete payload.tempo_producao_horas;
        delete payload.custo_producao;
        const retry = await sb.from('obras').insert(payload);
        error = retry.error;
      }
      if(error) throw error;
      await descontarMateriaisDoStock(dadosMateriais.materiais_usados);
      showToast('Obra registada ✓');
      await renderCeoClientesTab(container);
    }catch(e){
      errBox.textContent = 'Não foi possível registar: ' + (e.message || 'erro desconhecido');
      errBox.style.display = 'block';
      btn.textContent = 'Registar obra';
      btn.disabled = false;
    }
  });
}

/* ======================================================================
   CEO — Parceiros Publicitários: ranking pelo maior número de clientes
   trazidos por indicação — o que mais indicou fica no topo.
   ====================================================================== */
async function renderCeoParceirosTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar parceiros publicitários…</div>`;
  try{
    const { data: parceiros, error: e1 } = await sb.from('usuarios').select('id, nome, email, codigo_afilhado').eq('papel', 'afilhado').eq('estado', 'aprovado');
    if(e1) throw e1;
    if(!parceiros || parceiros.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não há parceiros publicitários. Promova um cliente em Equipa → Membros.</div>`;
      return;
    }

    const { data: clientesLigados, error: e2 } = await sb.from('clientes').select('afilhado_id').not('afilhado_id', 'is', null);
    if(e2) throw e2;

    const contagem = {};
    (clientesLigados||[]).forEach(c => { contagem[c.afilhado_id] = (contagem[c.afilhado_id]||0) + 1; });

    const ranking = parceiros
      .map(p => ({ ...p, indicados: contagem[p.id] || 0 }))
      .sort((a,b) => b.indicados - a.indicados);

    container.innerHTML = `
      <div class="page-head" style="margin-bottom:16px; padding:0;"><p>Ordenado pelo maior número de clientes indicados — quem mais traz fica no topo.</p></div>
      ${ranking.map((p, idx) => `
        <div class="obra-card">
          <div class="obra-top">
            <div>
              <div class="obra-cliente">#${idx+1} · ${esc(p.nome || p.email)}</div>
              <div class="obra-tipo">Código: ${esc(p.codigo_afilhado || '— sem código gerado')}</div>
            </div>
            <span class="estado-badge estado-concluido">${p.indicados} indicado${p.indicados===1?'':'s'}</span>
          </div>
        </div>
      `).join('')}
    `;
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar os parceiros publicitários: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

async function renderCeoObrasTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar obras…</div>`;
  try{
    const [{ data: obras, error: errObras }, { data: pessoal, error: errPessoal }, { data: clientesComAfilhado }] = await Promise.all([
      sb.from('obras').select('*').order('criado_em', { ascending: false }).limit(100),
      sb.from('usuarios').select('id, nome, email, papel').in('papel', ['funcionario', 'gerente_administrativo', 'ceo', 'afilhado']).eq('estado', 'aprovado'),
      sb.from('clientes').select('telefone, afilhado_id').not('afilhado_id', 'is', null)
    ]);
    if(errObras) throw errObras;
    if(errPessoal) throw errPessoal;

    // Mapa id -> nome, para mostrar quem registou cada obra (pode ter sido
    // qualquer pessoa interna: parceiro, gerente ou o próprio CEO).
    const nomePorId = {};
    (pessoal||[]).forEach(p => { nomePorId[p.id] = p.nome || p.email; });
    // Só parceiros e gerentes entram na lista de "técnico responsável"
    // (atribuir o CEO ou um afilhado como técnico não faz sentido).
    const tecnicos = (pessoal||[]).filter(p => p.papel === 'funcionario' || p.papel === 'gerente_administrativo');
    // Telefone -> id do afilhado ligado a esse cliente, para calcular a
    // comissão (10%) diretamente no cartão da obra.
    const afilhadoPorTelefone = {};
    (clientesComAfilhado||[]).forEach(c => { if(c.telefone) afilhadoPorTelefone[c.telefone] = c.afilhado_id; });

    if(!obras || obras.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não há obras registadas.</div>`;
      return;
    }

    const blocos = classificarObras(obras);
    container.innerHTML = `
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        <button type="button" class="obra-filtro-chip" data-filtro="por_fazer">Por fazer (${blocos.porFazer.length})</button>
        <button type="button" class="obra-filtro-chip" data-filtro="pendentes">Pendentes — sem sinal (${blocos.pendentes.length})</button>
        <button type="button" class="obra-filtro-chip" data-filtro="concluidas">Concluídas (${blocos.concluidas.length})</button>
        <button type="button" class="obra-filtro-chip" data-filtro="rejeitadas">Rejeitadas (${blocos.rejeitadas.length})</button>
        <button type="button" class="obra-filtro-chip" data-filtro="todas">Todas (${obras.length})</button>
      </div>
      <div class="field" style="margin-bottom:18px;">
        <input id="obras_busca" placeholder="Procurar por nome do cliente (ex.: Inocência, Sr. Kinday)…">
      </div>
      <div id="obrasListaArea"></div>
    `;

    let filtroAtivo = 'por_fazer';
    const listaArea = document.getElementById('obrasListaArea');

    function listaDoFiltro(){
      if(filtroAtivo === 'pendentes') return blocos.pendentes;
      if(filtroAtivo === 'concluidas') return blocos.concluidas;
      if(filtroAtivo === 'rejeitadas') return blocos.rejeitadas;
      if(filtroAtivo === 'todas') return obras;
      return blocos.porFazer;
    }

    // Um cartão de obra, para uso dentro da grelha de colunas abaixo.
    function cartaoObraCeoHTML(o){
      return `
      <div class="obra-card" data-obra-id="${o.id}">
        <div class="obra-top">
          <div>
            <div class="obra-cliente">${esc(o.cliente_nome)}</div>
            <div class="obra-tipo">${esc(o.tipo_servico)}${o.descricao ? ' — ' + esc(o.descricao) : ''}</div>
          </div>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
            ${prioridadeBadgeHTML(o)}
            <span class="estado-badge ${o.estado === 'concluido' ? 'estado-concluido' : o.estado === 'rejeitado' ? 'estado-rejeitado' : 'estado-por_concluir'}">
              ${o.estado === 'concluido' ? 'Concluída' : o.estado === 'rejeitado' ? 'Rejeitada' : (Number(o.valor_pago) > 0 ? 'Por fazer' : 'Pendente — sem sinal')}
            </span>
          </div>
        </div>
        <div class="obra-tipo" style="margin-bottom:6px;">Registado por: <strong style="color:var(--linho);">${esc(nomePorId[o.registado_por] || 'Desconhecido')}</strong></div>
        <div class="obra-valores">
          <span class="mono">${formatAOA(o.valor_pago)}</span> pago de <span class="mono">${formatAOA(o.valor_a_pagar)}</span>
          ${o.data_servico ? ' · ' + new Date(o.data_servico).toLocaleDateString('pt-PT') : ''}
        </div>
        <div class="obra-valores">
          Custo de produção: <span class="mono">${o.custo_producao!=null ? formatAOA(o.custo_producao) : '— por definir'}</span>
          ${afilhadoPorTelefone[o.cliente_telefone] ? `
            · Parceiro publicitário: <strong style="color:var(--linho);">${esc(nomePorId[afilhadoPorTelefone[o.cliente_telefone]] || 'Desconhecido')}</strong>
            ${o.estado === 'concluido' ? `
              · Comissão (${Math.round(TAXA_COMISSAO_AFILHADO*100)}% do pago): <span class="mono">${formatAOA(calcularComissaoAfilhado(o))}</span>
              ${o.comissao_paga ? ' · <span style="color:var(--verde-light);">paga</span>' : ' · <span style="color:var(--caramelo-light);">por pagar</span>'}
            ` : ''}
          ` : ''}
        </div>
        ${o.motivo_rejeicao ? `<div class="motivo-rejeicao">Motivo: ${esc(o.motivo_rejeicao)}</div>` : ''}
        ${obraMediaTiraHTML(o)}

        ${o.estado === 'concluido' && o.cliente_telefone ? `
          <div class="wa-notify-row" style="display:flex; gap:8px; flex-wrap:wrap;">
            <a class="wa-notify-btn" target="_blank" rel="noopener"
               href="${buildClienteWaLink(o)}">
              Avisar cliente — peça pronta
            </a>
            <a class="wa-notify-btn" target="_blank" rel="noopener"
               href="${buildClienteWaLinkAvaliacao(o)}">
              Pedir avaliação
            </a>
          </div>
        ` : o.estado === 'concluido' && !o.cliente_telefone ? `
          <div class="wa-notify-missing">Sem número de WhatsApp guardado para este cliente — não é possível enviar aviso automático.</div>
        ` : ''}

        <details class="obra-acoes-toggle">
          <summary>Ações ▾</summary>
          <div class="ceo-obra-controls">
          <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
            <label>Técnico responsável</label>
            <select class="ceo-tecnico-select" data-id="${o.id}">
              <option value="">— Não atribuído —</option>
              ${tecnicos.map(t => `<option value="${t.id}" ${o.tecnico_atribuido===t.id?'selected':''}>${esc(t.nome || t.email)}</option>`).join('')}
            </select>
          </div>
          <button class="btn-approve ceo-obra-btn" data-action="atribuir" data-id="${o.id}">Guardar técnico</button>
          ${o.estado !== 'concluido' ? `<button class="btn-approve ceo-obra-btn" data-action="concluir" data-id="${o.id}">Marcar concluída</button>` : ''}
          ${(Number(o.valor_a_pagar) - Number(o.valor_pago)) > 0 ? `<button class="icon-btn ceo-obra-btn" data-action="pagamento" data-id="${o.id}">Registar pagamento</button>` : ''}
          ${o.estado !== 'rejeitado' ? `<button class="icon-btn ceo-obra-btn" data-action="custo" data-id="${o.id}">Registar custo de produção</button>` : ''}
          ${afilhadoPorTelefone[o.cliente_telefone] && o.estado === 'concluido' ? `<button class="icon-btn ceo-obra-btn" data-action="comissao" data-id="${o.id}">${o.comissao_paga ? 'Marcar comissão por pagar' : 'Marcar comissão paga'}</button>` : ''}
          ${o.estado !== 'concluido' && o.estado !== 'rejeitado' ? `<button class="icon-btn ceo-obra-btn" data-action="prioridade" data-id="${o.id}">${o.prioridade === 'urgente' ? 'Remover urgência' : 'Marcar urgente'}</button>` : ''}
          ${o.estado !== 'rejeitado' ? `<button class="btn-reject ceo-obra-btn" data-action="rejeitar" data-id="${o.id}">Rejeitar</button>` : ''}
          <button class="icon-btn ceo-obra-btn" data-action="editar" data-id="${o.id}">✎ Editar registo</button>
          <button class="icon-btn ceo-obra-btn" data-action="recibo" data-id="${o.id}">Gerar recibo</button>
          <button class="icon-btn ceo-obra-btn" data-action="fatura" data-id="${o.id}">Emitir Fatura</button>
          </div>
        </details>
      </div>
    `;
    }

    // Duas colunas fixas — Ajustes e Confecção — cada uma da obra mais
    // antiga para a mais recente (quem chegou primeiro aparece primeiro),
    // em grelha para caberem várias obras lado a lado.
    function desenharLista(termo){
      const base = listaDoFiltro();
      const filtradas = termo
        ? base.filter(o => (o.cliente_nome || '').toLowerCase().includes(termo.toLowerCase()))
        : base;
      if(filtradas.length === 0){
        listaArea.innerHTML = `<div class="empty-state-small">Nenhuma obra encontrada neste filtro.</div>`;
        return;
      }
      const porAntiguidade = (a, b) => new Date(a.criado_em) - new Date(b.criado_em);
      const ajustes = filtradas.filter(o => categoriaObra(o) === 'ajustes').sort(porAntiguidade);
      const confeccao = filtradas.filter(o => categoriaObra(o) === 'confeccao').sort(porAntiguidade);

      listaArea.innerHTML = `
        <div class="obras-duas-colunas obras-grid-compacto">
          <div>
            <div class="obras-coluna-titulo">Ajustes (${ajustes.length})</div>
            <div class="obras-coluna-grid">
              ${ajustes.length ? ajustes.map(cartaoObraCeoHTML).join('') : '<div class="empty-state-small">Sem obras de ajuste neste filtro.</div>'}
            </div>
          </div>
          <div>
            <div class="obras-coluna-titulo">Confecção (${confeccao.length})</div>
            <div class="obras-coluna-grid">
              ${confeccao.length ? confeccao.map(cartaoObraCeoHTML).join('') : '<div class="empty-state-small">Sem obras de confecção neste filtro.</div>'}
            </div>
          </div>
        </div>
      `;

      filtradas.forEach(o => carregarMediaObraCard(o, listaArea));

      container.querySelectorAll('[data-action="editar"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(obra) renderEditarObraForm(container, obra, () => renderCeoObrasTab(container));
        });
      });

      container.querySelectorAll('[data-action="recibo"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(obra) gerarReciboPDF(obra, nomePorId[obra.registado_por]);
        });
      });

      container.querySelectorAll('[data-action="fatura"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(!obra) return;

          const tipoEscolhido = prompt('Tipo de documento — escreva:\nFT para Factura\nFR para Factura-Recibo (já pago)\nRC para Recibo simples', 'FR');

            alert('Tipo inválido. Use FT, FR ou RC.');
            return;
          }

          const nif = prompt('NIF do cliente (deixe em branco para "Consumidor Final"):', '');
          if(nif === null) return; // cancelado

          btn.textContent = 'A emitir…';
          btn.disabled = true;
          try{
            await emitirFatura(obra, tipo, nif.trim() || null, nomePorId[currentAuthUser.id] || currentAuthUser.email);
            showToast('Fatura emitida ✓ Número gerado automaticamente');
            btn.textContent = 'Emitir Fatura';
            btn.disabled = false;
          }catch(e){
            alert('Não foi possível emitir a fatura: ' + (e.message || 'erro desconhecido'));
            btn.textContent = 'Emitir Fatura';
            btn.disabled = false;
          }
        });
      });

      container.querySelectorAll('[data-action="atribuir"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const select = container.querySelector(`.ceo-tecnico-select[data-id="${id}"]`);
          const tecnicoId = select.value || null;
          btn.textContent = 'A guardar…';
          btn.disabled = true;
          try{
            const { error } = await sb.from('obras').update({
              tecnico_atribuido: tecnicoId,
              atribuido_em: tecnicoId ? new Date().toISOString() : null
            }).eq('id', id);
            if(error) throw error;
            showToast('Técnico atualizado');
            btn.textContent = 'Guardar técnico';
            btn.disabled = false;
          }catch(e){
            alert('Não foi possível guardar: ' + (e.message || 'erro desconhecido'));
            btn.textContent = 'Guardar técnico';
            btn.disabled = false;
          }
        });
      });

      container.querySelectorAll('[data-action="concluir"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          try{
            const { error } = await sb.from('obras').update({ estado: 'concluido', motivo_rejeicao: null }).eq('id', id);
            if(error) throw error;
            await renderCeoObrasTab(container);
            showToast('Obra marcada como concluída');
          }catch(e){
            alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido'));
          }
        });
      });

      container.querySelectorAll('[data-action="prioridade"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(!obra) return;
          btn.disabled = true;
          const ok = await alternarPrioridadeObra(obra.id, obra.prioridade);
          if(ok) await renderCeoObrasTab(container); else btn.disabled = false;
        });
      });

      container.querySelectorAll('[data-action="custo"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(!obra) return;
          const entrada = prompt(`Quanto se gastou a produzir esta obra (materiais, mão-de-obra)? (Kz)`, obra.custo_producao != null ? String(obra.custo_producao) : '');
          if(entrada === null) return; // cancelado
          const valor = Number(String(entrada).replace(/[^\d.,]/g, '').replace(',', '.'));
          if(isNaN(valor) || valor < 0){ alert('Introduza um valor válido.'); return; }
          btn.disabled = true;
          try{
            const { error } = await sb.from('obras').update({ custo_producao: valor }).eq('id', obra.id);
            if(error) throw error;
            await renderCeoObrasTab(container);
            showToast('Custo de produção registado ✓');
          }catch(e){
            if(e.code === '42703') alert('Ainda falta correr o SQL que adiciona a coluna "custo_producao" na base de dados.');
            else alert('Não foi possível guardar: ' + (e.message || 'erro desconhecido'));
            btn.disabled = false;
          }
        });
      });

      container.querySelectorAll('[data-action="comissao"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(!obra) return;
          btn.disabled = true;
          try{
            const { error } = await sb.from('obras').update({ comissao_paga: !obra.comissao_paga }).eq('id', obra.id);
            if(error) throw error;
            await renderCeoObrasTab(container);
            showToast(obra.comissao_paga ? 'Comissão marcada como por pagar' : 'Comissão marcada como paga ✓');
          }catch(e){
            if(e.code === '42703') alert('Ainda falta correr o SQL que adiciona a coluna "comissao_paga" na base de dados.');
            else alert('Não foi possível guardar: ' + (e.message || 'erro desconhecido'));
            btn.disabled = false;
          }
        });
      });

      container.querySelectorAll('[data-action="pagamento"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const obra = obras.find(o => String(o.id) === btn.dataset.id);
          if(!obra) return;
          const emFalta = Number(obra.valor_a_pagar) - Number(obra.valor_pago);
          const entrada = prompt(`Falta receber ${formatAOA(emFalta)} deste cliente. Quanto pagou agora? (Kz)`, '');
          if(entrada === null) return; // cancelado
          const valor = Number(String(entrada).replace(/[^\d.,]/g, '').replace(',', '.'));
          if(!valor || valor <= 0){ alert('Introduza um valor válido.'); return; }

          btn.textContent = 'A guardar…';
          btn.disabled = true;
          try{
            const novoValorPago = Number(obra.valor_pago) + valor;
            const { error } = await sb.from('obras').update({ valor_pago: novoValorPago }).eq('id', obra.id);
            if(error) throw error;
            await renderCeoObrasTab(container);
            showToast(`Pagamento de ${formatAOA(valor)} registado ✓`);
          }catch(e){
            alert('Não foi possível registar: ' + (e.message || 'erro desconhecido'));
            btn.textContent = 'Registar pagamento';
            btn.disabled = false;
          }
        });
      });

      container.querySelectorAll('[data-action="rejeitar"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const motivo = prompt('Motivo da rejeição (visível ao parceiro):');
          if(motivo === null) return; // cancelado
          try{
            const { error } = await sb.from('obras').update({ estado: 'rejeitado', motivo_rejeicao: motivo || 'Sem motivo indicado' }).eq('id', id);
            if(error) throw error;
            await renderCeoObrasTab(container);
            showToast('Obra rejeitada');
          }catch(e){
            alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido'));
          }
        });
      });
    }

    container.querySelectorAll('.obra-filtro-chip').forEach(chip => {
      chip.classList.toggle('ativo', chip.dataset.filtro === filtroAtivo);
      chip.addEventListener('click', () => {
        filtroAtivo = chip.dataset.filtro;
        container.querySelectorAll('.obra-filtro-chip').forEach(c => c.classList.toggle('ativo', c === chip));
        desenharLista(document.getElementById('obras_busca').value);
      });
    });

    desenharLista('');
    document.getElementById('obras_busca').addEventListener('input', (e) => desenharLista(e.target.value));
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as obras: ${e.message || 'erro desconhecido'}</div>`;
  }
}

/* ------------------------------------------------------------
   CEO — Despesas: ver todas
   ------------------------------------------------------------ */
async function renderCeoDespesasTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar despesas…</div>`;
  try{
    const { data, error } = await sb.from('despesas').select('*').order('criado_em', { ascending: false }).limit(100);
    if(error) throw error;

    if(!data || data.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não há despesas registadas.</div>`;
      return;
    }

    const total = data.reduce((s, d) => s + Number(d.valor || 0), 0);

    container.innerHTML = `
      <div class="totals-bar">Total das últimas ${data.length} despesas: <span class="mono">${formatAOA(total)}</span></div>
      ${data.map(d => `
        <div class="obra-card" data-despesa-id="${d.id}">
          <div class="obra-top">
            <div class="obra-cliente">${esc(d.tipo_despesa)}</div>
            <span class="mono" style="color:var(--giz-light);">-${formatAOA(d.valor)}</span>
          </div>
          <div class="obra-tipo">${d.data_despesa ? new Date(d.data_despesa).toLocaleDateString('pt-PT') : 'Sem data'}${d.forma_pagamento ? ' · ' + esc(d.forma_pagamento) : ''}</div>
          <div class="ceo-obra-controls">
            <button class="icon-btn" data-deedit="${d.id}">✎ Editar</button>
            <button class="icon-btn danger" data-dedel="${d.id}">Remover</button>
          </div>
        </div>
      `).join('')}
    `;

    container.querySelectorAll('[data-deedit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const despesa = data.find(d => String(d.id) === btn.dataset.deedit);
        if(despesa) renderDespesaEditForm(container, despesa);
      });
    });
    container.querySelectorAll('[data-dedel]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Remover esta despesa?')) return;
        try{
          const { error } = await sb.from('despesas').delete().eq('id', btn.dataset.dedel);
          if(error) throw error;
          await renderCeoDespesasTab(container);
          showToast('Despesa removida');
        }catch(e){
          alert('Não foi possível remover: ' + (e.message || 'erro desconhecido'));
        }
      });
    });
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as despesas: ${e.message || 'erro desconhecido'}</div>`;
  }
}

const CATEGORIA_LABEL = { tecido: 'Tecido', linha: 'Linha', botao: 'Botão', ziper: 'Zíper (fecho)', entretela: 'Entretela', aviamento: 'Aviamento' };
let materiaisFiltro = 'todos';

async function renderMateriaisTab(container, isCeo){
  container.innerHTML = `<div class="loading-screen">A carregar stock…</div>`;
  try{
    const { data, error } = await sb.from('materiais').select('*').order('categoria', { ascending: true }).order('nome', { ascending: true });
    if(error) throw error;

    const materiais = data || [];
    const acabando = materiais.filter(m => Number(m.quantidade_atual) <= Number(m.quantidade_minima));
    // Ordena por maior défice (quanto falta para atingir o mínimo) — o
    // topo desta lista é o que deve ser comprado primeiro.
    const prioridadeCompra = [...acabando].sort((a,b) => {
      const defA = Number(a.quantidade_minima) - Number(a.quantidade_atual);
      const defB = Number(b.quantidade_minima) - Number(b.quantidade_atual);
      return defB - defA;
    });
    const filtrados = materiaisFiltro === 'todos' ? materiais : materiais.filter(m => m.categoria === materiaisFiltro);

    container.innerHTML = `
      ${acabando.length > 0 ? `
        <div class="stock-alerta">
          ⚠ <strong>${acabando.length}</strong> item${acabando.length===1?'':'s'} precisa${acabando.length===1?'':'m'} de reposição: 
          ${acabando.map(m => esc(m.nome)).join(', ')}
        </div>

            // (falta correr o SQL) — guarda o material na mesma, sem essas
            // colunas, em vez de bloquear o registo todo por causa delas.
            delete novoMaterial.cor;
            delete novoMaterial.tamanho;
            delete novoMaterial.preco_unitario;

            delete novoMaterial.quantidade_por_embalagem;
            const retry = await sb.from('materiais').insert(novoMaterial);
            error = retry.error;

          showToast('Material adicionado');
          await renderMateriaisTab(container, isCeo);

          errBox.textContent = 'Não foi possível adicionar: ' + (e.message || 'erro desconhecido');
          errBox.style.display = 'block';
          btn.textContent = 'Adicionar material';
          btn.disabled = false;
        }
      });

          const material = materiais.find(m => String(m.id) === btn.dataset.medit);

      container.querySelectorAll('[data-mdel]').forEach(btn => {
        btn.addEventListener('click', async () => {

          try{

    }
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar o stock: ${e.message || 'erro desconhecido'}</div>`;

/* ------------------------------------------------------------
   MATERIAIS USADOS NA OBRA — bloco partilhado entre os formulários
   de nova obra (Caixa do Dia e ficha do cliente). Ao registar uma
   obra, quem estiver na receção escolhe os materiais gastos nessa
   peça (tecido, entretela, linha, zíper, botão…), o custo é somado
   automaticamente a partir do preço de cada material no stock, e o
   preço sugerido = custo dos materiais + horas de produção × custo
   da hora. O valor final em "A pagar" continua editável à mão —
   isto é só um ponto de partida justo, não uma imposição.
   ------------------------------------------------------------ */
const CHAVE_CUSTO_HORA = 'dionuel_custo_hora_kz';

async function carregarMateriaisDisponiveis(){
  try{
    const { data, error } = await sb.from('materiais').select('*').order('categoria').order('nome');
    if(error) throw error;
    return data || [];
  }catch(_e){
    return [];
  }
}

function materiaisUsadosBlocoHTML(prefixo){
  const custoHoraGuardado = localStorage.getItem(CHAVE_CUSTO_HORA) || '4400';
  return `
    <div class="field" style="margin-top:4px;">
      <label>Materiais usados nesta peça (opcional — desconta do stock e soma ao preço)</label>
      <div id="${prefixo}_materiais_lista"></div>
      <button type="button" class="icon-btn" id="${prefixo}_materiais_add" style="margin-top:6px;">+ Adicionar material</button>
    </div>
    <div class="form-row2">
      <div class="field">
        <label>Tempo provável de produção (horas)</label>
        <input id="${prefixo}_tempo" type="number" min="0" step="0.5" placeholder="Ex.: 3">
      </div>
      <div class="field">
        <label>Custo por hora de produção (Kz)</label>
        <input id="${prefixo}_custohora" type="number" min="0" step="1" value="${escAttr(custoHoraGuardado)}">
      </div>
    </div>
    <div class="instrucoes-pagamento" id="${prefixo}_preco_sugerido" style="display:none; margin-bottom:16px;"></div>
  `;
}

async function ativarMateriaisUsadosBloco(prefixo, campoApagarId){
  const materiaisDisponiveis = await carregarMateriaisDisponiveis();
  const listaEl = document.getElementById(`${prefixo}_materiais_lista`);
  const campoApagar = document.getElementById(campoApagarId);
  let contador = 0;

  function opcoesHTML(){
    if(materiaisDisponiveis.length === 0){
      return `<option value="">Sem materiais no stock — registe em "Materiais"</option>`;
    }
    return `<option value="">— Selecionar —</option>` + materiaisDisponiveis.map(m => {
      const label = `${m.nome}${m.cor ? ' — ' + m.cor : ''}${m.tamanho ? ' (' + m.tamanho + ')' : ''} · ${CATEGORIA_LABEL[m.categoria] || m.categoria} · ${m.preco_unitario ? formatAOA(m.preco_unitario) + '/' + m.unidade : 'sem preço'} · stock: ${m.quantidade_atual} ${m.unidade}`;
      return `<option value="${m.id}" data-preco="${m.preco_unitario || 0}" data-unidade="${escAttr(m.unidade)}">${esc(label)}</option>`;
    }).join('');
  }

  function linhaHTML(idx){
    return `
      <div class="form-row2 linha-material" data-idx="${idx}" style="align-items:flex-end;">
        <div class="field" style="flex:3;"><label style="font-size:11px;">Material</label>
          <select class="mu_material">${opcoesHTML()}</select>
        </div>
        <div class="field" style="flex:1;"><label style="font-size:11px;">Qtd.</label>
          <input type="number" class="mu_qtd" min="0.01" step="0.01" value="1">
        </div>
        <button type="button" class="icon-btn danger mu_remover" style="margin-bottom:14px;">×</button>
      </div>
    `;
  }

  function recalcular(){
    let total = 0;
    listaEl.querySelectorAll('.linha-material').forEach(linha => {
      const sel = linha.querySelector('.mu_material');
      const qtd = Number(linha.querySelector('.mu_qtd').value) || 0;
      const opt = sel.selectedOptions[0];
      if(!opt || !opt.value) return;
      total += (Number(opt.dataset.preco) || 0) * qtd;
    });
    const tempo = Number(document.getElementById(`${prefixo}_tempo`).value) || 0;
    const custoHora = Number(document.getElementById(`${prefixo}_custohora`).value) || 0;
    const custoProducao = tempo * custoHora;
    const sugerido = total + custoProducao;
    const box = document.getElementById(`${prefixo}_preco_sugerido`);
    if(total > 0 || tempo > 0){
      box.style.display = 'block';
      box.innerHTML = `Materiais: <strong>${formatAOA(total)}</strong> + Produção (${tempo}h × ${formatAOA(custoHora)}): <strong>${formatAOA(custoProducao)}</strong><br>Preço sugerido: <strong style="color:var(--caramelo-light);">${formatAOA(sugerido)}</strong><br><span style="font-size:11px; color:var(--linho-dim);">Já preenchido em "A pagar" — pode ajustar à vontade.</span>`;
      if(campoApagar && !campoApagar.dataset.editadoManualmente){
        campoApagar.value = Math.round(sugerido);
      }
    } else {
      box.style.display = 'none';
    }
  }

  function adicionarLinha(){
    const idx = contador++;
    const div = document.createElement('div');
    div.innerHTML = linhaHTML(idx);
    const linha = div.firstElementChild;
    listaEl.appendChild(linha);
    linha.querySelector('.mu_material').addEventListener('change', recalcular);
    linha.querySelector('.mu_qtd').addEventListener('input', recalcular);
    linha.querySelector('.mu_remover').addEventListener('click', () => { linha.remove(); recalcular(); });
  }

  document.getElementById(`${prefixo}_materiais_add`).addEventListener('click', adicionarLinha);
  document.getElementById(`${prefixo}_tempo`).addEventListener('input', recalcular);
  document.getElementById(`${prefixo}_custohora`).addEventListener('input', () => {
    localStorage.setItem(CHAVE_CUSTO_HORA, document.getElementById(`${prefixo}_custohora`).value || '4400');
    recalcular();
  });
  if(campoApagar){
    campoApagar.addEventListener('input', () => { campoApagar.dataset.editadoManualmente = '1'; });
  }
  adicionarLinha();
}

// Lê as linhas de materiais preenchidas no formulário — devolve tanto o
// detalhe (para guardar na obra) como o total (para o custo da peça).
function lerMateriaisUsados(prefixo){
  const linhas = [];
  document.querySelectorAll(`#${prefixo}_materiais_lista .linha-material`).forEach(linha => {
    const sel = linha.querySelector('.mu_material');
    const qtd = Number(linha.querySelector('.mu_qtd').value) || 0;
    const opt = sel.selectedOptions[0];
    if(!opt || !opt.value || qtd <= 0) return;
    const custoUnitario = Number(opt.dataset.preco) || 0;
    linhas.push({
      material_id: opt.value,
      descricao: opt.textContent,
      quantidade: qtd,
      custo_unitario: custoUnitario,
      subtotal: custoUnitario * qtd
    });
  });
  const custoMateriais = linhas.reduce((s, l) => s + l.subtotal, 0);
  const tempo = Number(document.getElementById(`${prefixo}_tempo`)?.value) || 0;
  const custoHora = Number(document.getElementById(`${prefixo}_custohora`)?.value) || 0;
  return {
    materiais_usados: linhas,
    custo_materiais: custoMateriais,
    tempo_producao_horas: tempo,
    custo_producao: tempo * custoHora
  };
}

// Desconta do stock os materiais gastos numa obra recém-registada. Não
// bloqueia o registo da obra se falhar — o stock fica só por corrigir
// manualmente depois, o pedido do cliente não pode ficar preso a isto.
async function descontarMateriaisDoStock(linhasMateriais){
  if(!linhasMateriais || linhasMateriais.length === 0) return;
  for(const linha of linhasMateriais){
    try{
      const { data: mat } = await sb.from('materiais').select('quantidade_atual').eq('id', linha.material_id).maybeSingle();
      if(!mat) continue;
      const novaQtd = Math.max(0, Number(mat.quantidade_atual) - Number(linha.quantidade));
      await sb.from('materiais').update({ quantidade_atual: novaQtd, atualizado_em: new Date().toISOString() }).eq('id', linha.material_id);
    }catch(_e){ /* stock fica por corrigir manualmente, não bloqueia a obra */ }
  }
}

/* ------------------------------------------------------------
   NEGÓCIO — vendas, clientes e saúde financeira, calculados a
   partir dos dados reais (obras/despesas/custos fixos). Sem
   dados inventados: o que não é possível calcular com o que
   existe hoje aparece assinalado como tal.
   ------------------------------------------------------------ */
async function renderMarketingTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar…</div>`;
  try{
    const agora = new Date();
    const inicioMesAtual = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString();

    const [{ data: obrasMesAtual, error: e1 }, { data: contactos, error: e2 }] = await Promise.all([
      sb.from('obras').select('tipo_servico').gte('criado_em', inicioMesAtual),
      sb.from('contactos_interessados').select('id').order('criado_em', { ascending: false })
    ]);
    if(e1) throw e1;
    // A tabela de contactos pode ainda não existir em projetos mais antigos —
    // nesse caso apenas escondemos o contador, sem quebrar a página.
    const totalContactos = e2 ? null : (contactos || []).length;

    const contagemServicos = {};
    (obrasMesAtual||[]).forEach(o => { contagemServicos[o.tipo_servico] = (contagemServicos[o.tipo_servico]||0) + 1; });
    const topServicos = Object.entries(contagemServicos).sort((a,b)=>b[1]-a[1]).slice(0,5);

    container.innerHTML = `
      <div class="negocio-section">
        <h3 class="negocio-h">O que está a vender mais este mês</h3>
        ${topServicos.length > 0 ? `
          <div class="section-eyebrow" style="margin-bottom:8px;">Serviços mais pedidos</div>
          ${topServicos.map(([tipo,qtd],i) => `
            <div class="ranking-row"><span class="mono">#${i+1}</span> ${esc(tipo)} <span class="mono" style="color:var(--caramelo-light); margin-left:auto;">${qtd}x</span></div>
          `).join('')}
          <p style="font-size:12px; color:var(--linho-dim); margin-top:10px;">Sugestão: promova mais os serviços do topo desta lista — já são os que mais procuram.</p>
        ` : `<div class="empty-state-small">Ainda não há obras registadas este mês.</div>`}
      </div>

      <div class="negocio-section">

// Lista, no painel do CEO, cada um dos looks com a opção de carregar uma
// foto real (substitui o manequim em SVG nesse look, em toda a app).
async function renderFotosLooksAdmin(){
  await carregarLooksFotos();
  const el = document.getElementById('fotosLooksLista');
  if(!el) return;

  el.innerHTML = LOOKS_ESTILISTA.map(look => `
    <div style="display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);">
      <div style="width:70px; height:100px; flex-shrink:0; overflow:hidden;">${renderLookVisualHTML(look)}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:12px; color:var(--linho); margin-bottom:6px;">${esc(look.texto)}</div>
        <input type="file" accept="image/*" id="fotoInput_${look.slug}" style="font-size:11px; max-width:100%;">
        <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
          <button type="button" class="icon-btn" data-upload-look="${look.slug}" style="font-size:11px; padding:4px 10px;">Carregar foto</button>
          ${LOOKS_FOTOS_CACHE[look.slug] ? `<button type="button" class="icon-btn" data-remover-look="${look.slug}" style="font-size:11px; padding:4px 10px;">Remover foto</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('[data-upload-look]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const slug = btn.dataset.uploadLook;
      const input = document.getElementById('fotoInput_'+slug);
      const file = input && input.files && input.files[0];
      if(!file){ alert('Escolha uma foto primeiro.'); return; }
      const v = validateFile(file);
      if(!v.ok || v.tipo !== 'imagem'){ alert(v.ok ? 'Escolha uma imagem.' : v.mensagem); return; }

      const textoOriginal = btn.textContent;
      btn.textContent = 'A carregar…';
      btn.disabled = true;
      try{
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${slug}-${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('dionuel-looks').upload(path, file, { cacheControl: '3600', upsert: true });
        if(upErr) throw upErr;
        const { data: pub } = sb.storage.from('dionuel-looks').getPublicUrl(path);
        const { error: dbErr } = await sb.from('looks_fotos').upsert({ slug, foto_url: pub.publicUrl, atualizado_em: new Date().toISOString() });
        if(dbErr) throw dbErr;
        LOOKS_FOTOS_CACHE[slug] = pub.publicUrl;
        showToast('Foto carregada ✓');
        renderFotosLooksAdmin();
      }catch(e){
        alert('Não foi possível carregar: ' + (e.message || 'erro desconhecido'));
        btn.textContent = textoOriginal;
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll('[data-remover-look]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const slug = btn.dataset.removerLook;
      if(!confirm('Remover a foto e voltar ao manequim desenhado?')) return;
      try{
        const { error } = await sb.from('looks_fotos').delete().eq('slug', slug);
        if(error) throw error;
        delete LOOKS_FOTOS_CACHE[slug];
        showToast('Foto removida ✓');
        renderFotosLooksAdmin();
      }catch(e){ alert('Não foi possível remover: ' + (e.message || 'erro desconhecido')); }
    });
  });
}

// Backup completo — junta as tabelas principais num único ficheiro
// para descarregar. Não sobe automaticamente ao Google Drive (isso
// exige ligar oficialmente a conta Google, feito uma vez); por agora,
// é descarregar e arrastar para uma pasta do Drive.
async function gerarBackupCompleto(){
  const tabelas = ['usuarios','obras','despesas','encomendas','produtos','materiais','contactos_interessados','notificacoes_sistema'];
  const backup = { gerado_em: new Date().toISOString() };
  for(const t of tabelas){
    try{
      const { data, error } = await sb.from(t).select('*');
      backup[t] = error ? { erro: error.message } : data;
    }catch(e){ backup[t] = { erro: e.message }; }
  }
  return backup;
}

async function baixarBackupJSON(btn){
  const textoOriginal = btn.textContent;
  btn.textContent = 'A preparar backup…';
  btn.disabled = true;
  try{
    const backup = await gerarBackupCompleto();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-dionuel-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup descarregado ✓');
  }catch(e){
    alert('Não foi possível gerar o backup: ' + (e.message || 'erro desconhecido'));
  }finally{
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }
}

function showToast(msg){
  let t = document.querySelector('.save-toast-gestao');
  if(!t){
    t = document.createElement('div');
    t.className = 'save-toast-gestao';
    t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--caramelo); color:var(--carvao); font-size:13px; font-weight:700; padding:10px 18px; border-radius:30px; z-index:100; box-shadow:0 6px 16px rgba(0,0,0,0.4); opacity:0; transition:opacity .25s ease;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 1800);
}

// Cache das fotos reais dos looks (carregada uma vez por sessão).
// slug -> url da foto. Fica vazio (e tudo cai no SVG) se a tabela
// "looks_fotos" ainda não tiver sido criada, ou não houver fotos.
let LOOKS_FOTOS_CACHE = null;
async function carregarLooksFotos(){
  if(LOOKS_FOTOS_CACHE) return LOOKS_FOTOS_CACHE;
  LOOKS_FOTOS_CACHE = {};
  try{
    const { data, error } = await sb.from('looks_fotos').select('slug, foto_url');
    if(error) throw error;
    (data||[]).forEach(r => { LOOKS_FOTOS_CACHE[r.slug] = r.foto_url; });
  }catch(e){ /* tabela ainda não existe — segue tudo em SVG */ }
  return LOOKS_FOTOS_CACHE;
}

// Devolve o HTML do visual do look: foto real se já tiver sido
// carregada para este slug, senão o manequim em SVG.
function renderLookVisualHTML(look){
  const foto = LOOKS_FOTOS_CACHE && LOOKS_FOTOS_CACHE[look.slug];
  if(foto){
    return `<img src="${escAttr(foto)}" alt="${escAttr(look.texto)}" style="width:150px; height:220px; object-fit:cover; border-radius:6px; display:block; margin:0 auto;">`;
  }
  return svgManequimHTML(look);
}

async function ativarMotorLooks(prefix){
  const selCat = document.getElementById(prefix+'_cat');
  const selOca = document.getElementById(prefix+'_oca');
  const manequimEl = document.getElementById(prefix+'_manequim');
  const textoEl = document.getElementById(prefix+'_texto');
  const proximoBtn = document.getElementById(prefix+'_proximo');
  const ctaBtn = document.getElementById(prefix+'_cta');
  if(!selCat || !manequimEl) return;

  await carregarLooksFotos();

  let filtrados = LOOKS_ESTILISTA.slice();
  let idx = 0;

  function mostrar(){
    const look = filtrados[idx];
    manequimEl.innerHTML = renderLookVisualHTML(look);
    textoEl.textContent = look.texto;
    if(ctaBtn){
      const msg = `Olá! Vi este look na vitrine da Dionuel e gostava de pedir algo parecido: ${look.texto}`;
      ctaBtn.href = `https://wa.me/${REDES_DIONUEL.whatsapp}?text=${encodeURIComponent(msg)}`;
    }
  }

  function aplicarFiltro(){
    filtrados = LOOKS_ESTILISTA.filter(l =>
      (selCat.value === 'todos' || l.categoria === selCat.value) &&
      (selOca.value === 'todos' || l.ocasiao === selOca.value)
    );
    if(filtrados.length === 0) filtrados = LOOKS_ESTILISTA;
    idx = 0;
    mostrar();
  }

  selCat.addEventListener('change', aplicarFiltro);
  selOca.addEventListener('change', aplicarFiltro);
  proximoBtn.addEventListener('click', () => {
    idx = (idx + 1) % filtrados.length;
    mostrar();
  });

  idx = Math.floor(Math.random()*filtrados.length);
  mostrar();
}

// Manequim em SVG — sem fotos (leve, funciona com pouca internet).
// "categoria" ajusta proporções e o corte de cabelo: homem adulto,
// criança (mais baixo) e mulher (silhueta com cintura marcada).
// Escurece/aclara um hex — usado para dar sombra/gradiente ao tecido do
// manequim (ex.: sombrear('#1c2b45', -30) fica mais escuro).
function sombrear(hex, percent){
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(Math.min(255,r),0); g = Math.max(Math.min(255,g),0); b = Math.max(Math.min(255,b),0);
  return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
}

function escolherFrase(percentagem, temMeta){
  if(!temMeta) return null;
  let grupo;
  if(percentagem === 0) grupo = 'vazio';
  else if(percentagem < 30) grupo = 'baixo';
  else if(percentagem < 70) grupo = 'medio';
  else if(percentagem < 100) grupo = 'alto';
  else if(percentagem === 100) grupo = 'atingida';
  else grupo = 'superada';
  const lista = FRASES_META[grupo];
  return { texto: lista[Math.floor(Math.random() * lista.length)], grupo };
}

// Protege qualquer texto escrito por uma pessoa (nome, descrição, etc.)
// antes de o inserir na página. Sem isto, alguém poderia escrever
// código em vez de um nome normal, e esse código executaria no ecrã
// de outra pessoa que visse esse dado (ex: o CEO a ver obras de todos).
function esc(texto){
  if(texto === null || texto === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(texto);
  return div.innerHTML;
}

// Versão para usar dentro de atributos (ex: value="${escAttr(x)}"), que
// também protege as aspas — sem isso, um valor com aspas poderia
// "escapar" do atributo e inserir código na página.
function escAttr(texto){
  if(texto === null || texto === undefined) return '';
  return String(texto)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function formatAOA(n){

}

// Liga o comportamento da gaveta de medidas depois de inserida no DOM:
// alterna entre os blocos de homem/mulher-vestido/mulher-fato e filtra
// em tempo real os caracteres aceites em cada campo de medida.
function ativarMedidasBloco(prefix){
  const sel = document.getElementById(prefix+'_sexo');
  const selPeca = document.getElementById(prefix+'_tipo_peca');
  const pecaWrap = document.getElementById(prefix+'_tipo_peca_wrap');
  const blocoHomem = document.getElementById(prefix+'_bloco_homem');
  const blocoVestido = document.getElementById(prefix+'_bloco_mulher_vestido');
  const blocoFato = document.getElementById(prefix+'_bloco_mulher_fato');
  if(!sel || !blocoHomem || !blocoVestido || !blocoFato) return;

  const atualizarBlocosVisiveis = () => {
    const sexo = sel.value;
    const peca = selPeca ? selPeca.value : 'vestido';
    pecaWrap.style.display = sexo === 'mulher' ? '' : 'none';
    blocoHomem.style.display = sexo === 'homem' ? '' : 'none';
    blocoVestido.style.display = sexo === 'mulher' && peca === 'vestido' ? '' : 'none';
    blocoFato.style.display = sexo === 'mulher' && peca === 'fato' ? '' : 'none';
  };

  sel.addEventListener('change', atualizarBlocosVisiveis);
  if(selPeca) selPeca.addEventListener('change', atualizarBlocosVisiveis);

  [...blocoHomem.querySelectorAll('.medida-input'), ...blocoVestido.querySelectorAll('.medida-input'), ...blocoFato.querySelectorAll('.medida-input')].forEach(inp => {
    inp.addEventListener('input', () => {
      const semSinaisProibidos = inp.value.replace(MEDIDA_CHARS_PERMITIDOS, '');
      if(semSinaisProibidos !== inp.value) inp.value = semSinaisProibidos;
    });
  });
}

// Devolve o sufixo de bloco (usado nos ids dos campos) para um par
// sexo/tipoPeca — tem de bater certo com o usado em medidasGridHTML.
function sufixoBlocoFor(sexo, tipoPeca){
  if(sexo === 'mulher') return tipoPeca === 'fato' ? 'mf' : 'mv';
  return 'h';
}

// Lê os valores preenchidos na gaveta de medidas e devolve um objeto
// pronto a guardar na coluna "medidas" (jsonb), ou null se nada foi
// preenchido.
function coletarMedidas(prefix){
  const sel = document.getElementById(prefix+'_sexo');
  const selPeca = document.getElementById(prefix+'_tipo_peca');
  const sexo = sel && sel.value === 'mulher' ? 'mulher' : 'homem';
  const tipoPeca = sexo === 'mulher' && selPeca && selPeca.value === 'fato' ? 'fato' : 'vestido';
  const lista = listaMedidasFor(sexo, tipoPeca);
  const sufixo = sufixoBlocoFor(sexo, tipoPeca);

  const medidas = { sexo };
  if(sexo === 'mulher') medidas.tipo_peca = tipoPeca;
  lista.forEach(([key]) => {
    const el = document.getElementById(prefix+'_'+sufixo+'_'+key);
    if(el && el.value.trim()) medidas[key] = el.value.trim();
  });
  const outras = document.getElementById(prefix+'_outras_medidas');
  if(outras && outras.value.trim()) medidas.outras_medidas = outras.value.trim();
  // "sexo" (e "tipo_peca") estão sempre presentes — só devolve algo se
  // houver mais do que isso.
  const baseKeys = sexo === 'mulher' ? 2 : 1;
  return Object.keys(medidas).length > baseKeys ? medidas : null;
}

// Transforma o objeto de medidas guardado num texto legível para o
// resumo do dia (ex.: "Pescoço: 38 · Cintura: 74-76"). Os valores são
// escapados porque, sendo texto livre escrito por uma pessoa, entram
// depois num innerHTML noutra parte do painel.
function medidasResumoTexto(medidas){
  if(!medidas) return '';
  const rotulos = {};
  MEDIDAS_HOMEM.forEach(([k,l]) => rotulos[k] = l);
  MEDIDAS_MULHER_FATO.forEach(([k,l]) => rotulos[k] = l);
  MEDIDAS_MULHER_VESTIDO.forEach(([k,l]) => rotulos[k] = l);
  rotulos.outras_medidas = 'Outras medidas';
  rotulos.tipo_peca = 'Peça';
  const TIPO_PECA_LABEL = { fato: 'Fato / conjunto', vestido: 'Vestido' };

  return Object.entries(medidas)
    .filter(([k,v]) => k !== 'sexo' && v)
    .map(([k,v]) => `${esc(rotulos[k] || k)}: ${esc(k === 'tipo_peca' ? (TIPO_PECA_LABEL[v] || v) : v)}`)
    .join(' · ');
}

// Preenche a gaveta de medidas (já criada por medidasGridHTML/ativarMedidasBloco)
// com os valores de uma obra anterior do mesmo cliente — poupa ter de
// medir outra vez algo que já foi medido numa visita anterior.
function preencherMedidasNoForm(prefix, medidas){
  const detalhes = document.querySelector(`#${prefix}_sexo`)?.closest('details');
  if(detalhes) detalhes.open = true;

  const sexo = medidas.sexo === 'mulher' ? 'mulher' : 'homem';
  const tipoPeca = medidas.tipo_peca === 'fato' ? 'fato' : 'vestido';
  const sel = document.getElementById(prefix + '_sexo');
  const selPeca = document.getElementById(prefix + '_tipo_peca');
  if(sel){ sel.value = sexo; sel.dispatchEvent(new Event('change')); }
  if(selPeca){ selPeca.value = tipoPeca; selPeca.dispatchEvent(new Event('change')); }

  const lista = listaMedidasFor(sexo, tipoPeca);
  const sufixo = sufixoBlocoFor(sexo, tipoPeca);
  lista.forEach(([key]) => {
    const el = document.getElementById(prefix + '_' + sufixo + '_' + key);
    if(el) el.value = medidas[key] || '';
  });
  const outras = document.getElementById(prefix + '_outras_medidas');
  if(outras) outras.value = medidas.outras_medidas || '';
}

// Gera um código de verificação de 4 caracteres, no mesmo formato usado
// pela AGT nos documentos certificados (posições específicas de uma
// assinatura). IMPORTANTE: isto é um código preparatório/simulado,
// calculado localmente a partir dos dados do documento — não é uma
// assinatura criptográfica emitida pela AGT, que só existe depois da
// certificação oficial do software.
async function gerarCodigoVerificacao(texto){
  const encoder = new TextEncoder();
  const data = encoder.encode(texto);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 4).toUpperCase();
}

// Emite um documento fiscal formal (Factura, Factura-Recibo ou Recibo)
// para a obra indicada: obtém o próximo número sequencial de forma
// segura (via função no Supabase, protegida contra duplicação mesmo
// com dois pedidos em simultâneo), regista o documento de forma
// permanente (nunca pode ser editado/apagado depois), e gera o PDF.
async function emitirFatura(obra, tipoDocumento, clienteNif, nomeEmissor){
  const ano = new Date().getFullYear();
  const serie = String(ano);

  const { data: numero, error: erroNumero } = await sb.rpc('proximo_numero_fatura', {
    p_tipo: tipoDocumento, p_serie: serie, p_ano: ano
  });
  if(erroNumero) throw erroNumero;

  const numeroCompleto = `${tipoDocumento} ${serie}/${numero}`;
  const textoParaCodigo = `${numeroCompleto}|${obra.cliente_nome}|${obra.valor_a_pagar}|${new Date().toISOString()}`;
  const codigoVerificacao = await gerarCodigoVerificacao(textoParaCodigo);

  const { data: fatura, error: erroInsert } = await sb.from('faturas').insert({
    obra_id: obra.id,
    tipo_documento: tipoDocumento,
    serie,
    numero_sequencial: numero,
    ano,
    numero_completo: numeroCompleto,
    cliente_nome: obra.cliente_nome,
    cliente_nif: clienteNif || null,
    valor_total: Number(obra.valor_a_pagar || 0),
    valor_pago: Number(obra.valor_pago || 0),
    descricao: `${obra.tipo_servico}${obra.descricao ? ' — ' + obra.descricao : ''}`,
    codigo_verificacao: codigoVerificacao,
    emitido_por: currentAuthUser.id
  }).select().maybeSingle();
  if(erroInsert) throw erroInsert;

  gerarFaturaPDF(fatura, nomeEmissor);
  return fatura;
}

/* ======================================================================
   CORRIDA DO CLIENTE — fidelidade e indicação com crédito real.
   Duas frentes, ligadas ao registo de cada obra:
   1) Peça grátis por volume: 10 obras do mesmo tipo, no mesmo cliente,
      no mês corrente, dá direito a uma peça grátis desse tipo.
   2) Escada de indicação: quem indica sobe 10% de desconto (até 100%)
      quando o indicado faz a 1ª obra. Se esse indicado chegar a 2+
      obras, a indicação conta a dobrar (2 níveis em vez de 1). Nível
      1-3 vale 1 semana de desconto; nível 4-10 vale 2 semanas. Tudo
      reinicia no mês seguinte.
   Sem WhatsApp do cliente não é possível segui-lo nesta corrida — por
   isso o campo, embora continue opcional, é fortemente recomendado.
   ====================================================================== */

function normalizarTelefone(tel){
  const digitos = (tel || '').replace(/\D/g, '');
  return digitos.length >= 8 ? digitos : null;
}

function inicioDoMesAtualDate(){
  const agora = new Date();
  return new Date(agora.getFullYear(), agora.getMonth(), 1);
}

// Vai buscar o registo do cliente pelo telefone normalizado; cria um novo
// se ainda não existir. Mantém sempre o nome mais recente informado.
async function obterOuCriarCliente(nome, telefoneNorm){
  const { data: existente, error: selErr } = await sb.from('clientes').select('*').eq('telefone', telefoneNorm).maybeSingle();
  if(selErr) throw selErr;
  if(existente){
    if(nome && nome !== existente.nome){
      await sb.from('clientes').update({ nome }).eq('id', existente.id);
      existente.nome = nome;
    }
    return existente;
  }
  const { data: novo, error: insErr } = await sb.from('clientes').insert({ nome: nome || null, telefone: telefoneNorm }).select().maybeSingle();
  if(insErr) throw insErr;
  return novo;
}

// Liga o cliente a quem o indicou — só na primeira vez (não deixa
// reescrever depois de já estar definido, para não perder o mérito de
// quem indicou primeiro).
async function ligarIndicacaoSeAplicavel(clienteRow, indicadoPorTelRaw){
  if(clienteRow.indicado_por_telefone) return clienteRow;
  const telIndicador = normalizarTelefone(indicadoPorTelRaw);
  if(!telIndicador || telIndicador === clienteRow.telefone) return clienteRow;
  await sb.from('clientes').update({ indicado_por_telefone: telIndicador }).eq('id', clienteRow.id);
  clienteRow.indicado_por_telefone = telIndicador;
  return clienteRow;
}

// Soma níveis ao indicador, reiniciando a contagem se mudou de mês, e
// devolve o novo estado (nível, percentagem, prazo) para mostrar à equipa.
async function creditarIndicador(telefoneIndicador, niveisASomar){
  const { data: indicador, error } = await sb.from('clientes').select('*').eq('telefone', telefoneIndicador).maybeSingle();
  if(error || !indicador) return null;

  const inicioMes = inicioDoMesAtualDate();
  const mesContagemAtual = indicador.mes_contagem ? new Date(indicador.mes_contagem) : null;
  const mesmoMs = mesContagemAtual && mesContagemAtual.getFullYear() === inicioMes.getFullYear() && mesContagemAtual.getMonth() === inicioMes.getMonth();
  const nivelBase = mesmoMs ? (indicador.indicacoes_nivel || 0) : 0;

  const novoNivel = Math.min(10, nivelBase + niveisASomar);
  const diasValidade = novoNivel <= 3 ? 7 : 14;
  const expiraEm = new Date(Date.now() + diasValidade * 24 * 60 * 60 * 1000);

  await sb.from('clientes').update({
    indicacoes_nivel: novoNivel,
    desconto_expira_em: expiraEm.toISOString(),
    mes_contagem: inicioMes.toISOString().slice(0, 10)
  }).eq('id', indicador.id);

  return { telefone: indicador.telefone, nome: indicador.nome, nivel: novoNivel, pct: novoNivel * 10, expiraEm };
}

// Chamada logo depois de gravar uma obra. Trata as duas frentes do
// programa (peça grátis por volume e escada de indicação) e devolve um
// resumo simples para a equipa saber o que aconteceu.
async function processarFidelidadeAposObra({ nome, telefoneRaw, indicadoPorTelRaw, tipoServico }){
  const telefoneNorm = normalizarTelefone(telefoneRaw);
  if(!telefoneNorm) return { semTelefone: true };

  const resumo = { semTelefone: false, pecaGratisGanha: false, indicadorCreditado: null };

  try{
    let cliente = await obterOuCriarCliente(nome, telefoneNorm);
    cliente = await ligarIndicacaoSeAplicavel(cliente, indicadoPorTelRaw);

    // 1) Peça grátis por volume (10 obras do mesmo tipo, no mês corrente)
    if(tipoServico){
      const inicioMesISO = inicioDoMesAtualDate().toISOString();
      const { data: obrasDoTipo } = await sb.from('obras')
        .select('id')
        .eq('cliente_telefone', telefoneNorm)
        .eq('tipo_servico', tipoServico)
        .gte('criado_em', inicioMesISO);
      const total = (obrasDoTipo || []).length;
      if(total > 0 && total % 10 === 0){
        await sb.from('pecas_gratis').insert({
          cliente_telefone: telefoneNorm,
          cliente_nome: nome || cliente.nome,
          tipo_servico: tipoServico,
          mes_referencia: inicioDoMesAtualDate().toISOString().slice(0, 10)
        });
        resumo.pecaGratisGanha = true;
        resumo.tipoServico = tipoServico;
      }
    }

    // 2) Indicação — valida na 1ª obra do indicado; sobe a dobrar se ele
    // já tiver mais de uma peça.
    if(cliente.indicado_por_telefone && (cliente.indicacao_niveis_aplicados || 0) < 2){
      const { data: todasObras } = await sb.from('obras').select('id').eq('cliente_telefone', telefoneNorm);
      const totalObras = (todasObras || []).length;
      const jaAplicados = cliente.indicacao_niveis_aplicados || 0;
      let niveisASomar = 0;
      let novosAplicados = jaAplicados;

      if(jaAplicados === 0){
        niveisASomar = totalObras >= 2 ? 2 : 1;
        novosAplicados = niveisASomar;
      } else if(jaAplicados === 1 && totalObras >= 2){
        niveisASomar = 1;
        novosAplicados = 2;
      }

      if(niveisASomar > 0){
        await sb.from('clientes').update({ indicacao_niveis_aplicados: novosAplicados }).eq('id', cliente.id);
        resumo.indicadorCreditado = await creditarIndicador(cliente.indicado_por_telefone, niveisASomar);
      }
    }
  }catch(e){
    // O programa de fidelidade nunca deve impedir o registo da obra —
    // se algo falhar aqui (ex.: tabelas ainda não criadas), a obra já
    // foi gravada e só a parte da corrida fica por atualizar.
    resumo.erro = e.message || 'Verifique se as tabelas "clientes" e "pecas_gratis" já existem na base de dados.';
  }
  return resumo;
}

/* ======================================================================
   DÍVIDAS — duas frentes: quem deve ao ateliê (clientes com saldo em
   aberto nas obras) e o que o ateliê deve (fornecedores/contas a pagar,
   tabela própria). Cada devedor tem um botão de lembrete por WhatsApp;
   contas a pagar vencidas ficam destacadas a vermelho ao abrir a aba.
   ====================================================================== */
async function renderDividasTab(container){
  container.innerHTML = `<div class="loading-screen"><span class="spinner-css"></span> A carregar…</div>`;
  try{
    const { data: obras, error: e1 } = await sb.from('obras').select('id, cliente_nome, cliente_telefone, tipo_servico, valor_a_pagar, valor_pago, criado_em');
    if(e1) throw e1;

    const porCliente = {};
    (obras || []).forEach(o => {
      const emFalta = Number(o.valor_a_pagar || 0) - Number(o.valor_pago || 0);
      if(emFalta <= 0) return;
      const chave = o.cliente_telefone || o.cliente_nome || o.id;
      if(!porCliente[chave]) porCliente[chave] = { nome: o.cliente_nome, telefone: o.cliente_telefone, total: 0, pecas: [] };
      porCliente[chave].total += emFalta;
      porCliente[chave].pecas.push({ tipo: o.tipo_servico, emFalta, data: o.criado_em });
    });
    const devedores = Object.values(porCliente).sort((a, b) => b.total - a.total);
    const totalADeverNos = devedores.reduce((s, d) => s + d.total, 0);

    let contasAPagar = [];
    let erroContasAPagar = null;
    try{
      const { data, error } = await sb.from('contas_a_pagar').select('*').order('data_vencimento', { ascending: true });
      if(error) throw error;
      contasAPagar = data || [];
    }catch(e){ erroContasAPagar = e.message || 'Tabela "contas_a_pagar" ainda não existe.'; }

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const pendentes = contasAPagar.filter(c => c.estado !== 'pago');
    const totalDevemos = pendentes.reduce((s, c) => s + (Number(c.valor||0) - Number(c.valor_pago||0)), 0);

    container.innerHTML = `
      <div class="page-head">
        <h2>Dívidas</h2>
        <p>Quem ainda deve ao ateliê, e o que o ateliê ainda deve a fornecedores/terceiros.</p>
      </div>

      <div class="negocio-section">
        <h3 class="negocio-h">Quem nos deve (${devedores.length})</h3>
        <div class="totals-bar" style="margin-bottom:14px;">Total em aberto: <strong style="color:var(--caramelo-light);">${formatAOA(totalADeverNos)}</strong></div>
        ${devedores.length === 0 ? '<div class="empty-state-small">Ninguém em dívida neste momento.</div>' : devedores.map(d => `
          <div class="obra-card">
            <div class="obra-top">
              <div>
                <div class="obra-cliente">${esc(d.nome || 'Cliente não identificado')}</div>
                <div class="obra-tipo">${esc(d.telefone || 'sem WhatsApp guardado')} · ${d.pecas.length} peça(s) em aberto</div>
              </div>
              <strong style="color:var(--caramelo-light);">${formatAOA(d.total)}</strong>
            </div>
            ${d.telefone ? `<a class="wa-notify-btn" target="_blank" rel="noopener" href="https://wa.me/${esc(d.telefone.replace(/\D/g,''))}?text=${encodeURIComponent(`Olá ${d.nome || ''}! Este é um lembrete da Dionuel: tem ${formatAOA(d.total)} em aberto connosco. Quando puder regularizar, agradecemos.`)}">Lembrar dívida (WhatsApp)</a>` : '<div class="wa-notify-missing">Sem WhatsApp guardado — não é possível enviar lembrete automático.</div>'}
          </div>
        `).join('')}
      </div>

      <div class="negocio-section">
        <h3 class="negocio-h">O que devemos (${pendentes.length})</h3>
        ${erroContasAPagar ? `<div class="error-banner">Não foi possível carregar: ${esc(erroContasAPagar)}</div>` : `
          <div class="totals-bar" style="margin-bottom:14px;">Total em aberto: <strong style="color:var(--caramelo-light);">${formatAOA(totalDevemos)}</strong></div>
          <div id="contasAPagarLista">
            ${pendentes.length === 0 ? '<div class="empty-state-small">Sem contas pendentes.</div>' : pendentes.map(c => {
              const vencimento = c.data_vencimento ? new Date(c.data_vencimento) : null;
              const vencida = vencimento && vencimento < hoje;
              const emFalta = Number(c.valor||0) - Number(c.valor_pago||0);
              return `
                <div class="obra-card" style="${vencida ? 'border-color:var(--giz);' : ''}">
                  <div class="obra-top">
                    <div>
                      <div class="obra-cliente">${esc(c.fornecedor)} ${vencida ? '<span style="color:var(--giz); font-size:11.5px;">— vencida</span>' : ''}</div>
                      <div class="obra-tipo">${esc(c.descricao || '')} ${vencimento ? '· vence ' + vencimento.toLocaleDateString('pt-PT') : ''}</div>
                    </div>
                    <strong style="color:var(--caramelo-light);">${formatAOA(emFalta)}</strong>
                  </div>
                  <button type="button" class="icon-btn" data-pagar-conta="${c.id}" style="margin-top:8px;">Marcar como paga</button>
                </div>

          <details class="medidas-bloco" style="margin-top:16px;">
            <summary>Nova conta a pagar</summary>
            <div class="medidas-drawer-body">
              <div class="field"><label>Fornecedor / a quem devemos</label><input id="cap_fornecedor" type="text"></div>
