              <button class="btn-submit" id="cap_submit">Guardar</button>
            </div>
          </details>
        `}
      </div>
    `;

    container.querySelectorAll('[data-pagar-conta]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.textContent = 'A guardar…';
        btn.disabled = true;
        try{
          const { error } = await sb.from('contas_a_pagar').update({ estado: 'pago' }).eq('id', btn.dataset.pagarConta);
          if(error) throw error;
          showToast('Conta marcada como paga');
          await renderDividasTab(container);
        }catch(e){
          alert('Não foi possível guardar: ' + (e.message || 'erro desconhecido'));
          btn.textContent = 'Marcar como paga';
          btn.disabled = false;
        }
      });
    });

    const capSubmit = document.getElementById('cap_submit');
    if(capSubmit){
      capSubmit.addEventListener('click', async () => {
        const erro = document.getElementById('cap_erro');
        erro.style.display = 'none';
        const fornecedor = document.getElementById('cap_fornecedor').value.trim();
        const valor = Number(document.getElementById('cap_valor').value);
        if(!fornecedor || !valor){
          erro.textContent = 'Indique pelo menos o fornecedor e o valor.';
          erro.style.display = 'block';
          return;
        }
        capSubmit.textContent = 'A guardar…';
        capSubmit.disabled = true;
        try{
          const { error } = await sb.from('contas_a_pagar').insert({
            fornecedor,
            descricao: document.getElementById('cap_desc').value.trim() || null,
            valor,
            valor_pago: 0,
            data_vencimento: document.getElementById('cap_vencimento').value || null,
            estado: 'pendente'
          });
          if(error) throw error;
          showToast('Conta registada ✓');
          await renderDividasTab(container);
        }catch(e){
          erro.textContent = 'Não foi possível guardar: ' + (e.message || 'erro desconhecido');
          erro.style.display = 'block';
          capSubmit.textContent = 'Guardar';
          capSubmit.disabled = false;
        }
      });
    }
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as dívidas: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

/* ======================================================================
   REQUISIÇÕES — cliente descreve o que quer (tecido, botões, prazo)
   antes de virar obra. Caderno de anotações (texto) + gravador de áudio
   (grava a conversa no próprio browser, sem aplicação externa). O áudio
   fica num espaço de armazenamento PRIVADO — nunca é público, e só é
   acedido por quem tem login, através de um link temporário.
   ====================================================================== */
async function renderRequisicoesTab(container){
  container.innerHTML = `<div class="loading-screen"><span class="spinner-css"></span> A carregar…</div>`;
  try{
    const { data: requisicoes, error } = await sb.from('requisicoes').select('*').order('criado_em', { ascending: false });
    if(error) throw error;

    container.innerHTML = `
      <div class="page-head">
        <h2>Requisições</h2>
        <p>O que o cliente pediu antes de virar obra: tecido, botões, referências, prazo — em texto e/ou em áudio.</p>
      </div>

      <details class="medidas-bloco" open>
        <summary>Nova requisição</summary>
        <div class="medidas-drawer-body">
          <div class="field"><label>Nome do cliente</label><input id="req_nome" type="text"></div>
          <div class="field"><label>WhatsApp do cliente</label><input id="req_tel" type="tel" placeholder="244900000000"></div>
          <div class="field"><label>Para mais ou menos que dia</label><input id="req_data" type="date"></div>
          <div class="field">
            <label>Caderno de anotações</label>
            <textarea id="req_notas" rows="5" placeholder="Ex.: quer um fato cinza-escuro, tecido de risca fina, botões em chifre, lapela em bico, para o casamento do irmão…"></textarea>
          </div>

          <div class="field">
            <label>Gravador — guarda a conversa com o cliente</label>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <button type="button" class="icon-btn" id="req_gravar_btn">Gravar áudio</button>
              <span id="req_gravar_estado" style="font-size:12px; color:var(--linho-dim);"></span>
            </div>
            <div id="req_audio_preview" style="margin-top:10px;"></div>
          </div>

          <div class="error-banner" id="req_erro" style="display:none;"></div>
          <button class="btn-submit" id="req_submit">Guardar requisição</button>
        </div>
      </details>

      <h3 class="negocio-h" style="margin-top:26px;">Requisições em aberto (${(requisicoes||[]).filter(r => r.estado !== 'arquivada').length})</h3>
      <div id="req_lista"></div>
    `;

    // --- Gravador de áudio (MediaRecorder do próprio browser) ---
    let mediaRecorder = null;
    let chunksAudio = [];
    let blobAudio = null;
    let cronometro = null;
    let segundos = 0;

    const gravarBtn = document.getElementById('req_gravar_btn');
    const estadoEl = document.getElementById('req_gravar_estado');
    const previewEl = document.getElementById('req_audio_preview');

    gravarBtn.addEventListener('click', async () => {
      if(mediaRecorder && mediaRecorder.state === 'recording'){
        mediaRecorder.stop();
        return;
      }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunksAudio = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) chunksAudio.push(e.data); };
        mediaRecorder.onstop = () => {
          blobAudio = new Blob(chunksAudio, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          clearInterval(cronometro);
          gravarBtn.textContent = 'Gravar áudio';
          estadoEl.textContent = '';
          const url = URL.createObjectURL(blobAudio);
          previewEl.innerHTML = `
            <audio controls src="${url}" style="width:100%; max-width:340px;"></audio>

          `;
          document.getElementById('req_audio_descartar').addEventListener('click', () => {

          });

        mediaRecorder.start();
        segundos = 0;
        gravarBtn.textContent = 'Parar gravação';
        estadoEl.textContent = '● a gravar 0:00';
        cronometro = setInterval(() => {
          segundos++;
          const m = Math.floor(segundos / 60);
          const s = String(segundos % 60).padStart(2, '0');
          estadoEl.textContent = `● a gravar ${m}:${s}`;
        }, 1000);
      }catch(e){
        alert('Não foi possível aceder ao microfone: ' + (e.message || 'permissão negada'));
      }

    document.getElementById('req_submit').addEventListener('click', async () => {
      const erro = document.getElementById('req_erro');
      erro.style.display = 'none';
      const nome = document.getElementById('req_nome').value.trim();
      const notas = document.getElementById('req_notas').value.trim();
      if(!nome || (!notas && !blobAudio)){
        erro.textContent = 'Indique pelo menos o nome do cliente, e uma anotação escrita ou um áudio gravado.';
        erro.style.display = 'block';
        return;
      }

      const btn = document.getElementById('req_submit');
      btn.textContent = 'A guardar…';
      btn.disabled = true;
      try{
        let audioPath = null;
        if(blobAudio){
          audioPath = `requisicoes/${Date.now()}_${Math.random().toString(36).slice(2,8)}.webm`;
          const { error: upErr } = await sb.storage.from('dionuel-requisicoes').upload(audioPath, blobAudio, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
        }
        const { error: insErr } = await sb.from('requisicoes').insert({
          cliente_nome: nome,
          cliente_telefone: document.getElementById('req_tel').value.trim() || null,
          data_pretendida: document.getElementById('req_data').value || null,
          notas: notas || null,
          audio_path: audioPath,
          estado: 'aberta',
          registado_por: currentAuthUser.id
        });
        if(insErr) throw insErr;
        showToast('Requisição guardada ✓');
        await renderRequisicoesTab(container);
      }catch(e){
        erro.textContent = 'Não foi possível guardar: ' + (e.message || 'erro desconhecido');
        erro.style.display = 'block';
        btn.textContent = 'Guardar requisição';
        btn.disabled = false;
      }
    });

    await renderRequisicoesLista(requisicoes || [], container);
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as requisições: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

  lista.innerHTML = abertas.map(r => `
    <div class="obra-card">

      <div class="req-audio-slot" data-audio-path="${escAttr(r.audio_path || '')}" style="margin-top:8px;"></div>

      try{
        const { error } = await sb.from('requisicoes').update({ estado: 'arquivada' }).eq('id', btn.dataset.arquivarReq);

  // O bucket é privado — o link do áudio é gerado na hora, com validade,
  // em vez de guardarmos uma URL pública fixa na base de dados.
  lista.querySelectorAll('[data-audio-path]').forEach(async (slot) => {

    }
  });
}

// --- IndexedDB: único sítio do browser que guarda ficheiros grandes
// (fotos, vídeo, áudio) de forma persistente — o localStorage só guarda
// texto. Usado para o rascunho de anexos ainda não enviados e para os
// anexos de obras que ficaram na fila offline. -------------------------
const RASCUNHOS_DB_NOME = 'dionuel_rascunhos';
const RASCUNHOS_STORE = 'media';

function abrirRascunhosDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(RASCUNHOS_DB_NOME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(RASCUNHOS_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function guardarMediaRascunho(chave, valor){
  try{
    const db = await abrirRascunhosDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(RASCUNHOS_STORE, 'readwrite');
      tx.objectStore(RASCUNHOS_STORE).put(valor, chave);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(_e){ /* sem IndexedDB — só perde a persistência de anexos, o resto funciona */ }
}
async function lerMediaRascunho(chave){
  try{
    const db = await abrirRascunhosDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(RASCUNHOS_STORE, 'readonly');
      const req = tx.objectStore(RASCUNHOS_STORE).get(chave);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(_e){ return null; }
}
async function apagarMediaRascunho(chave){
  try{
    const db = await abrirRascunhosDB();
    await new Promise((resolve) => {
      const tx = db.transaction(RASCUNHOS_STORE, 'readwrite');
      tx.objectStore(RASCUNHOS_STORE).delete(chave);
      tx.oncomplete = resolve;
      tx.onerror = () => resolve();
    });
  }catch(_e){ /* nada a apagar */ }
}
// Reconstrói um File a partir do que foi guardado no IndexedDB (nome e
// tipo ficam à parte porque um Blob puro não guarda nome de ficheiro).
function ficheiroDeRascunho(item){
  return item ? new File([item.blob], item.name || 'ficheiro', { type: item.type || item.blob.type }) : null;
}

// --- Fila offline genérica — várias tabelas, um único mecanismo --------
// Qualquer registo simples (texto/números) pode entrar nesta fila: sem
// internet, fica guardado no telemóvel e sobe sozinho quando a ligação
// voltar. Diferente de fotos/vídeo/áudio (que exigem rede para subir e
// por isso vivem à parte, no IndexedDB, associados ao id_local).
const CHAVE_FILA_OFFLINE = 'dionuel_fila_offline';
const ROTULOS_FILA_OFFLINE = { obras: 'obra', despesas: 'despesa', requisicoes: 'requisição', materiais: 'movimento de material' };

function lerFilaOffline(){
  try{ return JSON.parse(localStorage.getItem(CHAVE_FILA_OFFLINE) || '[]'); }
  catch(_e){ return []; }
}
function guardarFilaOffline(fila){
  try{ localStorage.setItem(CHAVE_FILA_OFFLINE, JSON.stringify(fila)); }catch(_e){ /* sem espaço/indisponível */ }
}
function adicionarFilaOffline(tabela, payload){
  const idLocal = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const fila = lerFilaOffline();
  fila.push({ id_local: idLocal, tabela, payload });
  guardarFilaOffline(fila);
  return idLocal;
}

// Colunas que ainda podem não existir nesta base de dados (dependem de
// SQL por correr) — se a inserção falhar por coluna em falta, tenta de
// novo sem elas, em vez de perder o registo todo.
const COLUNAS_OPCIONAIS_POR_TABELA = {
  obras: ['prioridade', 'fotos_paths', 'audio_path', 'video_path', 'materiais_usados', 'custo_materiais', 'tempo_producao_horas', 'custo_producao']
};

async function sincronizarFilaOffline(){
  const fila = lerFilaOffline();
  if(fila.length === 0) return { enviadas: 0, restantes: 0, porTabela: {} };
  let enviadas = 0;
  const restantes = [];
  const porTabela = {};
  for(const item of fila){
    try{
      let query = sb.from(item.tabela).insert(item.payload).select().maybeSingle();
      let { data: criado, error } = await query;
      if(error && error.code === '42703' && COLUNAS_OPCIONAIS_POR_TABELA[item.tabela]){
        const limpo = { ...item.payload };
        COLUNAS_OPCIONAIS_POR_TABELA[item.tabela].forEach(c => delete limpo[c]);
        const retry = await sb.from(item.tabela).insert(limpo).select().maybeSingle();
        criado = retry.data; error = retry.error;
      }
      if(error) throw error;
      enviadas++;
      porTabela[item.tabela] = (porTabela[item.tabela] || 0) + 1;

      // Se esta obra tinha fotos/vídeo/áudio à espera no IndexedDB, sobe
      // agora que já há rede e liga-os ao registo que acabou de nascer.
      if(item.tabela === 'obras' && criado && criado.id){
        await enviarMediaPendenteDeObra(item.id_local, criado.id);
        // Só agora há rede para consultar/atualizar o stock — desconta os
        // materiais que ficaram à espera junto com a obra offline.
        if(item.payload.materiais_usados && item.payload.materiais_usados.length){
          await descontarMateriaisDoStock(item.payload.materiais_usados);
        }
      }
    }catch(_e){
      restantes.push(item); // fica na fila, tenta outra vez mais tarde
    }
  }
  guardarFilaOffline(restantes);
  return { enviadas, restantes: restantes.length, porTabela };
}

async function enviarMediaPendenteDeObra(idLocal, obraId){
  const pendente = await lerMediaRascunho('fila_obra_' + idLocal);
  if(!pendente) return;
  try{
    const tokenObra = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const patch = {};
    if(pendente.fotos && pendente.fotos.length){
      const fotosPaths = [];
      for(let i = 0; i < pendente.fotos.length; i++){
        const f = ficheiroDeRascunho(pendente.fotos[i]);
        const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `obras/${tokenObra}/foto_${i+1}.${ext}`;
        const { error } = await sb.storage.from('dionuel-obras').upload(path, f, { cacheControl: '3600', upsert: false });
        if(!error) fotosPaths.push(path);
      }
      if(fotosPaths.length) patch.fotos_paths = fotosPaths;
    }
    if(pendente.video){
      const f = ficheiroDeRascunho(pendente.video);
      const ext = (f.name.split('.').pop() || 'mp4').toLowerCase();
      const path = `obras/${tokenObra}/video.${ext}`;
      const { error } = await sb.storage.from('dionuel-obras').upload(path, f, { cacheControl: '3600', upsert: false });
      if(!error) patch.video_path = path;
    }
    if(pendente.audio){
      const f = ficheiroDeRascunho(pendente.audio);
      const path = `obras/${tokenObra}/audio.webm`;
      const { error } = await sb.storage.from('dionuel-obras').upload(path, f, { cacheControl: '3600', upsert: false });
      if(!error) patch.audio_path = path;
    }
    if(Object.keys(patch).length) await sb.from('obras').update(patch).eq('id', obraId);
    await apagarMediaRascunho('fila_obra_' + idLocal);
  }catch(_e){ /* fica no IndexedDB — tenta outra vez na próxima sincronização */ }
}

// Assim que o telemóvel voltar a ter internet, tenta despachar a fila
// sozinha — sem o utilizador ter de fazer nada.
window.addEventListener('online', async () => {
  const r = await sincronizarFilaOffline();
  if(r.enviadas > 0) showToast(`${r.enviadas} registo${r.enviadas>1?'s':''} sincronizado${r.enviadas>1?'s':''} ✓`);
});

async function renderCaixaDoDia(container){
  const hoje = new Date().toISOString().slice(0,10);
  const hojeLabel = new Date().toLocaleDateString('pt-PT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  container.innerHTML = `<div class="loading-screen">A carregar caixa do dia…</div>`;

  // Antes de mais nada, se houver ligação, tenta despachar obras que
  // ficaram na fila à espera de internet numa sessão anterior.
  if(navigator.onLine) await sincronizarFilaOffline();

  let obras = [];
  let despesas = [];
  let avisoSemLigacao = false;
  try{
    const [{ data: obrasHoje, error: e1 }, { data: despesasHoje, error: e2 }] = await Promise.all([
      sb.from('obras').select('*').eq('registado_por', currentAuthUser.id).gte('criado_em', hoje + 'T00:00:00').order('criado_em', { ascending: true }),
      sb.from('despesas').select('*').eq('registado_por', currentAuthUser.id).gte('criado_em', hoje + 'T00:00:00')
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    obras = obrasHoje || [];
    despesas = despesasHoje || [];

    // Sem internet (ou outro erro de rede): não bloqueia a página — só

            </div>

              <div class="obra-dia-row">
                <div class="obra-num mono">#${String(idx+1).padStart(2,'0')}</div>
                <div class="obra-dia-info">
                  <div class="obra-cliente">${esc(o.cliente_nome)}</div>
                  <div class="obra-tipo">${esc(o.tipo_servico)}${o.numero_obra ? ' · Ref. '+esc(o.numero_obra) : ''}</div>
                  ${o.descricao ? `<div class="obra-tipo" style="color:var(--linho-dim)">${esc(o.descricao)}</div>` : ''}
                  ${medidasResumoTexto(o.medidas)
                    ? `<div class="medidas-resumo">${medidasResumoTexto(o.medidas)}</div>`
                    : ''
                  }
                </div>
                <div class="obra-dia-valores">
                  <span class="mono" style="color:var(--verde-light)">${formatAOA(o.valor_pago)}</span>
                  <span style="color:var(--linho-dim); font-size:11px;">de ${formatAOA(o.valor_a_pagar)}</span>
                  <span class="estado-badge ${o.estado==='concluido'?'estado-concluido':o.estado==='rejeitado'?'estado-rejeitado':'estado-por_concluir'}" style="font-size:9px;">
                    ${o.estado==='concluido'?'Concluída':o.estado==='rejeitado'?'Rejeitada':'Por concluir'}
                  </span>
                </div>
              </div>
            `).join('')}
          `
        }
      </div>
    `;

    ativarMedidasBloco('m');
    await ativarMateriaisUsadosBloco('o', 'o_apagar');

    // Guarda um rascunho a cada alteração no formulário — assim, se a
    // página recarregar sozinha (ex.: ao voltar da câmara), o nome, o
    // telefone e as medidas já apontadas não se perdem.
    function salvarRascunhoObra(){
      try{
        localStorage.setItem('dionuel_rascunho_obra', JSON.stringify({
          cliente_nome: document.getElementById('o_cliente').value,
          cliente_telefone: document.getElementById('o_cliente_tel').value,
          indicado_tel: document.getElementById('o_indicado_tel').value,
          afilhado_codigo: document.getElementById('o_afilhado_codigo').value,
          tipo_servico: document.getElementById('o_tipo').value,
          descricao: document.getElementById('o_desc').value,
          valor_a_pagar: document.getElementById('o_apagar').value,
          valor_pago: document.getElementById('o_pago').value,
          forma_pagamento: document.getElementById('o_forma').value,
          prioridade: document.getElementById('o_prioridade').value,
          medidas: coletarMedidas('m')
        }));
      }catch(_e){ /* localStorage indisponível — sem drama, só não guarda rascunho */ }
    }
    document.getElementById('forma_nova_obra').addEventListener('input', salvarRascunhoObra);
    document.getElementById('forma_nova_obra').addEventListener('change', salvarRascunhoObra);

    const tentarSyncBtn = document.getElementById('tentar_sync_obras_btn');
    if(tentarSyncBtn){
      tentarSyncBtn.addEventListener('click', async () => {
        tentarSyncBtn.textContent = 'A tentar…';
        tentarSyncBtn.disabled = true;
        const r = await sincronizarFilaOffline();
        if(r.enviadas > 0) showToast(`${r.enviadas} obra${r.enviadas>1?'s':''} sincronizada${r.enviadas>1?'s':''} ✓`);
        if(r.restantes > 0) showToast('Ainda sem internet — continua guardado no telemóvel.');
        await renderCaixaDoDia(container);
      });
    }

    document.getElementById('o_ver_medidas_btn').addEventListener('click', async () => {
      const nomeDigitado = document.getElementById('o_cliente').value.trim();
      const resultArea = document.getElementById('o_medidas_anteriores');
      if(!nomeDigitado){
        resultArea.innerHTML = '<div class="empty-state-small">Escreva primeiro o nome do cliente acima.</div>';
        return;
      }
      resultArea.innerHTML = '<div class="empty-state-small">A procurar…</div>';
      try{
        const { data, error } = await sb.from('obras')
          .select('id, cliente_nome, criado_em, medidas')
          .ilike('cliente_nome', `%${nomeDigitado}%`)
          .not('medidas', 'is', null)
          .order('criado_em', { ascending: false })
          .limit(5);
        if(error) throw error;

        if(!data || data.length === 0){
          resultArea.innerHTML = '<div class="empty-state-small">Não há medidas anteriores registadas com este nome.</div>';
          return;
        }

        resultArea.innerHTML = data.map((o, i) => `
          <div class="instrucoes-pagamento" style="font-family:'Inter',sans-serif; margin-top:10px;">
            <strong>${esc(o.cliente_nome)}</strong> · ${new Date(o.criado_em).toLocaleDateString('pt-PT')}<br>
            ${esc(medidasResumoTexto(o.medidas)) === '' ? 'Sem medidas detalhadas.' : medidasResumoTexto(o.medidas)}
            <br><button type="button" class="icon-btn" data-usar-medidas="${i}" style="margin-top:8px;">Usar estas medidas</button>
          </div>
        `).join('');

        resultArea.querySelectorAll('[data-usar-medidas]').forEach(btn => {
          btn.addEventListener('click', () => {
            const obraEscolhida = data[Number(btn.dataset.usarMedidas)];
            preencherMedidasNoForm('m', obraEscolhida.medidas || {});
            showToast('Medidas preenchidas ✓ — reveja antes de guardar');
          });
        });
      }catch(e){
        resultArea.innerHTML = `<div class="error-banner">Não foi possível procurar: ${esc(e.message || 'erro desconhecido')}</div>`;
      }
    });

    // --- Fotos (várias, tecido/peça) ---
    // Rascunho de fotos/vídeo/áudio ainda não enviados — guardado no
    // IndexedDB (o único sítio do browser que aguenta ficheiros grandes
    // de forma persistente), para sobreviver a um recarregamento
    // inesperado da página (ex.: ao voltar da câmara).
    const [rascunhoFotos, rascunhoVideo, rascunhoAudio] = await Promise.all([
      lerMediaRascunho('rascunho_obra_fotos'),
      lerMediaRascunho('rascunho_obra_video'),
      lerMediaRascunho('rascunho_obra_audio')
    ]);

    async function salvarRascunhoFotosMedia(lista){
      if(lista.length){
        await guardarMediaRascunho('rascunho_obra_fotos', lista.map(f => ({ name: f.name, type: f.type, blob: f })));
      } else {
        await apagarMediaRascunho('rascunho_obra_fotos');
      }
    }

    let fotosObraSelecionadas = (rascunhoFotos || []).map(ficheiroDeRascunho);
    function desenharFotosObraPreview(){
      const area = document.getElementById('o_fotos_preview');
      area.innerHTML = fotosObraSelecionadas.map((f, i) => `
        <div style="position:relative; width:56px; height:56px;">
          <img src="${URL.createObjectURL(f)}" class="obra-foto-pendente-thumb" alt="Foto ${i+1}">
          <button type="button" data-remover-foto-obra="${i}" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--giz); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;">×</button>
        </div>
      `).join('');
      area.querySelectorAll('[data-remover-foto-obra]').forEach(btn => {
        btn.addEventListener('click', () => {
          fotosObraSelecionadas.splice(Number(btn.dataset.removerFotoObra), 1);
          desenharFotosObraPreview();
          salvarRascunhoFotosMedia(fotosObraSelecionadas);
        });
      });
    }
    desenharFotosObraPreview();
    document.getElementById('o_fotos_input').addEventListener('change', (e) => {
      fotosObraSelecionadas = fotosObraSelecionadas.concat(Array.from(e.target.files || []));
      desenharFotosObraPreview();
      salvarRascunhoFotosMedia(fotosObraSelecionadas);
      e.target.value = ''; // permite tirar/escolher mais fotos a seguir
    });

    // --- Vídeo (um só) ---
    let videoObraSelecionado = ficheiroDeRascunho(rascunhoVideo);
    if(videoObraSelecionado){
      document.getElementById('o_video_preview').innerHTML =
        `<video controls src="${URL.createObjectURL(videoObraSelecionado)}" style="width:100%; max-width:220px; border-radius:4px;"></video>`;
    }
    document.getElementById('o_video_input').addEventListener('change', (e) => {
      videoObraSelecionado = e.target.files[0] || null;
      const area = document.getElementById('o_video_preview');
      area.innerHTML = videoObraSelecionado
        ? `<video controls src="${URL.createObjectURL(videoObraSelecionado)}" style="width:100%; max-width:220px; border-radius:4px;"></video>`
        : '';
      if(videoObraSelecionado){
        guardarMediaRascunho('rascunho_obra_video', { name: videoObraSelecionado.name, type: videoObraSelecionado.type, blob: videoObraSelecionado });
      } else {
        apagarMediaRascunho('rascunho_obra_video');
      }
    });

    // --- Gravador de áudio (MediaRecorder do próprio browser, como nas Requisições) ---
    let mediaRecorderObra = null;
    let chunksAudioObra = [];
    let blobAudioObra = rascunhoAudio ? ficheiroDeRascunho(rascunhoAudio) : null;
    let cronometroObra = null;
    let segundosObra = 0;
    const gravarObraBtn = document.getElementById('o_gravar_btn');
    const estadoObraGravacao = document.getElementById('o_gravar_estado');
    const previewAudioObra = document.getElementById('o_audio_preview');
    if(blobAudioObra){
      previewAudioObra.innerHTML = `
        <audio controls src="${URL.createObjectURL(blobAudioObra)}" style="width:100%; max-width:280px;"></audio>
        <button type="button" class="icon-btn" id="o_audio_descartar" style="margin-left:8px;">Descartar</button>
      `;
      document.getElementById('o_audio_descartar').addEventListener('click', () => {
        blobAudioObra = null;
        previewAudioObra.innerHTML = '';
        apagarMediaRascunho('rascunho_obra_audio');
      });
    }
    gravarObraBtn.addEventListener('click', async () => {
      if(mediaRecorderObra && mediaRecorderObra.state === 'recording'){
        mediaRecorderObra.stop();
        return;
      }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunksAudioObra = [];
        mediaRecorderObra = new MediaRecorder(stream);
        mediaRecorderObra.ondataavailable = (e) => { if(e.data.size > 0) chunksAudioObra.push(e.data); };
        mediaRecorderObra.onstop = () => {
          blobAudioObra = new Blob(chunksAudioObra, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          clearInterval(cronometroObra);
          gravarObraBtn.textContent = 'Gravar áudio';
          estadoObraGravacao.textContent = '';
          const url = URL.createObjectURL(blobAudioObra);
          previewAudioObra.innerHTML = `
            <audio controls src="${url}" style="width:100%; max-width:280px;"></audio>
            <button type="button" class="icon-btn" id="o_audio_descartar" style="margin-left:8px;">Descartar</button>
          `;
          document.getElementById('o_audio_descartar').addEventListener('click', () => {
            blobAudioObra = null;
            previewAudioObra.innerHTML = '';
            apagarMediaRascunho('rascunho_obra_audio');
          });
          guardarMediaRascunho('rascunho_obra_audio', { name: 'audio.webm', type: 'audio/webm', blob: blobAudioObra });
        };
        mediaRecorderObra.start();
        segundosObra = 0;
        gravarObraBtn.textContent = 'Parar gravação';
        estadoObraGravacao.textContent = '● a gravar 0:00';
        cronometroObra = setInterval(() => {
          segundosObra++;
          const m = Math.floor(segundosObra / 60);
          const s = String(segundosObra % 60).padStart(2, '0');
          estadoObraGravacao.textContent = `● a gravar ${m}:${s}`;
        }, 1000);
      }catch(e){
        alert('Não foi possível aceder ao microfone: ' + (e.message || 'permissão negada'));
      }
    });

    // Move o que estava no rascunho temporário para a fila offline
    // (associado ao id_local da obra), para subir sozinho assim que a
    // ligação voltar.
    async function guardarMediaPendenteObra(idLocal){
      const pacote = {
        fotos: fotosObraSelecionadas.map(f => ({ name: f.name, type: f.type, blob: f })),
        video: videoObraSelecionado ? { name: videoObraSelecionado.name, type: videoObraSelecionado.type, blob: videoObraSelecionado } : null,
        audio: blobAudioObra ? { name: 'audio.webm', type: 'audio/webm', blob: blobAudioObra } : null
      };
      if(pacote.fotos.length || pacote.video || pacote.audio){
        await guardarMediaRascunho('fila_obra_' + idLocal, pacote);
      }
      await Promise.all([
        apagarMediaRascunho('rascunho_obra_fotos'),
        apagarMediaRascunho('rascunho_obra_video'),
        apagarMediaRascunho('rascunho_obra_audio')
      ]);
    }

    document.getElementById('o_submit').addEventListener('click', async () => {
      const btn = document.getElementById('o_submit');
      const errBox = document.getElementById('o_error');
      errBox.style.display = 'none';

      const tipo = document.getElementById('o_tipo').value.trim();
      if(!tipo){
        errBox.textContent = 'Selecione o tipo de serviço.';
        errBox.style.display = 'block';
        return;
      }

      const medidas = coletarMedidas('m');
      const dadosMateriais = lerMateriaisUsados('o');

      const nomeCliente = document.getElementById('o_cliente').value.trim() || 'Cliente não identificado';
      const telRaw = document.getElementById('o_cliente_tel').value.trim();
      const telNorm = normalizarTelefone(telRaw);
      const indicadoPorTel = document.getElementById('o_indicado_tel').value.trim();

      const payload = {
        cliente_nome: nomeCliente,
        cliente_telefone: telNorm || telRaw || null,
        tipo_servico: tipo,
        descricao: document.getElementById('o_desc').value.trim(),
        data_servico: hoje,
        quantidade: 1,
        valor_a_pagar: Number(document.getElementById('o_apagar').value) || 0,
        valor_pago: Number(document.getElementById('o_pago').value) || 0,
        forma_pagamento: document.getElementById('o_forma').value || null,
        prioridade: document.getElementById('o_prioridade').value || 'normal',
        medidas: medidas,
        materiais_usados: dadosMateriais.materiais_usados,
        custo_materiais: dadosMateriais.custo_materiais,
        tempo_producao_horas: dadosMateriais.tempo_producao_horas,
        custo_producao: dadosMateriais.custo_producao,
        registado_por: currentAuthUser.id,
        estado: 'por_concluir'
      };

      // Sem internet: nem tenta a rede — guarda já na fila local. Fotos,
      // vídeo e áudio ficam guardados no telemóvel (IndexedDB) e sobem
      // sozinhos, ligados a esta obra, assim que a ligação voltar.
      if(!navigator.onLine){
        const idLocal = adicionarFilaOffline('obras', payload);
        await guardarMediaPendenteObra(idLocal);
        localStorage.removeItem('dionuel_rascunho_obra');
        const temMedia = fotosObraSelecionadas.length || videoObraSelecionado || blobAudioObra;
        showToast(temMedia
          ? 'Sem internet — obra e anexos guardados no telemóvel. Tudo sobe sozinho quando a ligação voltar.'
          : 'Sem internet — obra guardada no telemóvel. Envia sozinha quando a ligação voltar.');
        await renderCaixaDoDia(container);
        return;
      }

      btn.textContent = 'A enviar anexos…';
      btn.disabled = true;
      try{
        // Sobe fotos, vídeo e áudio para um espaço PRIVADO (só quem tem
        // login e acede via link temporário consegue ver) antes de
        // registar a obra em si — a mesma pasta liga tudo.
        const tokenObra = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
        if(fotosObraSelecionadas.length){
          const fotosPaths = [];
          for(let i = 0; i < fotosObraSelecionadas.length; i++){
            const f = fotosObraSelecionadas[i];
            const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
            const path = `obras/${tokenObra}/foto_${i+1}.${ext}`;
            const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, f, { cacheControl: '3600', upsert: false });
            if(upErr) throw upErr;
            fotosPaths.push(path);
          }
          payload.fotos_paths = fotosPaths;
        }
        if(videoObraSelecionado){
          const ext = (videoObraSelecionado.name.split('.').pop() || 'mp4').toLowerCase();
          const path = `obras/${tokenObra}/video.${ext}`;
          const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, videoObraSelecionado, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
          payload.video_path = path;
        }
        if(blobAudioObra){
          const path = `obras/${tokenObra}/audio.webm`;
          const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, blobAudioObra, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
          payload.audio_path = path;
        }

        btn.textContent = 'A registar…';
        let { error } = await sb.from('obras').insert(payload);
        if(error && error.code === '42703'){
          // Alguma coluna nova (prioridade, fotos_paths, audio_path,
          // video_path ou os campos de materiais/produção) ainda não
          // existe nesta base de dados — regista a obra na mesma, sem
          // essas marcações, em vez de bloquear tudo.
          delete payload.prioridade;
          delete payload.fotos_paths;
          delete payload.audio_path;
          delete payload.video_path;
          delete payload.materiais_usados;
          delete payload.custo_materiais;
          delete payload.tempo_producao_horas;
          delete payload.custo_producao;
          const retry = await sb.from('obras').insert(payload);
          error = retry.error;
        }
        if(error) throw error;
        // Desconta do stock os materiais usados nesta peça — feito depois
        // do registo da obra em si, para nunca perder o pedido do
        // cliente por causa de um problema ao atualizar o stock.
        await descontarMateriaisDoStock(dadosMateriais.materiais_usados);
        showToast('Obra registada ✓');
        localStorage.removeItem('dionuel_rascunho_obra');
        await Promise.all([
          apagarMediaRascunho('rascunho_obra_fotos'),
          apagarMediaRascunho('rascunho_obra_video'),
          apagarMediaRascunho('rascunho_obra_audio')
        ]);

        const codigoDigitado = document.getElementById('o_afilhado_codigo').value.trim().toUpperCase();
        if(codigoDigitado && telNorm){
          // Liga o cliente ao afilhado dono deste código — só se o
          // cliente ainda não tiver nenhum ligado, para não roubar
          // comissão de quem o trouxe primeiro.
          try{
            const { data: afilhadoDono } = await sb.from('usuarios').select('id').eq('codigo_afilhado', codigoDigitado).eq('papel', 'afilhado').maybeSingle();
            if(afilhadoDono){
              const { data: clienteExistente } = await sb.from('clientes').select('id, afilhado_id').eq('telefone', telNorm).maybeSingle();
              if(clienteExistente){
                if(!clienteExistente.afilhado_id){
                  await sb.from('clientes').update({ afilhado_id: afilhadoDono.id }).eq('id', clienteExistente.id);
                }
              } else {
                await sb.from('clientes').insert({ telefone: telNorm, nome: nomeCliente, afilhado_id: afilhadoDono.id });
              }
            } else {
              showToast('Código de indicação não reconhecido — obra registada na mesma, sem ligação a parceiro publicitário.');
            }
          }catch(_e){ /* não bloqueia o registo da obra por causa disto */ }
        }

        if(telNorm){
          const fid = await processarFidelidadeAposObra({
            nome: nomeCliente,
            telefoneRaw: telNorm,
            indicadoPorTelRaw: indicadoPorTel,
            tipoServico: tipo
          });
          if(fid.pecaGratisGanha){
            alert(`Corrida do Cliente: ${nomeCliente} completou 10 peças de "${fid.tipoServico}" este mês — tem direito a uma peça grátis desse tipo. Veja em Clientes → Corrida do Cliente para marcar como entregue.`);
          }
          if(fid.indicadorCreditado){
            const ic = fid.indicadorCreditado;
            alert(`Corrida do Cliente: a indicação de ${ic.nome || ic.telefone} foi validada — está agora em ${ic.pct}% de desconto, válido até ${ic.expiraEm.toLocaleDateString('pt-PT')} às ${ic.expiraEm.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' })}.`);
          }
        } else if(indicadoPorTel){
          showToast('Sem WhatsApp do cliente não é possível validar a indicação nem contar para a Corrida do Cliente');
        }

        await renderCaixaDoDia(container);
      }catch(e){
        // Se a falha parece ser de rede (não um erro de dados), não
        // perde o que foi escrito — guarda na fila offline em vez de
        // só mostrar um erro.
        const pareceFalhaDeRede = !navigator.onLine || /fetch|network|Failed to fetch|NetworkError/i.test(e.message || '');
        if(pareceFalhaDeRede){
          const idLocal = adicionarFilaOffline('obras', payload);
          await guardarMediaPendenteObra(idLocal);
          localStorage.removeItem('dionuel_rascunho_obra');
          showToast('Falha de ligação — obra e anexos guardados no telemóvel. Sobem sozinhos quando a internet voltar.');
          await renderCaixaDoDia(container);
          return;
        }
        errBox.textContent = 'Não foi possível registar: ' + (e.message || 'erro desconhecido');
        errBox.style.display = 'block';
        btn.textContent = 'Registar obra';
        btn.disabled = false;
      }
    });

  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar: ${e.message || 'erro desconhecido'}</div>`;
  }
}

function estadoObraBadge(obra){
  if(!obra.tecnico_atribuido){
    return { texto: 'Confirmação pendente por CEO', classe: 'estado-pendente-ceo' };
  }
  if(obra.estado === 'concluido') return { texto: 'Concluída', classe: 'estado-concluido' };
  if(obra.estado === 'rejeitado') return { texto: 'Rejeitada', classe: 'estado-rejeitado' };
  return Number(obra.valor_pago) > 0
    ? { texto: 'Por fazer', classe: 'estado-por_concluir' }
    : { texto: 'Pendente — sem sinal', classe: 'estado-por_concluir' };
}

// Versão simplificada para o cliente: não expõe o fluxo interno de
// confirmação/atribuição de técnico, só o estado real da encomenda.
function estadoObraBadgeCliente(obra){
  if(obra.estado === 'concluido') return { texto: 'Concluída', classe: 'estado-concluido' };
  if(obra.estado === 'rejeitado') return { texto: 'Rejeitada', classe: 'estado-rejeitado' };
  return { texto: 'Por concluir', classe: 'estado-por_concluir' };
}

async function renderMinhasObras(container){
  container.innerHTML = `<div class="loading-screen">A carregar obras…</div>`;
  try{
    const { data, error } = await sb.from('obras')
      .select('*')
      .or(`registado_por.eq.${currentAuthUser.id},tecnico_atribuido.eq.${currentAuthUser.id}`)
      .order('criado_em', { ascending: true });
    if(error) throw error;

    if(!data || data.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não registou nenhuma obra.</div>`;
      return;
    }

    function cartaoMinhaObraHTML(o){
      const badge = estadoObraBadge(o);
      const ehMinha = o.registado_por === currentAuthUser.id;
      const podeAgir = ehMinha && o.estado !== 'concluido';
      const pagamentoCompleto = Number(o.valor_pago) >= Number(o.valor_a_pagar) && Number(o.valor_a_pagar) > 0;
      return `
        <div class="obra-card" data-obra-id="${o.id}">
          <div class="obra-top">
            <div>
              <div class="obra-cliente">${esc(o.cliente_nome)}</div>
              <div class="obra-tipo">${esc(o.tipo_servico)}</div>
            </div>
            <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
              ${prioridadeBadgeHTML(o)}
              <span class="estado-badge ${badge.classe}">${badge.texto}</span>
            </div>
          </div>
          <div class="obra-valores">
            <span class="mono">${formatAOA(o.valor_pago)}</span> pago de <span class="mono">${formatAOA(o.valor_a_pagar)}</span>
            ${o.data_servico ? ' · ' + new Date(o.data_servico).toLocaleDateString('pt-PT') : ''}
          </div>
          ${o.estado === 'rejeitado' && o.motivo_rejeicao ? `<div class="motivo-rejeicao">Motivo: ${esc(o.motivo_rejeicao)}</div>` : ''}
          ${obraMediaTiraHTML(o)}
          <div class="ceo-obra-controls">
            ${podeAgir && !pagamentoCompleto ? `<button class="btn-approve ceo-obra-btn" data-hpago="${o.id}">Pagamento recebido</button>` : ''}
            ${podeAgir ? `<button class="btn-approve ceo-obra-btn" data-htermina="${o.id}">Obra terminada</button>` : ''}
            <button class="icon-btn" data-hrecibo="${o.id}">Gerar recibo</button>
          </div>
          ${o.estado === 'concluido' ? `<div style="font-size:11px; color:var(--linho-dim); margin-top:8px;">Obra concluída — só o CEO pode alterar a partir daqui.</div>` : ''}
        </div>
      `;
    }

    // Mesma organização do painel do CEO: Ajustes e Confecção lado a
    // lado, cada uma da obra mais antiga para a mais recente.
    const ajustes = data.filter(o => categoriaObra(o) === 'ajustes');
    const confeccao = data.filter(o => categoriaObra(o) === 'confeccao');

    container.innerHTML = `
      <div class="obras-duas-colunas obras-grid-compacto">
        <div>
          <div class="obras-coluna-titulo">Ajustes (${ajustes.length})</div>
          <div class="obras-coluna-grid">
            ${ajustes.length ? ajustes.map(cartaoMinhaObraHTML).join('') : '<div class="empty-state-small">Sem obras de ajuste.</div>'}
          </div>
        </div>
        <div>
          <div class="obras-coluna-titulo">Confecção (${confeccao.length})</div>
          <div class="obras-coluna-grid">
            ${confeccao.length ? confeccao.map(cartaoMinhaObraHTML).join('') : '<div class="empty-state-small">Sem obras de confecção.</div>'}
          </div>
        </div>
      </div>
    `;
    data.forEach(o => carregarMediaObraCard(o, container));

    container.querySelectorAll('[data-hrecibo]').forEach(btn => {
      btn.addEventListener('click', () => {
        const obra = data.find(o => String(o.id) === btn.dataset.hrecibo);
        if(!obra) return;
        // Um parceiro só conhece o próprio nome com certeza (regras de
        // privacidade impedem consultar o nome de outro colega); se a
        // obra foi registada por outra pessoa, usa-se um rótulo genérico.
        const nomeRegistrador = obra.registado_por === currentAuthUser.id
          ? (currentUsuario.nome || currentUsuario.email)
          : 'Equipa Dionuel';
        gerarReciboPDF(obra, nomeRegistrador);
      });
    });

    container.querySelectorAll('[data-hpago]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const obra = data.find(o => String(o.id) === btn.dataset.hpago);
        if(!obra) return;
        btn.textContent = 'A atualizar…';
        btn.disabled = true;
        try{
          const { error } = await sb.from('obras').update({ valor_pago: obra.valor_a_pagar }).eq('id', obra.id);
          if(error) throw error;
          showToast('Pagamento marcado como recebido ✓');
          await renderMinhasObras(container);
        }catch(e){
          alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido'));
          btn.textContent = 'Pagamento recebido';
          btn.disabled = false;
        }
      });
    });

    container.querySelectorAll('[data-htermina]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const obra = data.find(o => String(o.id) === btn.dataset.htermina);
        if(!obra) return;
        if(!confirm('Marcar esta obra como terminada? Depois disso, só o CEO poderá alterá-la.')) return;
        btn.textContent = 'A atualizar…';
        btn.disabled = true;
        try{
          const { error } = await sb.from('obras').update({ estado: 'concluido' }).eq('id', obra.id);
          if(error) throw error;
          showToast('Obra marcada como terminada ✓');
          await renderMinhasObras(container);
        }catch(e){
          alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido'));
          btn.textContent = 'Obra terminada';
          btn.disabled = false;
        }
      });
    });
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as obras: ${e.message || 'erro desconhecido'}</div>`;
  }
}

function renderEditarObraForm(container, obra, voltarFn){

  container.innerHTML = `

        <div class="field" style="flex:1"><label>Nº referência</label><input id="eo_num" value="${escAttr(obra.numero_obra||'')}"></div>
      </div>
      <div class="field"><label>WhatsApp do cliente (com código do país)</label><input id="eo_cliente_tel" value="${escAttr(obra.cliente_telefone||'')}" type="tel" placeholder="244900000000"></div>
      <div class="field"><label>Tipo de serviço</label><input id="eo_tipo" value="${escAttr(obra.tipo_servico||'')}"></div>
      <div class="field"><label>Descrição</label><textarea id="eo_desc" rows="2">${esc(obra.descricao||'')}</textarea></div>

      ${medidasGridHTML('em', medidasAtuais)}

      ${(obra.materiais_usados && obra.materiais_usados.length) ? `
        <div class="instrucoes-pagamento" style="margin-bottom:16px;">
          <strong>Materiais registados nesta peça:</strong><br>
          ${obra.materiais_usados.map(m => `${esc(m.quantidade)}× ${esc((m.descricao||'').split(' · ')[0])} — ${formatAOA(m.subtotal)}`).join('<br>')}
          ${obra.tempo_producao_horas ? `<br>Produção: ${esc(obra.tempo_producao_horas)}h × ${formatAOA(obra.custo_producao / obra.tempo_producao_horas)} = ${formatAOA(obra.custo_producao)}` : ''}
          <br>Custo total de materiais: <strong>${formatAOA(obra.custo_materiais||0)}</strong>
        </div>
      ` : ''}

      <div class="form-row2">
        <div class="field"><label>A pagar (Kz)</label><input id="eo_apagar" type="number" min="0" value="${obra.valor_a_pagar||0}"></div>
        <div class="field"><label>Já pago (Kz)</label><input id="eo_pago" type="number" min="0" value="${obra.valor_pago||0}"></div>
      </div>

      <div class="field">
        <label>Fotos já guardadas</label>
        <div id="eo_fotos_existentes" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
          <span style="font-size:11px; color:var(--linho-dim);">A carregar…</span>
        </div>
        <label>Adicionar mais fotos</label>
        <input type="file" id="eo_fotos_input" accept="image/*" capture="environment" multiple>
        <div id="eo_fotos_preview" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
      </div>

      <div class="field">
        <label>Vídeo</label>
        <div id="eo_video_existente" style="margin-bottom:8px;"></div>
        <input type="file" id="eo_video_input" accept="video/*" capture="environment">
        <div id="eo_video_preview" style="margin-top:8px;"></div>
      </div>

      <div class="field">
        <label>Gravador de áudio</label>
        <div id="eo_audio_existente" style="margin-bottom:8px;"></div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button type="button" class="icon-btn" id="eo_gravar_btn">Gravar áudio</button>
          <span id="eo_gravar_estado" style="font-size:12px; color:var(--linho-dim);"></span>
        </div>
        <div id="eo_audio_preview" style="margin-top:10px;"></div>
      </div>

      <div class="error-banner" id="eo_error" style="display:none;"></div>
      <button class="btn-submit" id="eo_submit">Guardar alterações</button>
    </div>
  `;
  document.getElementById('eo_back').addEventListener('click', voltarFn);
  ativarMedidasBloco('em');

  // --- Fotos já guardadas: mostra com link temporário e botão de remover ---
  let fotosExistentes = [...(obra.fotos_paths || [])];
  async function desenharFotosExistentes(){
    const area = document.getElementById('eo_fotos_existentes');
    if(fotosExistentes.length === 0){ area.innerHTML = `<span style="font-size:11px; color:var(--linho-dim);">Sem fotos guardadas.</span>`; return; }
    const itens = await Promise.all(fotosExistentes.map(async (path) => {
      try{
        const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(path, 3600);
        return { path, url: data ? data.signedUrl : null };
      }catch(_e){ return { path, url: null }; }
    }));
    area.innerHTML = itens.map(it => `
      <div style="position:relative; width:56px; height:56px;">
        ${it.url ? `<img src="${it.url}" class="obra-foto-pendente-thumb" alt="Foto guardada">` : `<div class="obra-foto-pendente-thumb" style="display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--linho-dim);">s/ pré-visualização</div>`}
        <button type="button" data-remover-foto-existente="${escAttr(it.path)}" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--giz); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;">×</button>
      </div>
    `).join('');
    area.querySelectorAll('[data-remover-foto-existente]').forEach(btn => {
      btn.addEventListener('click', () => {
        fotosExistentes = fotosExistentes.filter(p => p !== btn.dataset.removerFotoExistente);
        desenharFotosExistentes();
      });
    });
  }
  desenharFotosExistentes();

  let fotosNovasObra = [];
  function desenharFotosNovasPreview(){
    const area = document.getElementById('eo_fotos_preview');
    area.innerHTML = fotosNovasObra.map((f, i) => `
      <div style="position:relative; width:56px; height:56px;">
        <img src="${URL.createObjectURL(f)}" class="obra-foto-pendente-thumb" alt="Nova foto ${i+1}">
        <button type="button" data-remover-foto-nova="${i}" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--giz); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;">×</button>
      </div>
    `).join('');
    area.querySelectorAll('[data-remover-foto-nova]').forEach(btn => {
      btn.addEventListener('click', () => {
        fotosNovasObra.splice(Number(btn.dataset.removerFotoNova), 1);
        desenharFotosNovasPreview();
      });
    });
  }
  document.getElementById('eo_fotos_input').addEventListener('change', (e) => {
    fotosNovasObra = fotosNovasObra.concat(Array.from(e.target.files || []));
    desenharFotosNovasPreview();
    e.target.value = '';
  });

  // --- Vídeo já guardado ---
  let videoExistente = obra.video_path || null;
  let videoNovoObra = null;
  async function desenharVideoExistente(){
    const area = document.getElementById('eo_video_existente');
    if(!videoExistente){ area.innerHTML = `<span style="font-size:11px; color:var(--linho-dim);">Sem vídeo guardado.</span>`; return; }
    try{
      const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(videoExistente, 3600);
      area.innerHTML = `
        <video controls src="${data ? data.signedUrl : ''}" style="width:100%; max-width:220px; border-radius:4px; display:block; margin-bottom:6px;"></video>
        <button type="button" class="icon-btn" id="eo_video_remover">Remover vídeo</button>
      `;
      document.getElementById('eo_video_remover').addEventListener('click', () => { videoExistente = null; desenharVideoExistente(); });
    }catch(_e){
      area.innerHTML = `<span style="font-size:11px; color:var(--linho-dim);">Não foi possível carregar o vídeo guardado.</span>`;
    }
  }
  desenharVideoExistente();
  document.getElementById('eo_video_input').addEventListener('change', (e) => {
    videoNovoObra = e.target.files[0] || null;
    const area = document.getElementById('eo_video_preview');
    area.innerHTML = videoNovoObra ? `<video controls src="${URL.createObjectURL(videoNovoObra)}" style="width:100%; max-width:220px; border-radius:4px;"></video>` : '';
  });

  // --- Áudio já guardado + gravador (mesmo padrão das Requisições) ---
  let audioExistente = obra.audio_path || null;
  let blobAudioEditObra = null;
  async function desenharAudioExistente(){
    const area = document.getElementById('eo_audio_existente');
    if(!audioExistente){ area.innerHTML = `<span style="font-size:11px; color:var(--linho-dim);">Sem áudio guardado.</span>`; return; }
    try{
      const { data } = await sb.storage.from('dionuel-obras').createSignedUrl(audioExistente, 3600);
      area.innerHTML = `
        <audio controls src="${data ? data.signedUrl : ''}" style="display:block; margin-bottom:6px; max-width:280px;"></audio>
        <button type="button" class="icon-btn" id="eo_audio_remover">Remover áudio</button>
      `;
      document.getElementById('eo_audio_remover').addEventListener('click', () => { audioExistente = null; desenharAudioExistente(); });
    }catch(_e){
      area.innerHTML = `<span style="font-size:11px; color:var(--linho-dim);">Não foi possível carregar o áudio guardado.</span>`;
    }
  }
  desenharAudioExistente();

  let mediaRecorderEditObra = null;
  let chunksAudioEditObra = [];
  let cronometroEditObra = null;
  let segundosEditObra = 0;
  const gravarEditBtn = document.getElementById('eo_gravar_btn');
  const estadoEditGravacao = document.getElementById('eo_gravar_estado');
  const previewAudioEdit = document.getElementById('eo_audio_preview');
  gravarEditBtn.addEventListener('click', async () => {
    if(mediaRecorderEditObra && mediaRecorderEditObra.state === 'recording'){
      mediaRecorderEditObra.stop();
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunksAudioEditObra = [];
      mediaRecorderEditObra = new MediaRecorder(stream);
      mediaRecorderEditObra.ondataavailable = (e) => { if(e.data.size > 0) chunksAudioEditObra.push(e.data); };
      mediaRecorderEditObra.onstop = () => {
        blobAudioEditObra = new Blob(chunksAudioEditObra, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        clearInterval(cronometroEditObra);
        gravarEditBtn.textContent = 'Gravar áudio';
        estadoEditGravacao.textContent = '';
        const url = URL.createObjectURL(blobAudioEditObra);
        previewAudioEdit.innerHTML = `
          <audio controls src="${url}" style="width:100%; max-width:280px;"></audio>
          <button type="button" class="icon-btn" id="eo_audio_descartar" style="margin-left:8px;">Descartar</button>
        `;
        document.getElementById('eo_audio_descartar').addEventListener('click', () => {
          blobAudioEditObra = null;
          previewAudioEdit.innerHTML = '';
        });
      };
      mediaRecorderEditObra.start();
      segundosEditObra = 0;
      gravarEditBtn.textContent = 'Parar gravação';
      estadoEditGravacao.textContent = '● a gravar 0:00';
      cronometroEditObra = setInterval(() => {
        segundosEditObra++;
        const m = Math.floor(segundosEditObra / 60);
        const s = String(segundosEditObra % 60).padStart(2, '0');
        estadoEditGravacao.textContent = `● a gravar ${m}:${s}`;
      }, 1000);
    }catch(e){
      alert('Não foi possível aceder ao microfone: ' + (e.message || 'permissão negada'));
    }
  });

  document.getElementById('eo_submit').addEventListener('click', async () => {
    const btn = document.getElementById('eo_submit');
    const errBox = document.getElementById('eo_error');
    errBox.style.display = 'none';

    const medidas = coletarMedidas('em');

    const payload = {
      cliente_nome: document.getElementById('eo_cliente').value.trim() || 'Cliente não identificado',
      cliente_telefone: document.getElementById('eo_cliente_tel').value.trim() || null,
      numero_obra: document.getElementById('eo_num').value.trim() || null,
      tipo_servico: document.getElementById('eo_tipo').value.trim() || obra.tipo_servico,
      descricao: document.getElementById('eo_desc').value.trim(),
      valor_a_pagar: Number(document.getElementById('eo_apagar').value) || 0,
      valor_pago: Number(document.getElementById('eo_pago').value) || 0,
      medidas: medidas
    };

    // Se a obra tinha sido rejeitada pelo CEO, ao corrigir e guardar,
    // volta ao estado "por concluir" para ser reavaliada — o motivo
    // da rejeição anterior é limpo, já que foi corrigido.
    if(obra.estado === 'rejeitado'){
      payload.estado = 'por_concluir';
      payload.motivo_rejeicao = null;
    }

    btn.textContent = 'A enviar anexos…';
    btn.disabled = true;
    try{
      const tokenObra = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      const fotosNovasPaths = [];
      for(let i = 0; i < fotosNovasObra.length; i++){
        const f = fotosNovasObra[i];
        const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `obras/${tokenObra}/foto_${i+1}.${ext}`;
        const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, f, { cacheControl: '3600', upsert: false });
        if(upErr) throw upErr;
        fotosNovasPaths.push(path);
      }
      payload.fotos_paths = fotosExistentes.concat(fotosNovasPaths);

      if(videoNovoObra){
        const ext = (videoNovoObra.name.split('.').pop() || 'mp4').toLowerCase();
        const path = `obras/${tokenObra}/video.${ext}`;
        const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, videoNovoObra, { cacheControl: '3600', upsert: false });
        if(upErr) throw upErr;
        payload.video_path = path;
      } else {
        payload.video_path = videoExistente;
      }

      if(blobAudioEditObra){
        const path = `obras/${tokenObra}/audio.webm`;
        const { error: upErr } = await sb.storage.from('dionuel-obras').upload(path, blobAudioEditObra, { cacheControl: '3600', upsert: false });
        if(upErr) throw upErr;
        payload.audio_path = path;
      } else {
        payload.audio_path = audioExistente;
      }

      btn.textContent = 'A guardar…';
      let { error } = await sb.from('obras').update(payload).eq('id', obra.id);
      if(error && error.code === '42703'){
        // Alguma coluna nova (fotos_paths, audio_path ou video_path) ainda
        // não existe nesta base de dados — guarda o resto na mesma.
        delete payload.fotos_paths;
        delete payload.audio_path;
        delete payload.video_path;
        const retry = await sb.from('obras').update(payload).eq('id', obra.id);
        error = retry.error;
      }
      if(error) throw error;
      showToast('Obra atualizada ✓');
      voltarFn();
    }catch(e){
      errBox.textContent = 'Não foi possível guardar: ' + (e.message || 'erro desconhecido');
      errBox.style.display = 'block';
      btn.textContent = 'Guardar alterações';
      btn.disabled = false;
    }
  });
}

function renderDespesasTab(container){
  container.innerHTML = `
    <div class="form-card">
      <div class="form-row2">
        <div class="field"><label>Data</label><input id="d_data" type="date"></div>
        <div class="field"><label>Valor (Kz)</label><input id="d_valor" type="number" min="0"></div>
      </div>
      <div class="field"><label>Tipo de despesa</label><input id="d_tipo" placeholder="Ex: Material, Transporte"></div>
      <div class="field">
        <label>Forma de pagamento</label>
        <select id="d_forma">
          <option value="">— Selecionar —</option>
          <option value="Numerário">Numerário</option>
          <option value="Transferência">Transferência</option>
          <option value="Express">Express</option>
        </select>
      </div>
      <div class="error-banner" id="d_error" style="display:none;"></div>
      <button class="btn-submit" id="d_submit">Registar despesa</button>
    </div>
    <div id="despesasLista"></div>
  `;
  document.getElementById('d_submit').addEventListener('click', async () => {
    const btn = document.getElementById('d_submit');
    const errBox = document.getElementById('d_error');
    errBox.style.display = 'none';

    const tipo = document.getElementById('d_tipo').value.trim();
    const valor = Number(document.getElementById('d_valor').value) || 0;
    if(!tipo || valor <= 0){
      errBox.textContent = 'Indique o tipo de despesa e um valor maior que zero.';
      errBox.style.display = 'block';
      return;
    }

    btn.textContent = 'A registar…';
    btn.disabled = true;
    const payloadDespesa = {
      data_despesa: document.getElementById('d_data').value || null,
      tipo_despesa: tipo,
      valor,
      forma_pagamento: document.getElementById('d_forma').value || null,
      registado_por: currentAuthUser.id
    };

    if(!navigator.onLine){
      adicionarFilaOffline('despesas', payloadDespesa);
      showToast('Sem internet — despesa guardada no telemóvel. Envia sozinha quando a ligação voltar.');
      document.getElementById('d_tipo').value = '';
      document.getElementById('d_valor').value = '';
      btn.textContent = 'Registar despesa';
      btn.disabled = false;
      return;
    }

    try{
      const { error } = await sb.from('despesas').insert(payloadDespesa);
      if(error) throw error;
      showToast('Despesa registada');
      document.getElementById('d_tipo').value = '';
      document.getElementById('d_valor').value = '';
      await loadMinhasDespesas();
    }catch(e){
      const pareceFalhaDeRede = !navigator.onLine || /fetch|network|Failed to fetch|NetworkError/i.test(e.message || '');
      if(pareceFalhaDeRede){
        adicionarFilaOffline('despesas', payloadDespesa);
        showToast('Falha de ligação — despesa guardada no telemóvel. Envia sozinha quando a internet voltar.');
        document.getElementById('d_tipo').value = '';
        document.getElementById('d_valor').value = '';
      } else {
        errBox.textContent = 'Não foi possível registar: ' + (e.message || 'erro desconhecido');
        errBox.style.display = 'block';
      }
    }
    btn.textContent = 'Registar despesa';
    btn.disabled = false;
  });
  loadMinhasDespesas();
}

async function renderMetasTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar metas…</div>`;
  try{
    const { data: metas, error } = await sb.from('metas').select('*').eq('funcionario_user_id', currentAuthUser.id);
    if(error) throw error;

    if(!metas || metas.length === 0){
      container.innerHTML = `<div class="empty-state-small">Ainda não tem metas definidas. Fale com o CEO para definir as suas metas.</div>`;
      return;
    }

    const cards = [];
    for(const meta of metas){
      const { inicio, fim } = periodoAtualParaMeta(meta);
      const { data: obrasPeriodo } = await sb.from('obras')
        .select('valor_pago')
        .eq('tecnico_atribuido', currentAuthUser.id)
        .eq('estado', 'concluido')
        .gte('data_servico', inicio.toISOString().slice(0,10))
        .lte('data_servico', fim.toISOString().slice(0,10));

      const numObras = obrasPeriodo ? obrasPeriodo.length : 0;
      const valorTotal = obrasPeriodo ? obrasPeriodo.reduce((s,o) => s + Number(o.valor_pago||0), 0) : 0;

      const percObras = meta.meta_obras > 0 ? (numObras / meta.meta_obras) * 100 : 0;
      const percValor = meta.meta_valor > 0 ? (valorTotal / meta.meta_valor) * 100 : 0;
      const percMedia = Math.round((percObras + percValor) / 2);
      const percBarra = Math.min(percMedia, 100);
      const atingida = percMedia >= 100;

      const fraseObj = escolherFrase(percMedia, true);

      cards.push(`
        <div class="meta-card">
          <div class="meta-head">
            <h3>${PERIODO_LABEL[meta.periodo]} ${meta.numero_periodo} · ${meta.ano}</h3>
            <span class="periodo-tag">${percMedia}%</span>
          </div>
          <div class="meta-bar-track"><div class="meta-bar-fill ${atingida?'atingida':''}" style="width:${percBarra}%"></div></div>
          <div class="meta-nums">
            <span>${numObras} / ${meta.meta_obras} obras</span>
            <span>${formatAOA(valorTotal)} / ${formatAOA(meta.meta_valor)}</span>
          </div>
          <div class="meta-frase ${atingida?'atingida':''}">${fraseObj.texto}</div>
        </div>
      `);
    }
    container.innerHTML = cards.join('');
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as metas: ${e.message || 'erro desconhecido'}</div>`;
  }
}

function periodoAtualParaMeta(meta){
  // Usa o ano/número de período já guardados na meta (definidos pelo CEO),
  // não necessariamente o período corrente do calendário.
  const ano = meta.ano;
  const numero = meta.numero_periodo;
  if(meta.periodo === 'trimestral'){
    return { inicio: new Date(ano, (numero - 1) * 3, 1), fim: new Date(ano, numero * 3, 0) };
  }
  if(meta.periodo === 'semestral'){
    return { inicio: new Date(ano, numero === 1 ? 0 : 6, 1), fim: new Date(ano, numero === 1 ? 6 : 12, 0) };
  }
  return { inicio: new Date(ano, 0, 1), fim: new Date(ano, 12, 0) };
}

// Mensagem de WhatsApp para o CEO, ao pedir o pagamento da comissão
// pendente — lista cada obra que compõe o valor, para não haver dúvidas.
function buildPedidoComissaoWaLink(obras, nomePorTelefone, totalPendente){
  const linhas = obras
    .filter(o => o.estado === 'concluido' && !o.comissao_paga)
    .map(o => `- ${nomePorTelefone[o.cliente_telefone] || o.cliente_nome}: ${formatAOA(calcularComissaoAfilhado(o))}`);
  const msg = `Olá! Gostaria de pedir o pagamento da minha comissão de parceiro publicitário, pendente:\n${linhas.join('\n')}\nTotal: ${formatAOA(totalPendente)}`;
  return `https://wa.me/${CEO_WHATSAPP}?text=${encodeURIComponent(msg)}`;
}
