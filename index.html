// Desenha a grelha da Loja a partir do catálogo já em cache, filtrando
// no próprio browser — troca de categoria é instantânea, sem nova
// consulta à base de dados.
function desenharGrelhaLoja(filtro){
  const area = document.getElementById('lojaGrid');
  if(!area) return;
  const { servicos, prontos, digitais, avaliacoes, reacoes } = catalogoVitrineCache;
  let lista;
  if(filtro === 'servico_atelier') lista = servicos;
  else if(filtro === 'pronto') lista = prontos;
  else if(filtro === 'digital') lista = digitais;
  else lista = [...servicos, ...prontos, ...digitais];

  const maisVendidoId = melhorVendaDe(lista);
  renderGrelhaProdutos(area, lista, 'Ainda não há nada publicado nesta categoria. Volte em breve.', avaliacoes, maisVendidoId, reacoes);
}

// Guarda um WhatsApp interessado (sem compra associada) para remarketing
// de promoções e novos e-books — tabela simples, à parte das encomendas.
async function registarContactoWhatsapp(){
  const input = document.getElementById('captaWhatsappInput');
  const btn = document.getElementById('captaWhatsappBtn');
  const errBox = document.getElementById('captaWhatsappErro');
  const okBox = document.getElementById('captaWhatsappOk');
  errBox.style.display = 'none';
  okBox.style.display = 'none';

  const telefone = input.value.trim();
  if(telefone.length < 8){
    errBox.textContent = 'Introduza um número de WhatsApp válido.';
    errBox.style.display = 'block';
    return;
  }

  btn.textContent = 'A enviar…';
  btn.disabled = true;
  try{
    const { error } = await sb.from('contactos_interessados').insert({ telefone, origem: 'vitrine' });
    if(error) throw error;

    // Notificação no site (sino do painel) — falha silenciosa se a
    // tabela ainda não tiver sido criada no Supabase.
    sb.from('notificacoes_sistema').insert({
      tipo: 'pedido_novidade',
      mensagem: `Novo pedido de novidades/promoções — WhatsApp: ${telefone}`
    }).then(({ error: errNotif }) => { if(errNotif) console.warn('Notificação não guardada:', errNotif.message); });

    input.value = '';
    okBox.style.display = 'block';

    // Notificação no WhatsApp do CEO — abre com a mensagem já pronta,
    // só falta a pessoa confirmar o envio.
    const mensagemCeo = `Olá! Quero receber novidades e promoções da Dionuel. O meu WhatsApp: ${telefone}`;
    window.open(`https://wa.me/${CEO_WHATSAPP}?text=${encodeURIComponent(mensagemCeo)}`, '_blank');
  }catch(e){
    errBox.textContent = 'Não foi possível guardar: ' + (e.message || 'erro desconhecido');
    errBox.style.display = 'block';
  }finally{
    btn.textContent = 'Quero receber';
    btn.disabled = false;
  }
}

// Cache do catálogo já carregado — evita voltar a consultar a base de
// dados quando abrimos a página de um produto ou mostramos sugestões
// no carrinho.
let catalogoVitrineCache = { servicos: [], prontos: [], digitais: [], avaliacoes: {}, reacoes: {} };

async function carregarCatalogoVitrine(){
  try{
    const { data, error } = await sb.from('produtos').select('*').eq('ativo', true).order('ordem', { ascending: true });
    if(error) throw error;

    const { data: avals } = await sb.from('avaliacoes').select('produto_id, nota').eq('aprovado', true);
    const avaliacoesMap = {};
    (avals || []).forEach(a => {
      if(!avaliacoesMap[a.produto_id]) avaliacoesMap[a.produto_id] = { soma: 0, total: 0 };
      avaliacoesMap[a.produto_id].soma += a.nota;
      avaliacoesMap[a.produto_id].total += 1;
    });

    // Reações (Adorei/Gostei) — se a tabela ainda não existir na base de
    // dados, ignora em silêncio: a loja continua a funcionar, só sem
    // contadores de reação até o SQL ser corrido.
    const reacoesMap = {};
    try{
      const { data: reacoesData, error: reacoesErro } = await sb.from('reacoes_produto').select('produto_id, tipo');
      if(reacoesErro) throw reacoesErro;
      (reacoesData || []).forEach(r => {
        if(!reacoesMap[r.produto_id]) reacoesMap[r.produto_id] = { adorei: 0, gostei: 0 };
        if(r.tipo === 'adorei' || r.tipo === 'gostei') reacoesMap[r.produto_id][r.tipo] += 1;
      });
    }catch(_e){ /* tabela ainda não existe — segue sem reações */ }

    catalogoVitrineCache = {
      servicos: (data || []).filter(p => p.tipo === 'servico_atelier'),
      prontos: (data || []).filter(p => p.tipo === 'pronto'),
      digitais: (data || []).filter(p => p.tipo === 'ebook' || p.tipo === 'combo'),
      avaliacoes: avaliacoesMap,
      reacoes: reacoesMap
    };
  }catch(e){
    // A Loja (se for a página aberta) mostra o próprio erro na sua grelha;
    // fora dela, isto só significa que o carrinho não tem sugestões extra.
    const area = document.getElementById('lojaGrid');
    if(area) area.innerHTML = `<div class="error-banner">Não foi possível carregar o catálogo: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

function melhorVendaDe(lista){
  const comVendas = (lista || []).filter(p => (p.vendas_count || 0) > 0);
  if(comVendas.length === 0) return null;
  return comVendas.reduce((max, p) => (p.vendas_count > max.vendas_count ? p : max)).id;
}

function renderGrelhaProdutos(area, lista, mensagemVazio, avaliacoesMap, maisVendidoId, reacoesMap){
  area.textContent = '';
  if(!lista || lista.length === 0){
    const vazio = document.createElement('div');
    vazio.className = 'empty-state-small';
    vazio.textContent = mensagemVazio;
    area.appendChild(vazio);
    return;
  }
  lista.forEach(p => area.appendChild(criarCartaoProduto(p, avaliacoesMap || {}, maisVendidoId, reacoesMap || {})));
}

// Rótulo, texto de capa (sem imagem) e HTML de preço — centralizados
// aqui para os 4 tipos de produto (servico_atelier, pronto, ebook, combo)
// não ficarem espalhados e por atualizar em vários sítios.
function rotuloTipoProduto(tipo){
  if(tipo === 'servico_atelier') return 'Serviço do ateliê';
  if(tipo === 'pronto') return 'Peça pronta';
  if(tipo === 'combo') return 'Combo digital';
  return 'E-book';
}
function capaFallbackProduto(tipo){
  if(tipo === 'servico_atelier') return 'ATELIÊ';
  if(tipo === 'pronto') return 'LOJA';
  return 'E-BOOK';
}
// Formata os milissegundos que faltam como "1d 04:12:33" ou "04:12:33" —
// estilo relógio de promoção relâmpago das lojas virtuais profissionais.
function formatarContagemPromo(msRestantes){
  const totalSeg = Math.max(0, Math.floor(msRestantes / 1000));
  const dias = Math.floor(totalSeg / 86400);
  const horas = Math.floor((totalSeg % 86400) / 3600);
  const min = Math.floor((totalSeg % 3600) / 60);
  const seg = totalSeg % 60;
  const pad = n => String(n).padStart(2, '0');
  return dias > 0 ? `${dias}d ${pad(horas)}:${pad(min)}:${pad(seg)}` : `${pad(horas)}:${pad(min)}:${pad(seg)}`;
}

// Diz se a promoção de um produto ainda está de pé agora mesmo — usado
// tanto para decidir o texto do preço como para o selo "Promoção" no
// cartão. Sem preco_promocional válido, ou com o prazo já esgotado,
// devolve false — e tudo volta a mostrar-se como preço normal.
function promocaoAtiva(p){
  const temPromo = p.preco_promocional && Number(p.preco_promocional) < Number(p.preco);
  if(!temPromo) return false;
  if(!p.promocao_fim) return true; // promoção sem prazo definido
  return new Date(p.promocao_fim).getTime() - Date.now() > 0;
}

function precoDisplayHTML(p, tamanhoGrande){
  const tamanho = tamanhoGrande ? 'style="display:block; font-size:11px; color:var(--linho-dim); font-weight:400;"' : '';
  // "A partir de" — para serviços cujo preço final só se sabe depois de ver
  // a peça (ex.: ajustes). O admin publica um preço-base e este prefixo
  // avisa o cliente de que pode variar, sem inventar um preço fixo falso.
  const prefixoAPartir = p.preco_a_partir_de ? 'A partir de ' : '';

  if(p.tipo === 'servico_atelier' && p.percentual_sinal){
    const sinal = p.preco * p.percentual_sinal / 100;
    return `${prefixoAPartir}${esc(formatarPreco(sinal, p.moeda))}<small ${tamanho}>sinal de ${p.percentual_sinal}% de ${esc(formatarPreco(p.preco, p.moeda))}</small>`;
  }

  if(promocaoAtiva(p)){
    // A contagem regressiva só aparece quando o CEO definiu uma data-limite
    // para a promoção; sem data, mostra o desconto sem prazo (compatível
    // com produtos criados antes desta funcionalidade existir).
    const msRestantes = p.promocao_fim ? (new Date(p.promocao_fim).getTime() - Date.now()) : null;
    const contagemHTML = msRestantes !== null
      ? ` · termina em <span class="promo-contagem">${formatarContagemPromo(msRestantes)}</span>`
      : '';
    return `${prefixoAPartir}${esc(formatarPreco(p.preco_promocional, p.moeda))}<small ${tamanho}><s>${esc(formatarPreco(p.preco, p.moeda))}</s> preço com desconto${contagemHTML}</small>`;
  }

  // Promoção sem data expirou (ou nunca existiu) — volta sozinho ao
  // preço normal, sem o administrador precisar de desativar nada à mão.
  return `${prefixoAPartir}${esc(formatarPreco(p.preco, p.moeda))}`;
}

// Um único relógio global atualiza todos os blocos de preço com promoção
// por segundo — mais leve do que um setInterval por cartão. Quando o
// prazo acaba, o próprio precoDisplayHTML deixa de mostrar a promoção,
// então o "revert" ao preço normal acontece sozinho, sem reload.
const registoContagensPreco = [];
function registarContagemPreco(elemento, produto, tamanhoGrande){
  if(!produto.promocao_fim) return; // sem prazo, nada para contar
  registoContagensPreco.push({ elemento, produto, tamanhoGrande });
}
setInterval(() => {
  for(let i = registoContagensPreco.length - 1; i >= 0; i--){
    const { elemento, produto, tamanhoGrande } = registoContagensPreco[i];
    if(!document.body.contains(elemento)){
      registoContagensPreco.splice(i, 1); // saiu do ecrã (mudou de página)
      continue;
    }
    elemento.innerHTML = precoDisplayHTML(produto, tamanhoGrande);
    if(new Date(produto.promocao_fim).getTime() - Date.now() <= 0){
      registoContagensPreco.splice(i, 1); // já reverteu — não precisa de continuar
    }
  }
}, 1000);

/* ---------------------- Motor de Preços por Quantidade ----------------------
   Lê níveis opcionais no próprio produto (preco_3un, preco_5un, preco_10un).
   Se a coluna não existir ainda na base de dados ou estiver vazia, esse
   nível é ignorado — nunca inventa preço, cai sempre para o nível anterior
   (ou preço normal). O admin só precisa de preencher os níveis que quiser
   oferecer; tudo o resto continua a funcionar sem eles. Aplica-se a peças
   prontas e serviços do ateliê (fardamento/uniformes corporativos em
   quantidade) — e-books e combos mantêm-se sempre em quantidade 1. */
function niveisPrecoProduto(p){
  const base = promocaoAtiva(p) ? Number(p.preco_promocional) : Number(p.preco);
  const niveis = [{ qtd: 1, precoUnit: base }];
  if(p.preco_3un && Number(p.preco_3un) > 0) niveis.push({ qtd: 3, precoUnit: Number(p.preco_3un) });
  if(p.preco_5un && Number(p.preco_5un) > 0) niveis.push({ qtd: 5, precoUnit: Number(p.preco_5un) });
  if(p.preco_10un && Number(p.preco_10un) > 0) niveis.push({ qtd: 10, precoUnit: Number(p.preco_10un) });
  return niveis.sort((a,b) => a.qtd - b.qtd);
}
function produtoTemNiveisQuantidade(p){
  return (p.tipo === 'pronto' || p.tipo === 'servico_atelier') && niveisPrecoProduto(p).length > 1;
}
// Preço unitário aplicável a uma dada quantidade — usa o maior nível cuja
// quantidade mínima já foi atingida.
function precoUnitarioPorQuantidade(p, qtd){
  const niveis = niveisPrecoProduto(p);
  let aplicavel = niveis[0];
  niveis.forEach(n => { if(qtd >= n.qtd) aplicavel = n; });
  return aplicavel.precoUnit;
}
// Próximo nível ainda por desbloquear (para a barra "compre mais,
// economize mais") — ou null se já está no nível máximo.
function proximoNivelPreco(p, qtd){
  return niveisPrecoProduto(p).find(n => n.qtd > qtd) || null;
}
// HTML da barra "compre mais, economize mais" — mostra todos os níveis
// configurados e destaca o que está ativo para a quantidade escolhida.
function barraNiveisHTML(p, qtdAtual, moeda){
  const niveis = niveisPrecoProduto(p);
  if(niveis.length <= 1) return '';
  const linhas = niveis.map(n => {
    const ativo = qtdAtual >= n.qtd && (niveis.filter(x => qtdAtual >= x.qtd).slice(-1)[0].qtd === n.qtd);
    const economiaPct = niveis[0].precoUnit > 0 ? Math.round((1 - n.precoUnit / niveis[0].precoUnit) * 100) : 0;
    return `<div class="nivel-qtd-linha${ativo ? ' ativo' : ''}">
      <span>${n.qtd === 1 ? '1 unidade' : n.qtd + '+ unidades'}</span>
      <span>${esc(formatarPreco(n.precoUnit, moeda))}/un${economiaPct > 0 ? ` <em>-${economiaPct}%</em>` : ''}</span>
    </div>`;
  }).join('');
  const prox = proximoNivelPreco(p, qtdAtual);
  const nudge = prox
    ? `<div class="nivel-qtd-nudge">Adicione mais ${prox.qtd - qtdAtual} para desbloquear ${esc(formatarPreco(prox.precoUnit, moeda))}/unidade.</div>`
    : `<div class="nivel-qtd-nudge nivel-qtd-max">⭐ Já está no melhor preço por unidade.</div>`;
  return `<div class="nivel-qtd-bar">${linhas}${nudge}</div>`;
}

function listaCategoriaDoProduto(tipo){
  if(tipo === 'servico_atelier') return catalogoVitrineCache.servicos;
  if(tipo === 'pronto') return catalogoVitrineCache.prontos;

}

  return `Olá! Tenho interesse em "${p.nome}". Pode dar-me mais informações?`;
}

function criarCartaoProduto(p, avaliacoesMap, maisVendidoId, reacoesMap){
  avaliacoesMap = avaliacoesMap || {};
  reacoesMap = reacoesMap || {};
  const card = document.createElement('div');
  card.className = 'produto-card';
  card.style.cursor = 'pointer';
  card.addEventListener('click', () => renderProdutoDetalhe(p));

  const capa = document.createElement('div');
  if(p.video_url){
    // Vídeo tem prioridade sobre a imagem quando ambos existem — mostra
    // o produto em movimento, com a foto como capa antes de dar play.
    capa.className = 'produto-capa';
    const video = document.createElement('video');
    video.src = p.video_url;
    if(p.imagem_url) video.poster = p.imagem_url;
    video.controls = true;
    video.muted = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.addEventListener('click', (e) => e.stopPropagation());
    capa.appendChild(video);
  } else if(p.imagem_url){
    capa.className = 'produto-capa';
    const img = document.createElement('img');
    img.src = p.imagem_url;
    img.alt = p.nome;
    img.loading = 'lazy';
    capa.appendChild(img);
  } else {
    capa.className = 'produto-capa sem-imagem';
    capa.textContent = capaFallbackProduto(p.tipo);
  }
  if(p.id === maisVendidoId){
    const selo = document.createElement('div');
    selo.className = 'produto-selo';
    selo.textContent = 'Mais vendido';
    capa.appendChild(selo);
  }
  if(promocaoAtiva(p)){
    const promoSelo = document.createElement('div');
    promoSelo.className = 'promo-selo';
    promoSelo.textContent = 'Promoção';
    capa.appendChild(promoSelo);
  }
  card.appendChild(capa);

  const corpo = document.createElement('div');
  corpo.className = 'produto-corpo';

  const tipoEl = document.createElement('div');
  tipoEl.className = 'produto-tipo';
  tipoEl.textContent = rotuloTipoProduto(p.tipo);
  corpo.appendChild(tipoEl);

  const nomeEl = document.createElement('div');
  nomeEl.className = 'produto-nome';
  nomeEl.textContent = p.nome;
  corpo.appendChild(nomeEl);

  const aval = avaliacoesMap[p.id];
  const reac = reacoesMap[p.id];
  if((aval && aval.total > 0) || (reac && (reac.adorei > 0 || reac.gostei > 0))){
    const ratingEl = document.createElement('div');
    ratingEl.className = 'produto-rating';
    const partes = [];
    if(aval && aval.total > 0) partes.push(`★ ${(aval.soma / aval.total).toFixed(1)} (${aval.total})`);
    if(reac && reac.adorei > 0) partes.push(`${reac.adorei} adoraram`);
    if(reac && reac.gostei > 0) partes.push(`${reac.gostei} gostaram`);
    ratingEl.textContent = partes.join(' · ');
    corpo.appendChild(ratingEl);
  }

  if(p.descricao){
    const descEl = document.createElement('div');
    descEl.className = 'produto-desc';
    descEl.textContent = p.descricao.length > 90 ? p.descricao.slice(0, 90).trim() + '…' : p.descricao;
    corpo.appendChild(descEl);
  }

  const rodape = document.createElement('div');
  rodape.className = 'produto-rodape';

  const precoEl = document.createElement('div');
  precoEl.className = 'produto-preco';
  precoEl.innerHTML = precoDisplayHTML(p, false);
  rodape.appendChild(precoEl);
  registarContagemPreco(precoEl, p, false);

  const acoesEl = document.createElement('div');
  acoesEl.style.cssText = 'display:flex; gap:6px;';

  const btnSolicitar = document.createElement('a');
  btnSolicitar.href = `https://wa.me/${REDES_DIONUEL.whatsapp}?text=${encodeURIComponent(mensagemSolicitarProduto(p))}`;
  btnSolicitar.target = '_blank';
  btnSolicitar.rel = 'noopener';
  btnSolicitar.className = 'btn-vitrine-secundaria';
  btnSolicitar.style.cssText = 'padding:8px 12px; font-size:11.5px;';
  btnSolicitar.textContent = 'Solicitar';
  btnSolicitar.addEventListener('click', (e) => e.stopPropagation());
  acoesEl.appendChild(btnSolicitar);

  const btn = document.createElement('button');
  btn.className = 'btn-add-carrinho';
  btn.textContent = 'Adicionar';
  btn.addEventListener('click', (e) => { e.stopPropagation(); adicionarAoCarrinho(p); });
  acoesEl.appendChild(btn);

  rodape.appendChild(acoesEl);

  corpo.appendChild(rodape);
  card.appendChild(corpo);
  return card;
}

// Puxa fotos reais já publicadas no feed da equipa — prova social sem
// depender de fotos de stock nem de manutenção extra.
// Página de um único produto — dá espaço para copy mais persuasivo,
// mostra avaliações reais de outros clientes, e sugere mais produtos
// da mesma categoria (é aqui que "instiga a comprar mais").
// Reações rápidas (Adorei/Gostei) na página do produto — mais leve do que
// preencher o formulário de avaliação. Um clique por produto por
// navegador (guardado no localStorage), sem precisar de login.
async function renderReacoesProduto(produto){
  const area = document.getElementById('pd_reacoes');
  if(!area) return;
  const chaveLocal = `dionuel_reagiu_${produto.id}`;
  let jaReagiu = localStorage.getItem(chaveLocal);

  async function contarReacoes(){
    try{
      const { data, error } = await sb.from('reacoes_produto').select('tipo').eq('produto_id', produto.id);
      if(error) throw error;
      const contagem = { adorei: 0, gostei: 0 };
      (data || []).forEach(r => { if(contagem[r.tipo] !== undefined) contagem[r.tipo] += 1; });
      return contagem;
    }catch(_e){
      return null; // tabela "reacoes_produto" ainda não existe — sem crash
    }
  }

  function desenhar(contagem){
    if(!contagem){ area.innerHTML = ''; return; }
    area.innerHTML = `
      <button type="button" class="btn-vitrine-secundaria" id="reagirAdorei" style="padding:8px 16px; font-size:12.5px;" ${jaReagiu ? 'disabled' : ''}>Adorei${contagem.adorei ? ' (' + contagem.adorei + ')' : ''}</button>
      <button type="button" class="btn-vitrine-secundaria" id="reagirGostei" style="padding:8px 16px; font-size:12.5px;" ${jaReagiu ? 'disabled' : ''}>Gostei${contagem.gostei ? ' (' + contagem.gostei + ')' : ''}</button>
      ${jaReagiu ? '<span style="font-size:12px; color:var(--linho-dim);">Obrigado pela reação!</span>' : ''}
    `;
    if(!jaReagiu){
      document.getElementById('reagirAdorei').addEventListener('click', () => reagir('adorei'));
      document.getElementById('reagirGostei').addEventListener('click', () => reagir('gostei'));
    }
  }

  async function reagir(tipo){
    try{
      const { error } = await sb.from('reacoes_produto').insert({ produto_id: produto.id, tipo });
      if(error) throw error;
      localStorage.setItem(chaveLocal, tipo);
      jaReagiu = tipo;
      desenhar(await contarReacoes());
    }catch(_e){ /* tabela em falta ou sem rede — ignora em silêncio */ }
  }

  desenhar(await contarReacoes());
}

async function carregarAvaliacoesProduto(produtoId){
  const ratingArea = document.getElementById('pd_rating');
  const listaArea = document.getElementById('pd_avaliacoes');
  try{
    const { data, error } = await sb.from('avaliacoes').select('*').eq('produto_id', produtoId).eq('aprovado', true).order('criado_em', { ascending: false });
    if(error) throw error;

    if(!data || data.length === 0){
      ratingArea.innerHTML = '';
      listaArea.innerHTML = '<div class="empty-state-small">Ainda sem avaliações — seja a primeira pessoa a avaliar.</div>';
      return;
    }

    const media = data.reduce((s,a) => s + a.nota, 0) / data.length;
    ratingArea.innerHTML = `<span class="produto-rating">★ ${media.toFixed(1)} · ${data.length} avaliação${data.length===1?'':'ões'}</span>`;

    listaArea.textContent = '';
    data.forEach(a => {
      const item = document.createElement('div');
      item.className = 'avaliacao-item';
      const estrelas = document.createElement('div');
      estrelas.className = 'estrelas';
      estrelas.textContent = '★'.repeat(a.nota) + '☆'.repeat(5 - a.nota);
      const nome = document.createElement('div');
      nome.className = 'nome';
      nome.textContent = a.cliente_nome;
      item.appendChild(estrelas);
      item.appendChild(nome);
      if(a.comentario){
        const com = document.createElement('div');
        com.className = 'comentario';
        com.textContent = a.comentario;
        item.appendChild(com);
      }
      listaArea.appendChild(item);
    });
  }catch(e){
    listaArea.innerHTML = `<div class="error-banner">Não foi possível carregar as avaliações.</div>`;
  }
}

function ativarFormularioAvaliacao(produtoId){
  let notaEscolhida = 0;
  document.querySelectorAll('#av_estrelas span').forEach(s => {
    s.addEventListener('click', () => {
      notaEscolhida = Number(s.dataset.n);
      document.querySelectorAll('#av_estrelas span').forEach(x => x.classList.toggle('ativa', Number(x.dataset.n) <= notaEscolhida));
    });
  });

  document.getElementById('av_submit').addEventListener('click', async () => {
    const btn = document.getElementById('av_submit');
    const errBox = document.getElementById('av_error');
    errBox.style.display = 'none';

    const nome = document.getElementById('av_nome').value.trim();
    if(!nome || notaEscolhida === 0){
      errBox.textContent = 'Escreva o seu nome e escolha uma nota.';
      errBox.style.display = 'block';
      return;
    }

    btn.textContent = 'A enviar…';
    btn.disabled = true;
    try{
      const { error } = await sb.from('avaliacoes').insert({
        produto_id: produtoId,
        cliente_nome: nome,
        nota: notaEscolhida,
        comentario: document.getElementById('av_comentario').value.trim() || null
      });
      if(error) throw error;
      showToast('Obrigado! A sua avaliação será revista antes de aparecer ✓');
      document.getElementById('av_nome').value = '';
      document.getElementById('av_comentario').value = '';
      notaEscolhida = 0;
      document.querySelectorAll('#av_estrelas span').forEach(x => x.classList.remove('ativa'));
      btn.textContent = 'Enviar avaliação';
      btn.disabled = false;
    }catch(e){
      errBox.textContent = 'Não foi possível enviar: ' + (e.message || 'erro desconhecido');
      errBox.style.display = 'block';
      btn.textContent = 'Enviar avaliação';
      btn.disabled = false;
    }
  });
}

/* ---------------------- Carrinho ---------------------- */
function salvarCarrinho(){
  try{ localStorage.setItem('dionuel_carrinho', JSON.stringify(carrinho)); }catch(e){ /* modo privado do navegador — sem problema, só não persiste */ }
}

function adicionarAoCarrinho(p, quantidade){
  if(carrinho.length > 0 && carrinho[0].moeda !== p.moeda){
    showToast(`Este carrinho já tem itens em ${carrinho[0].moeda} — finalize essa compra antes de adicionar itens em ${p.moeda}.`);
    return;
  }
  // Itens digitais (e-book/combo) não têm níveis de quantidade.
  quantidade = (p.tipo === 'ebook' || p.tipo === 'combo') ? 1 : Math.max(1, Number(quantidade) || 1);

  const precoUnitBase = precoUnitarioPorQuantidade(p, quantidade); // já considera promoção e nível de quantidade
  const precoUnitCobrado = (p.tipo === 'servico_atelier' && p.percentual_sinal) ? (precoUnitBase * p.percentual_sinal / 100) : precoUnitBase;

  // Mesmo produto já no carrinho: soma a quantidade em vez de duplicar a
  // linha, e recalcula o preço unitário — pode desbloquear um nível melhor.
  const existente = carrinho.find(i => i.produto_id === p.id);
  if(existente && p.tipo !== 'ebook' && p.tipo !== 'combo'){
    existente.quantidade += quantidade;
    const novoUnitBase = precoUnitarioPorQuantidade(p, existente.quantidade);
    existente.preco_unitario = (p.tipo === 'servico_atelier' && p.percentual_sinal) ? (novoUnitBase * p.percentual_sinal / 100) : novoUnitBase;
    existente.subtotal = existente.preco_unitario * existente.quantidade;
  } else if(!existente){
    carrinho.push({
      produto_id: p.id,
      tipo: p.tipo,
      nome: p.nome,
      moeda: p.moeda,
      quantidade,
      preco_unitario: precoUnitCobrado,
      preco_integral: p.preco,
      percentual_sinal: p.percentual_sinal || null,
      subtotal: precoUnitCobrado * quantidade
    });
  }
  salvarCarrinho();
  atualizarBadgeCarrinho();
  showToast(quantidade > 1 ? `${quantidade}× ${p.nome} adicionado ao carrinho` : `${p.nome} adicionado ao carrinho`);
}

function removerDoCarrinho(index){
  carrinho.splice(index, 1);
  salvarCarrinho();
  atualizarBadgeCarrinho();
  renderCarrinhoDrawer();
}

// Ajusta a quantidade de uma linha já no carrinho (+/- no drawer),
// recalculando o preço unitário pelo motor de níveis — se a nova
// quantidade desbloquear ou perder um nível, o preço acompanha na hora.
function alterarQuantidadeCarrinho(index, delta){
  const item = carrinho[index];
  if(!item) return;
  const novaQtd = item.quantidade + delta;
  if(novaQtd < 1){ removerDoCarrinho(index); return; }
  item.quantidade = novaQtd;
  const p = [...catalogoVitrineCache.servicos, ...catalogoVitrineCache.prontos].find(pp => pp.id === item.produto_id);
  if(p){
    const novoUnitBase = precoUnitarioPorQuantidade(p, novaQtd);
    item.preco_unitario = (p.tipo === 'servico_atelier' && p.percentual_sinal) ? (novoUnitBase * p.percentual_sinal / 100) : novoUnitBase;
  }
  item.subtotal = item.preco_unitario * item.quantidade;
  salvarCarrinho();
  atualizarBadgeCarrinho();
  renderCarrinhoDrawer();
}

function calcularTotalCarrinho(){
  return carrinho.reduce((soma, item) => soma + (item.subtotal ?? (item.preco_unitario * (item.quantidade || 1))), 0);
}

function atualizarBadgeCarrinho(){
  const fab = document.getElementById('carrinhoFab');
  const badge = document.getElementById('carrinhoBadge');
  if(!fab || !badge) return;
  badge.textContent = carrinho.reduce((soma, item) => soma + (item.quantidade || 1), 0);
  fab.style.display = carrinho.length > 0 ? 'flex' : 'none';
}

function abrirCarrinho(){
  document.getElementById('carrinhoBackdrop').style.display = 'block';
  document.getElementById('carrinhoDrawer').style.display = 'flex';
  renderCarrinhoDrawer();
}
function fecharCarrinho(){
  document.getElementById('carrinhoBackdrop').style.display = 'none';
  document.getElementById('carrinhoDrawer').style.display = 'none';
}

  fechar.addEventListener('click', fecharCarrinho);
  head.appendChild(titulo);

  const corpo = document.createElement('div');

  if(temEbookAvulso && !temCombo && comboDisponivel){
    const nudge = document.createElement('div');
    nudge.className = 'combo-nudge';
    nudge.innerHTML = `Junte os 3 e-books e poupe com o <a href="#" id="carrinho_ver_combo">Combo Digital →</a>`;
    corpo.appendChild(nudge);
    setTimeout(() => {
      const link = document.getElementById('carrinho_ver_combo');
      if(link) link.addEventListener('click', (e) => { e.preventDefault(); fecharCarrinho(); renderProdutoDetalhe(comboDisponivel); });
    }, 0);
  }

  if(carrinho.length === 0){
    const vazio = document.createElement('div');
    vazio.className = 'empty-state-small';
    vazio.textContent = 'O carrinho está vazio.';
    corpo.appendChild(vazio);
  } else {
    carrinho.forEach((item, i) => {
      const linha = document.createElement('div');
      linha.className = 'carrinho-linha';
      linha.style.flexDirection = 'column';
      linha.style.alignItems = 'stretch';

      const topo = document.createElement('div');
      topo.style.cssText = 'display:flex; gap:12px; align-items:flex-start; width:100%;';

      const info = document.createElement('div');
      info.className = 'info';
      const nome = document.createElement('div');
      nome.className = 'nome';
      nome.textContent = item.nome;
      info.appendChild(nome);
      if(item.percentual_sinal){
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `Sinal de ${item.percentual_sinal}% (serviço completo: ${formatarPreco(item.preco_integral, item.moeda)})`;
        info.appendChild(meta);
      }
      const remover = document.createElement('div');
      remover.className = 'remover';
      remover.textContent = 'Remover';
      remover.style.cursor = 'pointer';
      remover.addEventListener('click', () => removerDoCarrinho(i));
      info.appendChild(remover);
      topo.appendChild(info);

      const preco = document.createElement('div');
      preco.className = 'preco';
      preco.textContent = formatarPreco(item.subtotal ?? item.preco_unitario, item.moeda);
      topo.appendChild(preco);
      linha.appendChild(topo);

      // Peças prontas e serviços do ateliê podem ter a quantidade ajustada
      // aqui mesmo; e-books/combo ficam sempre em 1, sem stepper.
      const podeAjustarQtd = item.tipo === 'pronto' || item.tipo === 'servico_atelier';
      if(podeAjustarQtd){
        const linhaQtd = document.createElement('div');
        linhaQtd.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:10px;';
        const stepper = document.createElement('div');
        stepper.className = 'qtd-stepper';
        stepper.style.cssText = 'transform:scale(0.85); transform-origin:left center;';
        stepper.innerHTML = `<button type="button">−</button><input type="text" value="${item.quantidade}" readonly><button type="button">+</button>`;
        stepper.children[0].addEventListener('click', () => alterarQuantidadeCarrinho(i, -1));
        stepper.children[2].addEventListener('click', () => alterarQuantidadeCarrinho(i, 1));
        linhaQtd.appendChild(stepper);
        const unitLabel = document.createElement('span');
        unitLabel.style.cssText = 'font-size:11px; color:var(--linho-dim); font-family:"JetBrains Mono", monospace;';
        unitLabel.textContent = `${formatarPreco(item.preco_unitario, item.moeda)}/un`;
        linhaQtd.appendChild(unitLabel);
        linha.appendChild(linhaQtd);

        const p = [...catalogoVitrineCache.servicos, ...catalogoVitrineCache.prontos].find(pp => pp.id === item.produto_id);
        if(p){
          const prox = proximoNivelPreco(p, item.quantidade);
          if(prox){
            const nudge = document.createElement('div');
            nudge.style.cssText = 'font-size:11px; color:var(--caramelo); margin-top:4px;';
            nudge.textContent = `Faltam ${prox.qtd - item.quantidade} para ${formatarPreco(prox.precoUnit, item.moeda)}/unidade`;
            linha.appendChild(nudge);
          }
        }
      }

      corpo.appendChild(linha);
    });
  }
  drawer.appendChild(corpo);

  const rodape = document.createElement('div');
  rodape.className = 'carrinho-drawer-rodape';
  if(carrinho.length > 0){
    const totalLinha = document.createElement('div');
    totalLinha.className = 'carrinho-total-linha';
    const totalLabel = document.createElement('span');
    totalLabel.textContent = 'Total agora';
    const totalValor = document.createElement('span');
    totalValor.textContent = formatarPreco(calcularTotalCarrinho(), carrinho[0].moeda);
    totalLinha.appendChild(totalLabel);
    totalLinha.appendChild(totalValor);
    rodape.appendChild(totalLinha);

    const btnCheckout = document.createElement('button');
    btnCheckout.className = 'btn-vitrine-primaria';
    btnCheckout.style.width = '100%';
    btnCheckout.style.justifyContent = 'center';
    btnCheckout.textContent = 'Finalizar compra';
    btnCheckout.addEventListener('click', abrirCheckout);
    rodape.appendChild(btnCheckout);
  }
  drawer.appendChild(rodape);
}

// Cria a encomenda em estado de aprovação pendente e abre o WhatsApp do
// CEO com uma mensagem pronta — é assim que o CEO "recebe a notificação"
// sem precisarmos de nenhuma API paga: usamos o link direto wa.me.
async function pedirAprovacaoCeo(){
  const btn = document.getElementById('chk2_finalizar');
  const errBox = document.getElementById('chk2_error');
  btn.textContent = 'A enviar pedido…';
  btn.disabled = true;

  try{
    const moeda = carrinho[0].moeda;
    const { data: encomenda, error: insErr } = await sb.from('encomendas').insert({
      cliente_nome: dadosCheckoutCliente.nome,
      cliente_telefone: dadosCheckoutCliente.telefone,
      cliente_email: dadosCheckoutCliente.email,
      itens: carrinho,
      valor_total: calcularTotalCarrinho(),
      moeda,
      metodo_pagamento: metodoPagamentoEscolhido,
      comprovativo_url: null,
      observacoes: dadosCheckoutCliente.observacoes,
      estado: 'aguardando_aprovacao_ceo'
    }).select().maybeSingle();
    if(insErr) throw insErr;

    const ref = encomenda && encomenda.id ? encomenda.id.slice(0,8).toUpperCase() : '—';
    const METODO_LABEL = { multicaixa_express: 'Multicaixa Express', transferencia: 'Transferência bancária', bybit: 'Bybit/Binance' };
    const listaItens = carrinho.map(i => `- ${(i.quantidade||1) > 1 ? (i.quantidade+'× ') : ''}${i.nome} (${formatarPreco(i.subtotal ?? i.preco_unitario, i.moeda)})`).join('\n');
    const mensagem = `Olá! Quero confirmar um pedido na loja Dionuel.\nReferência: ${ref}\nNome: ${dadosCheckoutCliente.nome}\nTelefone: ${dadosCheckoutCliente.telefone}\nItens:\n${listaItens}\nTotal: ${formatarPreco(calcularTotalCarrinho(), moeda)}\nMétodo escolhido: ${METODO_LABEL[metodoPagamentoEscolhido] || metodoPagamentoEscolhido}\n\nAguardo a confirmação antes de pagar. Obrigado!`;
    const linkWa = `https://wa.me/${CEO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
    window.open(linkWa, '_blank');

    carrinho = [];
    salvarCarrinho();
    renderCheckoutSucesso(encomenda);
  }catch(e){
    errBox.textContent = 'Não foi possível enviar o pedido: ' + (e.message || 'erro desconhecido');
    errBox.style.display = 'block';
    btn.textContent = 'Pedir aprovação ao CEO no WhatsApp';
    btn.disabled = false;
  }
}

// Cria a encomenda já como "aguardando_confirmacao" (sem passar por
// aprovação do CEO) — usado só para carrinhos 100% digitais. Se o
// cliente anexar o comprovativo aqui, já vai gravado no pedido.
async function finalizarCompraDigital(){
  const btn = document.getElementById('chk2_finalizar');
  const errBox = document.getElementById('chk2_error');
  const fileInput = document.getElementById('chk2_comprovativo');
  const file = fileInput && fileInput.files && fileInput.files[0];

  if(file){
    const v = validateFile(file);
    if(!v.ok || v.tipo !== 'imagem'){
      errBox.textContent = v.ok ? 'Escolha uma imagem para o comprovativo.' : v.mensagem;
      errBox.style.display = 'block';
      return;
    }
  }

  btn.textContent = 'A finalizar…';
  btn.disabled = true;

  try{
    const moeda = carrinho[0].moeda;
    let comprovativoPath = null;
    if(file){
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      comprovativoPath = `comprovativos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await sb.storage.from('dionuel-comprovativos').upload(comprovativoPath, file, { cacheControl: '3600', upsert: false });
      if(upErr) throw upErr;
    }

    const { data: encomenda, error: insErr } = await sb.from('encomendas').insert({
      cliente_nome: dadosCheckoutCliente.nome,
      cliente_telefone: dadosCheckoutCliente.telefone,
      cliente_email: dadosCheckoutCliente.email,
      itens: carrinho,
      valor_total: calcularTotalCarrinho(),
      moeda,
      metodo_pagamento: metodoPagamentoEscolhido,
      comprovativo_url: comprovativoPath,
      observacoes: dadosCheckoutCliente.observacoes,
      estado: 'aguardando_confirmacao'
    }).select().maybeSingle();
    if(insErr) throw insErr;

    const ref = encomenda && encomenda.id ? encomenda.id.slice(0,8).toUpperCase() : '—';
    const METODO_LABEL = { multicaixa_express: 'Multicaixa Express', transferencia: 'Transferência bancária', bybit: 'Bybit/Binance' };
    const listaItens = carrinho.map(i => `- ${(i.quantidade||1) > 1 ? (i.quantidade+'× ') : ''}${i.nome} (${formatarPreco(i.subtotal ?? i.preco_unitario, i.moeda)})`).join('\n');
    const mensagem = `Olá! Fiz uma compra digital na loja Dionuel.\nReferência: ${ref}\nNome: ${dadosCheckoutCliente.nome}\nItens:\n${listaItens}\nTotal: ${formatarPreco(calcularTotalCarrinho(), moeda)}\nMétodo: ${METODO_LABEL[metodoPagamentoEscolhido] || metodoPagamentoEscolhido}\n${file ? 'Já anexei o comprovativo no site.' : 'Vou enviar o comprovativo já a seguir.'}`;
    const linkWa = `https://wa.me/${CEO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
    window.open(linkWa, '_blank');

    carrinho = [];
    salvarCarrinho();
    renderCheckoutSucesso(encomenda, true);
  }catch(e){
    errBox.textContent = 'Não foi possível finalizar: ' + (e.message || 'erro desconhecido');
    errBox.style.display = 'block';
    btn.textContent = 'Finalizar compra';
    btn.disabled = false;
  }
}

function renderCheckoutSucesso(encomenda, instantaneo){
  const ref = encomenda && encomenda.id ? encomenda.id.slice(0,8).toUpperCase() : '—';
  const corpo = instantaneo
    ? `Referência: <strong class="mono" style="color:var(--linho);">${esc(ref)}</strong><br>
       Assim que confirmarmos o pagamento, enviamos o link de download pelo telefone que indicou.<br><br>
       Se ainda não enviou o comprovativo, pode enviá-lo a qualquer momento para <strong style="color:var(--linho);">${esc(CEO_WHATSAPP)}</strong> mencionando esta referência.`
    : `Referência: <strong class="mono" style="color:var(--linho);">${esc(ref)}</strong><br>
       Se o WhatsApp não abriu sozinho, envie-nos mensagem para <strong style="color:var(--linho);">${esc(CEO_WHATSAPP)}</strong> mencionando esta referência.<br><br>
       Assim que o pedido for aprovado, entramos em contacto pelo telefone que indicou a dizer que já pode efetuar o pagamento. <strong>Não pague antes disso.</strong>`;
  app.innerHTML = `
    <div class="vitrine">
      <div class="vitrine-header"><div class="logo-mark">DIONUEL</div></div>
      <div class="vitrine-secao" style="max-width:560px; text-align:center;">
        <div style="font-size:44px; margin-bottom:18px;">${instantaneo ? '' : ''}</div>
        <h2 style="margin-bottom:12px;">${instantaneo ? 'Compra recebida!' : 'Pedido enviado ao CEO!'}</h2>
        <p style="color:var(--linho-dim); font-size:14px; line-height:1.7; margin-bottom:10px;">
          ${corpo}
        </p>
        <button class="btn-vitrine-primaria" id="voltarLojaSucesso" style="margin-top:14px;">← Voltar à loja</button>
      </div>
    </div>
  `;
  document.getElementById('voltarLojaSucesso').addEventListener('click', renderVitrine);
}

/* ======================================================================
   ADMIN — Encomendas (CEO + Parceiro/Gerente) e Produtos (só CEO)
   ====================================================================== */
function tipoPedidoDeItens(itens){
  const tipos = new Set((itens || []).map(i => i.tipo));
  const temAtelie = tipos.has('servico_atelier');
  const temDigital = tipos.has('ebook') || tipos.has('combo');
  if(temAtelie && temDigital) return 'Misto';
  if(temAtelie) return 'Ateliê';
  return 'Digital';
}

async function renderEncomendasTab(container, isCeo){
  container.innerHTML = `<div class="loading-screen">A carregar encomendas…</div>`;
  try{
    const { data, error } = await sb.from('encomendas').select('*').order('criado_em', { ascending: false });
    if(error) throw error;

    container.textContent = '';
    if(!data || data.length === 0){
      const vazio = document.createElement('div');
      vazio.className = 'empty-state-small';
      vazio.textContent = 'Ainda não há encomendas.';
      container.appendChild(vazio);
      return;
    }
    data.forEach(en => container.appendChild(criarCartaoEncomenda(en, container)));
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar as encomendas: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

};

// Abre o WhatsApp do próprio cliente (não o do CEO) com as instruções de
// pagamento certas para o método que ele escolheu — usado quando o CEO
// aprova o pedido, para o cliente saber exatamente para onde pagar.
function abrirWhatsAppAprovacaoCliente(en){
  const numeroLimpo = (en.cliente_telefone || '').replace(/\D/g, '');
  const METODO_LABEL = { multicaixa_express: 'Multicaixa Express', transferencia: 'Transferência bancária', bybit: 'Bybit/Binance' };
  let instrucoes = '';
  if(en.metodo_pagamento === 'multicaixa_express') instrucoes = `Multicaixa Express: ${DADOS_PAGAMENTO.multicaixa_express.numero}`;
  else if(en.metodo_pagamento === 'transferencia') instrucoes = `IBAN: ${DADOS_PAGAMENTO.transferencia.iban}\nTitular: ${DADOS_PAGAMENTO.transferencia.titular}`;
  else if(en.metodo_pagamento === 'bybit') instrucoes = `Bybit/Binance (${DADOS_PAGAMENTO.bybit.rede}): ${DADOS_PAGAMENTO.bybit.uid}`;
  const mensagem = `Olá ${en.cliente_nome}! O seu pedido na Dionuel está aprovado \n\nPode agora efetuar o pagamento via ${METODO_LABEL[en.metodo_pagamento] || en.metodo_pagamento}:\n${instrucoes}\n\nValor: ${formatarPreco(en.valor_total, en.moeda)}\n\nDepois de pagar, envie-me aqui o comprovativo. Obrigado!`;
  window.open(`https://wa.me/${numeroLimpo}?text=${encodeURIComponent(mensagem)}`, '_blank');
}

function criarCartaoEncomenda(en, container){
  const [estadoTexto, estadoClasse] = ESTADO_ENCOMENDA_LABEL[en.estado] || [en.estado, 'estado-por_concluir'];

  const card = document.createElement('div');
  card.className = 'post-card';

  const head = document.createElement('div');
  head.className = 'post-head';
  const info = document.createElement('div');
  const titulo = document.createElement('div');
  titulo.className = 'post-autor';
  titulo.textContent = `${en.cliente_nome} · ${tipoPedidoDeItens(en.itens)}`;
  const dataEl = document.createElement('div');
  dataEl.className = 'post-data';
  dataEl.textContent = new Date(en.criado_em).toLocaleString('pt-PT');
  info.appendChild(titulo);
  info.appendChild(dataEl);
  head.appendChild(info);
  const badge = document.createElement('span');
  badge.className = 'estado-badge ' + estadoClasse;
  badge.textContent = estadoTexto;
  head.appendChild(badge);
  card.appendChild(head);

  const itensEl = document.createElement('div');
  itensEl.className = 'post-texto';
  itensEl.textContent = (en.itens || []).map(i => {
    const qtd = i.quantidade || 1;
    const total = i.subtotal ?? (i.preco_unitario * qtd);
    return `${qtd > 1 ? qtd + '× ' : ''}${i.nome} — ${formatarPreco(total, i.moeda)}`;
  }).join(' · ');
  card.appendChild(itensEl);

  const METODO_LABEL = { multicaixa_express: 'Multicaixa Express', transferencia: 'Transferência bancária', bybit: 'Bybit/Binance' };
  const contactoEl = document.createElement('div');
  contactoEl.className = 'medidas-resumo';
  contactoEl.textContent = `Total: ${formatarPreco(en.valor_total, en.moeda)} · ${METODO_LABEL[en.metodo_pagamento] || en.metodo_pagamento} · Tel: ${en.cliente_telefone}${en.cliente_email ? ' · ' + en.cliente_email : ''}`;
  card.appendChild(contactoEl);

  if(en.observacoes){
    const obsEl = document.createElement('div');
    obsEl.className = 'medidas-resumo';
    obsEl.textContent = 'Obs.: ' + en.observacoes;
    card.appendChild(obsEl);
  }

  const acoes = document.createElement('div');
  acoes.className = 'admin-img-row';
  acoes.style.marginTop = '12px';

  if(en.comprovativo_url){
    const verBtn = document.createElement('button');
    verBtn.className = 'icon-btn';
    verBtn.textContent = 'Ver comprovativo';
    verBtn.addEventListener('click', async () => {
      try{
        const { data: signed, error } = await sb.storage.from('dionuel-comprovativos').createSignedUrl(en.comprovativo_url, 600);
        if(error) throw error;
        window.open(signed.signedUrl, '_blank');
      }catch(e){ alert('Não foi possível abrir o comprovativo: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(verBtn);
  }

  // Passo 1 — pedido novo: o CEO tem de aprovar antes de o cliente pagar.
  if(en.estado === 'aguardando_aprovacao_ceo'){
    const aprovarBtn = document.createElement('button');
    aprovarBtn.className = 'icon-btn';
    aprovarBtn.textContent = '✓ Aprovar e enviar instruções (WhatsApp)';
    aprovarBtn.addEventListener('click', async () => {
      try{
        const { error } = await sb.from('encomendas').update({ estado: 'aprovado_aguardando_pagamento' }).eq('id', en.id);
        if(error) throw error;
        showToast('Pedido aprovado ✓');
        abrirWhatsAppAprovacaoCliente(en);
        await renderEncomendasTab(container, true);
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(aprovarBtn);

    const recusarBtn = document.createElement('button');
    recusarBtn.className = 'icon-btn danger';
    recusarBtn.textContent = 'Recusar';
    recusarBtn.addEventListener('click', async () => {
      if(!confirm('Recusar este pedido?')) return;
      try{
        const { error } = await sb.from('encomendas').update({ estado: 'cancelado' }).eq('id', en.id);
        if(error) throw error;
        await renderEncomendasTab(container, true);
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(recusarBtn);
  }

  // Passo 2 — já aprovado: o cliente foi instruído a pagar e a enviar o
  // comprovativo diretamente no WhatsApp; o CEO regista aqui o que recebeu.
  if(en.estado === 'aprovado_aguardando_pagamento' || en.estado === 'aguardando_confirmacao'){
    const reenviarBtn = document.createElement('button');
    reenviarBtn.className = 'icon-btn';
    reenviarBtn.textContent = 'Reenviar instruções (WhatsApp)';
    reenviarBtn.addEventListener('click', () => abrirWhatsAppAprovacaoCliente(en));
    acoes.appendChild(reenviarBtn);

    const anexarLabel = document.createElement('label');
    anexarLabel.className = 'icon-btn';
    anexarLabel.style.cursor = 'pointer';
    anexarLabel.textContent = 'Anexar comprovativo recebido';
    const anexarInput = document.createElement('input');
    anexarInput.type = 'file';
    anexarInput.accept = 'image/*';
    anexarInput.style.cssText = 'width:0.1px; height:0.1px; opacity:0; position:fixed; left:-9999px;';
    anexarInput.addEventListener('change', async () => {
      const file = anexarInput.files && anexarInput.files[0];
      if(!file) return;
      const v = validateFile(file);
      if(!v.ok || v.tipo !== 'imagem'){ alert(v.ok ? 'Escolha uma imagem.' : v.mensagem); return; }
      try{
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `comprovativos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('dionuel-comprovativos').upload(path, file, { cacheControl: '3600', upsert: false });
        if(upErr) throw upErr;
        const { error } = await sb.from('encomendas').update({ comprovativo_url: path }).eq('id', en.id);
        if(error) throw error;
        showToast('Comprovativo anexado ✓');
        await renderEncomendasTab(container, true);
      }catch(e){ alert('Não foi possível anexar: ' + (e.message || 'erro desconhecido')); }
    });
    anexarLabel.appendChild(anexarInput);
    acoes.appendChild(anexarLabel);

    const confirmarBtn = document.createElement('button');
    confirmarBtn.className = 'icon-btn';
    confirmarBtn.textContent = 'Confirmar pagamento recebido';
    confirmarBtn.addEventListener('click', async () => {
      try{
        const { error } = await sb.from('encomendas').update({ estado:'confirmado', confirmado_por: currentAuthUser.id, confirmado_em: new Date().toISOString() }).eq('id', en.id);
        if(error) throw error;
        showToast('Pagamento confirmado ✓');
        await renderEncomendasTab(container, true);
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(confirmarBtn);

    const cancelarBtn = document.createElement('button');
    cancelarBtn.className = 'icon-btn danger';
    cancelarBtn.textContent = 'Cancelar';
    cancelarBtn.addEventListener('click', async () => {
      if(!confirm('Cancelar esta encomenda?')) return;
      try{
        const { error } = await sb.from('encomendas').update({ estado:'cancelado' }).eq('id', en.id);
        if(error) throw error;
        await renderEncomendasTab(container, true);
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(cancelarBtn);
  }

  if(en.estado === 'confirmado'){
    (en.itens || []).filter(i => i.tipo === 'ebook' || i.tipo === 'combo').forEach(item => {
      const linkBtn = document.createElement('button');
      linkBtn.className = 'icon-btn';
      linkBtn.textContent = `Gerar link — ${item.nome}`;
      linkBtn.addEventListener('click', () => gerarLinkEbook(item.produto_id, item.nome));
      acoes.appendChild(linkBtn);
    });

    const copiarBtn = document.createElement('button');
    copiarBtn.className = 'icon-btn';
    copiarBtn.textContent = 'Copiar dados do cliente';
    copiarBtn.addEventListener('click', () => {
      const texto = `Nome: ${en.cliente_nome}\nTelefone: ${en.cliente_telefone}\nServiço: ${(en.itens || []).map(i => i.nome).join(', ')}`;
      if(navigator.clipboard){ navigator.clipboard.writeText(texto).then(() => showToast('Dados copiados ✓')).catch(() => alert(texto)); }
      else { alert(texto); }
    });
    acoes.appendChild(copiarBtn);

    const avaliacaoBtn = document.createElement('button');
    avaliacaoBtn.className = 'icon-btn';
    avaliacaoBtn.textContent = 'Pedir avaliação no Google (WhatsApp)';
    avaliacaoBtn.addEventListener('click', () => abrirWhatsAppPedirAvaliacao(en));
    acoes.appendChild(avaliacaoBtn);
  }

  card.appendChild(acoes);
  return card;
}

// Abre o WhatsApp do cliente (já depois do serviço confirmado) com uma
// mensagem de agradecimento e o link da ficha da Dionuel no Google Maps,
// a pedir uma avaliação — ajuda a consolidar a imagem da marca online.
function abrirWhatsAppPedirAvaliacao(en){
  const numeroLimpo = (en.cliente_telefone || '').replace(/\D/g, '');
  const mensagem = `A empresa Dionuel - Alfaiataria e Atelier de costura gostaria de obter o seu feedback. Publique uma opinião no nosso perfil.\n${GOOGLE_MAPS_LINK}`;
  window.open(`https://wa.me/${numeroLimpo}?text=${encodeURIComponent(mensagem)}`, '_blank');
}

async function gerarLinkEbook(produtoId, nomeProduto){
  try{
    const { data: produto, error: prodErr } = await sb.from('produtos').select('ficheiro_url').eq('id', produtoId).maybeSingle();
    if(prodErr) throw prodErr;
    if(!produto || !produto.ficheiro_url){
      alert(`O ficheiro de "${nomeProduto}" ainda não foi associado no separador Produtos.`);
      return;
    }
    const { data: signed, error } = await sb.storage.from('dionuel-ebooks').createSignedUrl(produto.ficheiro_url, 172800); // válido 48h
    if(error) throw error;
    prompt('Link de download (válido 48h) — copie e envie ao cliente:', signed.signedUrl);
  }catch(e){
    alert('Não foi possível gerar o link: ' + (e.message || 'erro desconhecido'));
  }
}

          <div class="field"><label>Sinal — % pago no checkout (só serviços do ateliê)</label><input id="np_sinal" type="number" min="1" max="100" placeholder="Ex.: 30"></div>
          <div class="field">
            <label>Preços por quantidade (opcional — peças prontas e serviços do ateliê, ex.: fardamento de empresas)</label>

              <input id="np_preco_5" type="number" step="0.01" min="0" placeholder="Preço/un a partir de 5" style="flex:1; min-width:110px;">
              <input id="np_preco_10" type="number" step="0.01" min="0" placeholder="Preço/un a partir de 10" style="flex:1; min-width:110px;">
            </div>

          </div>

            <input type="checkbox" id="np_a_partir_de" style="width:auto;"> Preço variável — mostrar como "A partir de" (ex.: ajustes, onde o preço final só se sabe ao ver a peça)
          </label>
          <div class="field"><label>Promoção termina em (opcional — mostra contagem regressiva na loja)</label><input id="np_promocao_fim" type="datetime-local"></div>
          <div class="field"><label>Género (para peças do ateliê ou da loja)</label>
            <select id="np_genero">
              <option value="unissex">Unissexo</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
            </select>
          </div>

          <div class="field">
            <label>Foto de capa (opcional, máx. 5MB)</label><br>
            <label for="np_imagem_file" class="icon-btn" style="display:inline-block; cursor:pointer;">Escolher foto</label>
            <span id="np_imagem_nome" style="font-size:11.5px; color:var(--linho-dim); margin-left:8px;"></span>
          </div>
          <input type="file" id="np_imagem_file" accept="image/*" style="width:0.1px; height:0.1px; opacity:0; overflow:hidden; position:fixed; left:-9999px;">

          <div class="field">

            <span id="np_video_nome" style="font-size:11.5px; color:var(--linho-dim); margin-left:8px;"></span>
          </div>
          <input type="file" id="np_video_file" accept="video/*" style="width:0.1px; height:0.1px; opacity:0; overflow:hidden; position:fixed; left:-9999px;">

          <div class="upload-progress" id="np_progress"><div class="upload-progress-fill" id="np_progress_fill"></div></div>
          <div class="field">
            <label>Ficheiro do e-book em PDF (só e-book/combo, máx. 20MB)</label><br>
            <label for="np_ficheiro_file" class="icon-btn" style="display:inline-block; cursor:pointer;">Escolher PDF</label>
            <span id="np_ficheiro_nome" style="font-size:11.5px; color:var(--linho-dim); margin-left:8px;"></span>
          </div>
          <input type="file" id="np_ficheiro_file" accept="application/pdf" style="width:0.1px; height:0.1px; opacity:0; overflow:hidden; position:fixed; left:-9999px;">
          <div class="error-banner" id="np_error" style="display:none;"></div>
          <button class="btn-submit" id="np_submit">Adicionar ao catálogo</button>
        </div>
      </details>
