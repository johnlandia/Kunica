      <h3 style="margin:28px 0 12px;">Avaliações por aprovar</h3>
      <div id="avaliacoesPendentes"></div>
    `;

    let npImagemFicheiro = null;
    let npVideoFicheiro = null;
    let npPdfFicheiro = null;

    document.getElementById('np_imagem_file').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const v = validateFile(file);
      const errBox = document.getElementById('np_error');
      if(!v.ok || v.tipo !== 'imagem'){
        errBox.textContent = v.ok ? 'Escolha uma imagem.' : v.mensagem;
        errBox.style.display = 'block';
        e.target.value = '';
        return;
      }
      npImagemFicheiro = file;
      document.getElementById('np_imagem_nome').textContent = file.name;
      errBox.style.display = 'none';
    });

    document.getElementById('np_video_file').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const v = validateFile(file);
      const errBox = document.getElementById('np_error');
      if(!v.ok || v.tipo !== 'video'){
        errBox.textContent = v.ok ? 'Escolha um vídeo.' : v.mensagem;
        errBox.style.display = 'block';
        e.target.value = '';
        return;
      }
      npVideoFicheiro = file;
      document.getElementById('np_video_nome').textContent = file.name;
      errBox.style.display = 'none';
    });

    // O PDF não passa por validateFile (essa função só trata imagem/vídeo
    // do feed e do checkout) — valida-se aqui, isolado, para não alterar
    // o comportamento de validateFile nos outros sítios que já a usam.
    document.getElementById('np_ficheiro_file').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const errBox = document.getElementById('np_error');
      if(file.type !== 'application/pdf'){
        errBox.textContent = 'Escolha um ficheiro PDF.';
        errBox.style.display = 'block';
        e.target.value = '';
        return;
      }
      const LIMITE_PDF = 20 * 1024 * 1024;
      if(file.size > LIMITE_PDF){
        errBox.textContent = `Este PDF tem ${(file.size/1024/1024).toFixed(1)}MB — o máximo é 20MB.`;
        errBox.style.display = 'block';
        e.target.value = '';
        return;
      }
      npPdfFicheiro = file;
      document.getElementById('np_ficheiro_nome').textContent = file.name;
      errBox.style.display = 'none';
    });


    document.getElementById('np_submit').addEventListener('click', async () => {
      const btn = document.getElementById('np_submit');
      const errBox = document.getElementById('np_error');
      const progressWrap = document.getElementById('np_progress');
      const progressFill = document.getElementById('np_progress_fill');
      errBox.style.display = 'none';

      const nome = document.getElementById('np_nome').value.trim();
      const preco = Number(document.getElementById('np_preco').value);
      if(!nome || !preco){
        errBox.textContent = 'Preencha pelo menos o nome e o preço.';
        errBox.style.display = 'block';
        return;
      }

      btn.textContent = 'A guardar…';
      btn.disabled = true;
      let progressTimer = null;
      try{
        let imagemUrl = null;
        let videoUrl = null;
        let ficheiroCaminho = null;

        if(npImagemFicheiro || npVideoFicheiro || npPdfFicheiro){
          progressWrap.style.display = 'block';
          let simulado = 0;
          progressTimer = setInterval(() => {
            simulado = Math.min(simulado + Math.random()*15, 90);
            progressFill.style.width = simulado + '%';
          }, 220);
        }

        if(npImagemFicheiro){
          const ext = (npImagemFicheiro.name.split('.').pop() || 'jpg').toLowerCase();
          const path = `capas/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error: upErr } = await sb.storage.from('dionuel-vitrine').upload(path, npImagemFicheiro, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
          imagemUrl = sb.storage.from('dionuel-vitrine').getPublicUrl(path).data.publicUrl;
        }
        if(npVideoFicheiro){
          const ext = (npVideoFicheiro.name.split('.').pop() || 'mp4').toLowerCase();
          const path = `videos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error: upErr } = await sb.storage.from('dionuel-vitrine').upload(path, npVideoFicheiro, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
          videoUrl = sb.storage.from('dionuel-vitrine').getPublicUrl(path).data.publicUrl;
        }
        if(npPdfFicheiro){
          // Vai para o bucket PRIVADO — só é acessível via link assinado,
          // gerado pela equipa depois de confirmar o pagamento.
          const path = `ebooks/${Date.now()}_${Math.random().toString(36).slice(2,8)}.pdf`;
          const { error: upErr } = await sb.storage.from('dionuel-ebooks').upload(path, npPdfFicheiro, { cacheControl: '3600', upsert: false });
          if(upErr) throw upErr;
          ficheiroCaminho = path;
        }

        if(progressTimer){ clearInterval(progressTimer); progressFill.style.width = '100%'; }

        const precoPromoInput = document.getElementById('np_preco_promo').value;
        const promocaoFimInput = document.getElementById('np_promocao_fim').value;
        const preco3Input = document.getElementById('np_preco_3').value;
        const preco5Input = document.getElementById('np_preco_5').value;
        const preco10Input = document.getElementById('np_preco_10').value;
        const novoProduto = {
          tipo: document.getElementById('np_tipo').value,
          nome,
          descricao: document.getElementById('np_desc').value.trim() || null,
          preco,
          preco_promocional: precoPromoInput ? Number(precoPromoInput) : null,
          moeda: document.getElementById('np_moeda').value,
          percentual_sinal: Number(document.getElementById('np_sinal').value) || null,
          preco_a_partir_de: document.getElementById('np_a_partir_de').checked,
          promocao_fim: promocaoFimInput ? new Date(promocaoFimInput).toISOString() : null,
          preco_3un: preco3Input ? Number(preco3Input) : null,
          preco_5un: preco5Input ? Number(preco5Input) : null,
          preco_10un: preco10Input ? Number(preco10Input) : null,
          imagem_url: imagemUrl,
          video_url: videoUrl,
          ficheiro_url: ficheiroCaminho,
          genero: document.getElementById('np_genero').value,
          ativo: true
        };
        let { error } = await sb.from('produtos').insert(novoProduto);
        if(error && error.code === '42703'){
          // Uma das colunas novas (preços por quantidade, "preco_a_partir_de"
          // ou "promocao_fim") ainda não existe nesta base de dados (falta
          // correr o SQL enviado) — guarda o produto na mesma, sem essas
          // marcações, em vez de bloquear a publicação inteira por causa delas.
          delete novoProduto.preco_a_partir_de;
          delete novoProduto.promocao_fim;
          delete novoProduto.preco_3un;
          delete novoProduto.preco_5un;
          delete novoProduto.preco_10un;
          const retry = await sb.from('produtos').insert(novoProduto);
          error = retry.error;
        }
        if(error) throw error;
        showToast('Produto adicionado ✓');
        await renderProdutosTab(container);
      }catch(e){
        if(progressTimer) clearInterval(progressTimer);
        progressWrap.style.display = 'none';
        errBox.textContent = mensagemErroPublicacao(e, 'dionuel-vitrine');
        errBox.style.display = 'block';
        btn.textContent = 'Adicionar ao catálogo';
        btn.disabled = false;
      }
    });

    const lista = document.getElementById('produtosLista');
    if(!data || data.length === 0){
      lista.innerHTML = '<div class="empty-state-small">Ainda não há produtos no catálogo.</div>';
    } else {
      lista.textContent = '';
      data.forEach(p => lista.appendChild(criarLinhaProdutoAdmin(p, container)));
    }

    await carregarAvaliacoesPendentes(container, data || []);
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar o catálogo: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

async function carregarAvaliacoesPendentes(container, produtos){
  const area = document.getElementById('avaliacoesPendentes');
  try{
    const { data, error } = await sb.from('avaliacoes').select('*').eq('aprovado', false).order('criado_em', { ascending: false });
    if(error) throw error;

    area.textContent = '';
    if(!data || data.length === 0){
      area.innerHTML = '<div class="empty-state-small">Sem avaliações pendentes.</div>';
      return;
    }
    const nomePorProduto = {};
    produtos.forEach(p => { nomePorProduto[p.id] = p.nome; });

    data.forEach(a => {
      const card = document.createElement('div');
      card.className = 'post-card';
      const head = document.createElement('div');
      head.className = 'post-head';
      const info = document.createElement('div');
      const titulo = document.createElement('div');
      titulo.className = 'post-autor';
      titulo.textContent = `${a.cliente_nome} · ${'★'.repeat(a.nota)}${'☆'.repeat(5-a.nota)}`;
      const sub = document.createElement('div');
      sub.className = 'post-data';
      sub.textContent = nomePorProduto[a.produto_id] || 'Produto removido';
      info.appendChild(titulo);
      info.appendChild(sub);
      head.appendChild(info);
      card.appendChild(head);

      if(a.comentario){
        const com = document.createElement('div');
        com.className = 'post-texto';
        com.textContent = a.comentario;
        card.appendChild(com);
      }

      const acoes = document.createElement('div');
      acoes.className = 'admin-img-row';
      acoes.style.marginTop = '10px';

      const aprovarBtn = document.createElement('button');
      aprovarBtn.className = 'icon-btn';
      aprovarBtn.textContent = '✓ Aprovar e publicar';
      aprovarBtn.addEventListener('click', async () => {
        try{
          const { error } = await sb.from('avaliacoes').update({ aprovado: true }).eq('id', a.id);
          if(error) throw error;
          showToast('Avaliação publicada ✓');
          await renderProdutosTab(container);
        }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
      });
      acoes.appendChild(aprovarBtn);

      const rejeitarBtn = document.createElement('button');
      rejeitarBtn.className = 'icon-btn danger';
      rejeitarBtn.textContent = 'Rejeitar';
      rejeitarBtn.addEventListener('click', async () => {
        if(!confirm('Rejeitar e apagar esta avaliação?')) return;
        try{
          const { error } = await sb.from('avaliacoes').delete().eq('id', a.id);
          if(error) throw error;
          await renderProdutosTab(container);
        }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
      });
      acoes.appendChild(rejeitarBtn);

      card.appendChild(acoes);
      area.appendChild(card);
    });
  }catch(e){
    area.innerHTML = `<div class="error-banner">Não foi possível carregar as avaliações: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

// Converte um timestamp ISO (vindo do Supabase) para o formato que o
// input datetime-local entende, na hora local do navegador — para o
// prazo da promoção aparecer pré-preenchido ao editar.
function isoParaDatetimeLocal(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function criarLinhaProdutoAdmin(p, container){
  const card = document.createElement('div');
  card.className = 'post-card';

  const head = document.createElement('div');
  head.className = 'post-head';
  const info = document.createElement('div');
  const nome = document.createElement('div');
  nome.className = 'post-autor';
  nome.textContent = p.nome + (p.ativo ? '' : ' (oculto da vitrine)');
  const meta = document.createElement('div');
  meta.className = 'post-data';
  const promoInfo = promocaoAtiva(p)
    ? (p.promocao_fim ? ` · promoção até ${new Date(p.promocao_fim).toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}` : ' · promoção sem prazo')
    : '';
  meta.textContent = `${p.tipo} · ${p.preco_a_partir_de ? 'a partir de ' : ''}${formatarPreco(p.preco, p.moeda)}` + (p.percentual_sinal ? ` · sinal ${p.percentual_sinal}%` : '') + promoInfo;
  info.appendChild(nome);
  info.appendChild(meta);
  head.appendChild(info);
  card.appendChild(head);

  const acoes = document.createElement('div');
  acoes.className = 'admin-img-row';
  acoes.style.marginTop = '10px';

  if(p.tipo === 'servico_atelier' || p.tipo === 'pronto'){
    const generoSel = document.createElement('select');
    generoSel.style.cssText = 'font-size:11.5px; padding:4px 6px;';
    generoSel.innerHTML = `
      <option value="unissex" ${(!p.genero || p.genero==='unissex')?'selected':''}>Unissexo</option>
      <option value="masculino" ${p.genero==='masculino'?'selected':''}>Masculino</option>
      <option value="feminino" ${p.genero==='feminino'?'selected':''}>Feminino</option>
    `;
    generoSel.addEventListener('change', async () => {
      try{
        const { error } = await sb.from('produtos').update({ genero: generoSel.value }).eq('id', p.id);
        if(error) throw error;
        showToast('Género atualizado ✓');
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(generoSel);
  }

  if(p.preco_promocional){
    const promoInput = document.createElement('input');
    promoInput.type = 'datetime-local';
    promoInput.title = 'Promoção termina em';
    promoInput.style.cssText = 'font-size:11.5px; padding:4px 6px;';
    promoInput.value = isoParaDatetimeLocal(p.promocao_fim);
    const promoSalvarBtn = document.createElement('button');
    promoSalvarBtn.className = 'icon-btn';
    promoSalvarBtn.textContent = 'Guardar prazo da promoção';
    promoSalvarBtn.addEventListener('click', async () => {
      try{
        const novoFim = promoInput.value ? new Date(promoInput.value).toISOString() : null;
        const { error } = await sb.from('produtos').update({ promocao_fim: novoFim }).eq('id', p.id);
        if(error) throw error;
        showToast('Prazo da promoção atualizado ✓');
        await renderProdutosTab(container);
      }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
    });
    acoes.appendChild(promoInput);
    acoes.appendChild(promoSalvarBtn);
  }

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'icon-btn';
  toggleBtn.textContent = p.ativo ? 'Ocultar da vitrine' : 'Mostrar na vitrine';
  toggleBtn.addEventListener('click', async () => {
    try{
      const { error } = await sb.from('produtos').update({ ativo: !p.ativo }).eq('id', p.id);
      if(error) throw error;
      await renderProdutosTab(container);
    }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
  });
  acoes.appendChild(toggleBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn danger';
  delBtn.textContent = 'Remover';
  delBtn.addEventListener('click', async () => {
    if(!confirm(`Remover "${p.nome}" do catálogo?`)) return;
    try{
      const { error } = await sb.from('produtos').delete().eq('id', p.id);
      if(error) throw error;
      await renderProdutosTab(container);
    }catch(e){ alert('Erro: ' + (e.message || 'erro desconhecido')); }
  });
  acoes.appendChild(delBtn);

  card.appendChild(acoes);
  return card;
}

/* ======================================================================
   RELATÓRIOS — CEO e Gerente Administrativo. Cruza obras, despesas,
   metas e encomendas da vitrine num único resumo, filtrável por período.
   ====================================================================== */
let relatorioFiltro = { periodo: 'mensal', numero: new Date().getMonth() + 1, ano: new Date().getFullYear() };

function calcularIntervaloPeriodo(periodo, numero, ano){
  let mesInicio, mesFimExclusivo;
  if(periodo === 'mensal'){ mesInicio = numero - 1; mesFimExclusivo = numero; }
  else if(periodo === 'trimestral'){ mesInicio = (numero-1)*3; mesFimExclusivo = mesInicio + 3; }
  else if(periodo === 'semestral'){ mesInicio = (numero-1)*6; mesFimExclusivo = mesInicio + 6; }
  else { mesInicio = 0; mesFimExclusivo = 12; } // anual
  return { inicio: new Date(ano, mesInicio, 1), fim: new Date(ano, mesFimExclusivo, 1) };
}

async function renderRelatoriosTab(container){
  container.innerHTML = `<div class="loading-screen">A carregar relatório…</div>`;
  const ehGerente = currentUsuario.papel === 'gerente_administrativo';
  const ehCeo = currentUsuario.papel === 'ceo';
  try{
    const { inicio, fim } = calcularIntervaloPeriodo(relatorioFiltro.periodo, relatorioFiltro.numero, relatorioFiltro.ano);
    const inicioISO = inicio.toISOString();
    const fimISO = fim.toISOString();

    const [{ data: obras, error: e1 }, { data: despesas, error: e2 }, { data: metas, error: e3 }, { data: encomendas, error: e4 }, { data: equipa, error: e5 }] = await Promise.all([
      sb.from('obras').select('*').gte('criado_em', inicioISO).lt('criado_em', fimISO),
      sb.from('despesas').select('*').gte('criado_em', inicioISO).lt('criado_em', fimISO),
      sb.from('metas').select('*, usuarios:funcionario_user_id(nome, email)').eq('periodo', relatorioFiltro.periodo).eq('numero_periodo', relatorioFiltro.numero).eq('ano', relatorioFiltro.ano),
      sb.from('encomendas').select('*').gte('criado_em', inicioISO).lt('criado_em', fimISO),
      sb.from('usuarios').select('id, nome, email').in('papel', ['funcionario','gerente_administrativo','ceo'])
    ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4; if(e5) throw e5;

    // Se for gerente, verifica se já enviou o relatório deste período exato
    // — enquanto existir, mostra sempre a versão congelada, nunca a live.
    let meuEnvio = null;
    if(ehGerente){
      const { data, error } = await sb.from('relatorios_enviados').select('*')
        .eq('enviado_por', currentAuthUser.id)
        .eq('periodo', relatorioFiltro.periodo).eq('numero_periodo', relatorioFiltro.numero).eq('ano', relatorioFiltro.ano)
        .maybeSingle();
      if(error) throw error;
      meuEnvio = data;
    }

    // Para o CEO, mostra o histórico de tudo o que a equipa já enviou
    let historicoEnvios = null;
    if(ehCeo){
      const { data, error } = await sb.from('relatorios_enviados')
        .select('*, usuarios:enviado_por(nome, email)')
        .order('criado_em', { ascending: false }).limit(30);
      if(error) throw error;
      historicoEnvios = data;
    }

    const nomePorId = {};
    (equipa || []).forEach(u => { nomePorId[u.id] = u.nome || u.email; });

    const receita = (obras || []).reduce((s,o) => s + Number(o.valor_pago || 0), 0);
    const totalDespesas = (despesas || []).reduce((s,d) => s + Number(d.valor || 0), 0);
    const lucro = receita - totalDespesas;
    const nObras = (obras || []).length;
    const nConcluidas = (obras || []).filter(o => o.estado === 'concluido').length;

    const porPessoa = {};
    (obras || []).forEach(o => {
      const id = o.registado_por;
      if(!id) return;
      if(!porPessoa[id]) porPessoa[id] = { obras: 0, receita: 0 };
      porPessoa[id].obras++;
      porPessoa[id].receita += Number(o.valor_pago || 0);
    });
    const rankingArr = Object.entries(porPessoa)
      .map(([id, v]) => ({ nome: nomePorId[id] || 'Desconhecido', ...v }))
      .sort((a,b) => b.receita - a.receita);

    const encConfirmadas = (encomendas || []).filter(e => e.estado === 'confirmado');
    const encPendentes = (encomendas || []).filter(e => e.estado === 'aguardando_aprovacao_ceo' || e.estado === 'aprovado_aguardando_pagamento' || e.estado === 'aguardando_confirmacao');
    const vendidoEUR = encConfirmadas.filter(e => e.moeda === 'EUR').reduce((s,e) => s + Number(e.valor_total || 0), 0);
    const vendidoAOA = encConfirmadas.filter(e => e.moeda === 'AOA').reduce((s,e) => s + Number(e.valor_total || 0), 0);
    let vendidoTexto = '—';
    if(vendidoAOA > 0 || vendidoEUR > 0){
      vendidoTexto = [vendidoAOA > 0 ? formatAOA(vendidoAOA) : null, vendidoEUR > 0 ? formatEUR(vendidoEUR) : null].filter(Boolean).join(' + ');
    }

    // Empacota tudo num único objeto — é esta mesma "forma" que fica
    // congelada em relatorios_enviados.dados quando um gerente envia.
    const dadosCalculados = {
      receita, totalDespesas, lucro, nObras, nConcluidas, vendidoTexto,
      ranking: rankingArr,
      metas: (metas || []).map(m => ({
        nome: m.usuarios ? (m.usuarios.nome || m.usuarios.email) : 'Membro removido',
        meta_obras: m.meta_obras, meta_valor: m.meta_valor,
        realizado_obras: (porPessoa[m.funcionario_user_id] || {}).obras || 0,
        realizado_receita: (porPessoa[m.funcionario_user_id] || {}).receita || 0
      }))
    };

    let html = '';

    if(ehGerente){
      html += `
        <div class="regras-relatorio">
          <strong>⚠ Antes de confirmar ou enviar este relatório</strong>
          <ul>
            <li>Leia e releia os números com atenção — obras, despesas, metas e vendas.</li>
            <li>Depois de enviado, o relatório fica bloqueado: não pode ser editado nem apagado por ninguém, nem pelo CEO.</li>
            <li>Você responde pelos dados enviados.</li>
          </ul>
        </div>
      `;
    }

    html += `
      <div class="form-card">
        <h3>Período do relatório</h3>
        <div class="form-row2">
          <div class="field"><label>Tipo</label>
            <select id="rp_periodo">
              <option value="mensal" ${relatorioFiltro.periodo==='mensal'?'selected':''}>Mensal</option>
              <option value="trimestral" ${relatorioFiltro.periodo==='trimestral'?'selected':''}>Trimestral</option>
              <option value="semestral" ${relatorioFiltro.periodo==='semestral'?'selected':''}>Semestral</option>
              <option value="anual" ${relatorioFiltro.periodo==='anual'?'selected':''}>Anual</option>
            </select>
          </div>
          <div class="field" id="rp_numero_wrap" style="${relatorioFiltro.periodo==='anual'?'display:none;':''}">
            <label>Número do período (mês 1-12, trimestre 1-4, semestre 1-2)</label>
            <input id="rp_numero" type="number" min="1" max="12" value="${relatorioFiltro.numero}">
          </div>
        </div>
        <div class="field"><label>Ano</label><input id="rp_ano" type="number" value="${relatorioFiltro.ano}"></div>
        <button class="btn-submit" id="rp_aplicar">Aplicar</button>
      </div>
    `;

    if(ehGerente && meuEnvio){
      html += `
        <div class="totals-bar">Relatório enviado em ${new Date(meuEnvio.criado_em).toLocaleString('pt-PT')} — estes números são o registo congelado no momento do envio e já não podem ser alterados.</div>
        ${renderBlocoRelatorioHTML(meuEnvio.dados)}
        ${meuEnvio.observacoes ? `<div class="instrucoes-pagamento" style="margin-top:14px;"><strong>Observações enviadas:</strong><br>${esc(meuEnvio.observacoes)}</div>` : ''}
      `;
    } else {
      html += renderBlocoRelatorioHTML(dadosCalculados);
      if(encPendentes.length > 0){
        html += `<p style="font-size:12.5px; color:var(--linho-dim); margin:-8px 0 20px;">⚠ ${encPendentes.length} encomenda${encPendentes.length===1?'':'s'} da vitrine ainda aguarda${encPendentes.length===1?'':'m'} confirmação de pagamento.</p>`;
      }
      if(ehGerente){
        html += `
          <div class="form-card" style="margin-top:8px;">
            <h3>Confirmar e enviar</h3>
            <div class="field"><label>Observações (opcional)</label><textarea id="rp_obs" rows="2" placeholder="Algo a assinalar sobre este período?"></textarea></div>
            <label style="display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--linho-dim); margin:12px 0; cursor:pointer;">
              <input type="checkbox" id="rp_confirmo" style="margin-top:2px;">
              Li e confirmo que revi os dados acima e que estão corretos. Sei que depois de enviado este relatório não pode ser alterado.
            </label>
            <div class="error-banner" id="rp_send_error" style="display:none;"></div>
            <button class="btn-submit" id="rp_enviar" disabled>Confirmar e enviar relatório</button>
          </div>
        `;
      }
    }

    if(ehCeo){
      html += `
        <h3 style="margin:28px 0 12px;">Relatórios enviados pela equipa</h3>
        <div>${renderHistoricoEnviosHTML(historicoEnvios)}</div>
      `;
    }

    container.innerHTML = html;

    document.getElementById('rp_periodo').addEventListener('change', (e) => {
      const wrap = document.getElementById('rp_numero_wrap');
      if(wrap) wrap.style.display = e.target.value === 'anual' ? 'none' : '';
    });
    document.getElementById('rp_aplicar').addEventListener('click', () => {
      relatorioFiltro = {
        periodo: document.getElementById('rp_periodo').value,
        numero: Number(document.getElementById('rp_numero') ? document.getElementById('rp_numero').value : 1) || 1,
        ano: Number(document.getElementById('rp_ano').value) || new Date().getFullYear()
      };
      renderRelatoriosTab(container);
    });

    const chk = document.getElementById('rp_confirmo');
    const btnEnviar = document.getElementById('rp_enviar');
    if(chk && btnEnviar){
      chk.addEventListener('change', () => { btnEnviar.disabled = !chk.checked; });
      btnEnviar.addEventListener('click', async () => {
        const errBox = document.getElementById('rp_send_error');
        errBox.style.display = 'none';
        if(!confirm('Depois de enviado, este relatório fica bloqueado e não pode ser alterado nem apagado — nem pelo CEO. Confirma o envio?')) return;

        btnEnviar.textContent = 'A enviar…';
        btnEnviar.disabled = true;
        try{
          const { error } = await sb.from('relatorios_enviados').insert({
            enviado_por: currentAuthUser.id,
            periodo: relatorioFiltro.periodo,
            numero_periodo: relatorioFiltro.numero,
            ano: relatorioFiltro.ano,
            dados: dadosCalculados,
            observacoes: document.getElementById('rp_obs').value.trim() || null
          });
          if(error) throw error;
          showToast('Relatório enviado ✓');
          await renderRelatoriosTab(container);
        }catch(e){
          errBox.textContent = 'Não foi possível enviar: ' + (e.message || 'erro desconhecido');
          errBox.style.display = 'block';
          btnEnviar.textContent = 'Confirmar e enviar relatório';
          btnEnviar.disabled = true;
        }
      });
    }
  }catch(e){
    container.innerHTML = `<div class="error-banner">Não foi possível carregar o relatório: ${esc(e.message || 'erro desconhecido')}</div>`;
  }
}

// Constrói os KPIs + ranking + metas a partir de um único objeto de dados —
// usado tanto para a vista ao vivo como para um relatório já congelado
// (a "forma" dos dados é sempre a mesma).
function renderBlocoRelatorioHTML(dados){
  const rankingHTML = (dados.ranking && dados.ranking.length > 0)
    ? dados.ranking.map((r,i) => `
        <div class="obra-card">
          <div class="obra-top">
            <div class="obra-cliente">${i+1}º · ${esc(r.nome)}</div>
            <span class="mono">${formatAOA(r.receita)}</span>
          </div>
          <div class="obra-tipo">${r.obras} obra${r.obras===1?'':'s'} registada${r.obras===1?'':'s'}</div>
        </div>
      `).join('')
    : '<div class="empty-state-small">Sem obras registadas neste período.</div>';

  const metasHTML = (dados.metas && dados.metas.length > 0)
    ? dados.metas.map(m => {
        const pctObras = m.meta_obras > 0 ? Math.min(100, Math.round(m.realizado_obras / m.meta_obras * 100)) : 0;
        const pctValor = m.meta_valor > 0 ? Math.min(100, Math.round(m.realizado_receita / m.meta_valor * 100)) : 0;
        return `
          <div class="obra-card">
            <div class="obra-top"><div class="obra-cliente">${esc(m.nome)}</div></div>
            <div class="obra-tipo">Obras: ${m.realizado_obras}/${m.meta_obras} (${pctObras}%) · Valor: ${formatAOA(m.realizado_receita)} / ${formatAOA(m.meta_valor)} (${pctValor}%)</div>
          </div>
        `;
      }).join('')
    : '<div class="empty-state-small">Sem metas definidas exatamente para este período.</div>';

  return `
    <div class="relatorio-kpis">
      <div class="kpi-card"><span class="kpi-label">Receita recebida</span><span class="kpi-valor">${formatAOA(dados.receita)}</span></div>
      <div class="kpi-card"><span class="kpi-label">Despesas</span><span class="kpi-valor" style="color:var(--giz-light);">${formatAOA(dados.totalDespesas)}</span></div>
      <div class="kpi-card"><span class="kpi-label">Lucro do período</span><span class="kpi-valor" style="color:${dados.lucro>=0?'var(--verde-light)':'var(--giz-light)'};">${formatAOA(dados.lucro)}</span></div>
      <div class="kpi-card"><span class="kpi-label">Obras registadas</span><span class="kpi-valor">${dados.nObras}</span></div>
      <div class="kpi-card"><span class="kpi-label">Obras concluídas</span><span class="kpi-valor">${dados.nConcluidas}${dados.nObras>0 ? ' ('+Math.round(dados.nConcluidas/dados.nObras*100)+'%)' : ''}</span></div>
      <div class="kpi-card"><span class="kpi-label">Vendas na vitrine (confirmadas)</span><span class="kpi-valor">${esc(dados.vendidoTexto)}</span></div>
    </div>
    <h3 style="margin-bottom:12px;">Desempenho da equipa</h3>
    <div>${rankingHTML}</div>
    <h3 style="margin:24px 0 12px;">Metas deste período</h3>
    <div>${metasHTML}</div>
  `;
}

function renderHistoricoEnviosHTML(lista){
  if(!lista || lista.length === 0) return '<div class="empty-state-small">Ainda não há relatórios enviados pela equipa.</div>';
  return lista.map(r => `
    <div class="obra-card">
      <div class="obra-top">
        <div class="obra-cliente">${r.usuarios ? esc(r.usuarios.nome || r.usuarios.email) : 'Membro removido'}</div>
        <span class="mono" style="font-size:11px; color:var(--linho-dim);">${new Date(r.criado_em).toLocaleString('pt-PT')}</span>
      </div>
      <div class="obra-tipo">${PERIODO_LABEL[r.periodo]} ${r.numero_periodo} · ${r.ano}</div>
      <div class="obra-valores">Receita: ${formatAOA(r.dados.receita)} · Despesas: ${formatAOA(r.dados.totalDespesas)} · Lucro: ${formatAOA(r.dados.lucro)}</div>
      ${r.observacoes ? `<div class="medidas-resumo">Obs.: ${esc(r.observacoes)}</div>` : ''}
    </div>
  `).join('');
}

// Fecha qualquer menu suspenso aberto ao clicar fora — um único
// listener global, em vez de repetir isto em cada sítio que usa menus.
document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown-menu.aberto').forEach(m => m.classList.remove('aberto'));
});

init();
</script>

<script src="./assets/store-v2.js" defer></script>
</body>
