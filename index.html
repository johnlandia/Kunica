<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionuel — Sistema de Gestão</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1C1A17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./vendor/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --carvao: #1C1A17;
    --carvao-2: #252220;
    --carvao-3: #2E2A26;
    --linho: #F7F4EE;
    --linho-dim: #C9C2B4;
    --caramelo: #9B7A4E;
    --caramelo-light: #C7A573;
    --verde-alfaiate: #3D5A4A;
    --verde-light: #6B9180;
    --giz: #C2402E;
    --giz-light: #E0796A;
    --line: rgba(155,122,78,0.16);

    /* Aliases modernos usados nos componentes novos (gaveta de publicação,
       media do feed, medidas). Apontam para a paleta já existente acima,
       para não alterar a identidade visual do resto do site. */
    --bg-primary: var(--carvao);
    --surface: var(--carvao-2);
    --accent: var(--caramelo);
    --text-main: var(--linho);
    --text-dim: var(--linho-dim);
    --border: var(--line);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--carvao); color:var(--linho);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input,select,textarea{ font-family:inherit; }

  .center-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--carvao-2); border:1px solid var(--line); border-radius:6px;
    padding:36px 30px; max-width:420px; width:100%; text-align:center;
  }
  .logo-mark{ font-size:13px; letter-spacing:0.16em; color:var(--caramelo-light); text-transform:uppercase; margin-bottom:6px; }
  .card h1{ font-size:24px; color:var(--linho); margin-bottom:10px; }
  .card p{ color:var(--linho-dim); font-size:13.5px; line-height:1.6; margin-bottom:24px; }

  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; background:#fff; color:#1f1f1f; font-size:14px; font-weight:600;
    padding:12px 0; border-radius:4px;
  }
  .google-btn:hover{ background:#f2f2f2; }
  .login-divider{
    display:flex; align-items:center; gap:12px;
    margin:18px 0; color:var(--linho-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em;
  }
  .login-divider::before, .login-divider::after{
    content:''; flex:1; height:1px; background:var(--line);
  }

  .role-options{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .role-btn{
    background:var(--carvao); border:1px solid var(--line); color:var(--linho);
    padding:16px; border-radius:5px; text-align:left; display:flex; align-items:center; gap:14px;
  }
  .role-btn:hover{ border-color:var(--caramelo); }
  .role-btn .ic{ font-size:22px; }
  .role-btn .txt strong{ display:block; font-size:14px; margin-bottom:2px; }
  .role-btn .txt span{ font-size:12px; color:var(--linho-dim); }

  .status-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase; font-weight:600;
    padding:6px 12px; border-radius:30px; margin-bottom:18px;
  }
  .status-pendente{ background:rgba(155,122,78,0.15); color:var(--caramelo-light); }
  .status-rejeitado{ background:rgba(194,64,46,0.15); color:var(--giz-light); }

  .icon-spin{ display:inline-block; animation:spin 1.2s linear infinite; }
  .spinner-css{
    display:inline-block; width:22px; height:22px; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--caramelo);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- TOP BAR (logado) ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(28,26,23,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .topbar .brand{ font-size:16px; letter-spacing:0.01em; }
  .topbar .brand .tag{ font-size:10px; color:var(--caramelo-light); letter-spacing:0.12em; text-transform:uppercase; margin-left:8px; }
  .topbar .who{ display:flex; align-items:center; gap:12px; }
  .topbar .who .email{ font-size:12px; color:var(--linho-dim); }
  .role-tag{
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;
    padding:4px 9px; border-radius:30px;
  }
  .role-tag.ceo{ background:rgba(155,122,78,0.2); color:var(--caramelo-light); }
  .role-tag.funcionario{ background:rgba(61,90,74,0.25); color:var(--verde-light); }
  .role-tag.cliente{ background:rgba(155,122,78,0.1); color:var(--linho-dim); }
  .role-tag.afilhado{ background:rgba(155,122,78,0.18); color:var(--caramelo-light); }
  .signout-btn{ background:transparent; border:1px solid var(--line); color:var(--linho-dim); font-size:11.5px; padding:6px 12px; border-radius:4px; }
  .signout-btn:hover{ border-color:var(--giz); color:var(--giz-light); }

  /* ---------- MAIN CONTENT AREA ---------- */
  main{ max-width:1000px; margin:0 auto; padding:32px 20px 80px; }
  .page-head{ margin-bottom:28px; }
  .page-head h2{ font-size:26px; color:var(--linho); margin-bottom:6px; }
  .page-head p{ color:var(--linho-dim); font-size:13.5px; }

  /* ---------- APPROVAL LIST (CEO) ---------- */
  .approval-list{ display:flex; flex-direction:column; gap:12px; }
  .approval-row{
    background:var(--carvao-2); border:1px solid var(--line); border-radius:6px;
    padding:18px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .approval-row .info{ flex:1; min-width:200px; }
  .approval-row .info .nome{ font-size:15px; font-weight:600; color:var(--linho); }
  .approval-row .info .email{ font-size:12.5px; color:var(--linho-dim); }
  .papel-pill{
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase; font-weight:700;
    padding:4px 10px; border-radius:30px; background:rgba(61,90,74,0.2); color:var(--verde-light);
  }
  .approval-actions{ display:flex; gap:8px; }
  .btn-approve{ background:var(--verde-alfaiate); color:var(--linho); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:4px; }
  .btn-approve:hover{ background:var(--verde-light); color:var(--carvao); }
  .btn-reject{ background:transparent; border:1px solid var(--giz); color:var(--giz-light); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:4px; }
  .btn-reject:hover{ background:var(--giz); color:var(--linho); }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--linho-dim); }
  .empty-state .ic{ font-size:32px; margin-bottom:12px; }

  .tabs{ display:flex; gap:8px; margin-bottom:28px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab-link{ background:transparent; color:var(--linho-dim); font-size:13px; padding:10px 16px; border-bottom:2px solid transparent; }
  .tab-link.active{ color:var(--caramelo-light); border-bottom-color:var(--caramelo); }

  /* Navegação principal do CEO e do Parceiro/Gerente — pílulas agrupadas
     por área, com ícone, em vez de uma fila plana de texto. Mesma
     linguagem visual dos cartões de seleção já usados no checkout. */
  .shell-nav{ margin-bottom:26px; }
  .shell-nav-grupo{ margin-bottom:16px; }
  .shell-nav-grupo:last-child{ margin-bottom:0; }
  .shell-nav-label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--linho-dim); margin-bottom:9px;
  }
  .shell-nav-pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .shell-tab{
    display:inline-flex; align-items:center; gap:7px; padding:9px 16px 9px 13px; border-radius:30px;
    border:1px solid var(--line); background:var(--carvao-2); color:var(--linho-dim);
    font-size:12.5px; font-weight:600; white-space:nowrap; transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .shell-tab:hover{ border-color:var(--caramelo); color:var(--linho); }
  .shell-tab.active{ background:var(--caramelo); color:var(--carvao); border-color:var(--caramelo); }
  .shell-tab span{ font-size:14px; }

  /* Menu suspenso genérico — botão que abre um painel com opções.
     Usado na navegação principal (CEO/Parceiro) e nas ações de cada
     membro (promover, dispensar). */
  .dropdown-wrap{ position:relative; display:inline-block; }
  .shell-nav-btn{
    display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:8px;
    background:var(--carvao-2); border:1px solid var(--line); color:var(--linho); font-size:13.5px; font-weight:600;
  }
  .shell-nav-btn:hover{ border-color:var(--caramelo); }
  .shell-nav-btn .chevron{ color:var(--linho-dim); font-size:11px; margin-left:2px; }
  .kebab-btn{
    background:var(--carvao-2); border:1px solid var(--line); color:var(--linho-dim); border-radius:6px;
    width:32px; height:32px; font-size:16px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  }
  .kebab-btn:hover{ border-color:var(--caramelo); color:var(--linho); }
  .dropdown-menu{
    position:absolute; top:calc(100% + 6px); left:0; background:var(--carvao-2); border:1px solid var(--line);
    border-radius:9px; padding:6px; min-width:220px; box-shadow:0 14px 34px rgba(0,0,0,0.5); z-index:90; display:none;
  }
  .dropdown-menu.direita{ left:auto; right:0; }
  .dropdown-menu.aberto{ display:block; }
  .dropdown-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--linho-dim); padding:8px 10px 4px; }
  .dropdown-item{
    display:block; width:100%; text-align:left; padding:9px 11px; border-radius:6px; font-size:12.5px;
    color:var(--linho); background:none;
  }
  .dropdown-item:hover{ background:var(--carvao-3); }
  .dropdown-item.ativo{ color:var(--caramelo-light); }
  .dropdown-item.danger{ color:var(--giz-light); }
  .dropdown-divider{ height:1px; background:var(--line); margin:6px 4px; }

  .field{ margin-bottom:14px; text-align:left; }
  .field label{ display:block; font-size:11.5px; color:var(--linho-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--carvao); border:1px solid var(--line);
    color:var(--linho); font-size:13.5px; padding:10px 12px; border-radius:4px; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--caramelo); }
  .form-card{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:22px; margin-bottom:28px; }
  .form-card h3{ font-size:16px; color:var(--linho); margin-bottom:16px; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field-row .field{ flex:1; min-width:140px; margin-bottom:0; }
  .form-row2{ display:flex; gap:12px; }
  .form-row2 .field{ flex:1; }
  .btn-submit{ background:var(--caramelo); color:var(--carvao); font-size:13.5px; font-weight:700; padding:11px 22px; border-radius:4px; }
  .btn-submit:hover{ background:var(--caramelo-light); }
  .btn-submit:disabled{ opacity:0.6; }

  .obra-card{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:10px; }
  .obra-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .obra-cliente{ font-size:14.5px; font-weight:600; color:var(--linho); }
  .obra-tipo{ font-size:12px; color:var(--linho-dim); }
  .obra-valores{ font-size:12.5px; color:var(--linho-dim); margin-top:6px; }
  .obra-valores .mono{ color:var(--caramelo-light); }
  .estado-badge{ font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:4px 10px; border-radius:30px; white-space:nowrap; }
  .estado-pendente-ceo{ background:rgba(155,122,78,0.15); color:var(--caramelo-light); }
  .estado-concluido{ background:rgba(61,90,74,0.25); color:var(--verde-light); }
  .estado-rejeitado{ background:rgba(194,64,46,0.15); color:var(--giz-light); }
  .estado-por_concluir{ background:rgba(155,122,78,0.1); color:var(--linho-dim); }
  .motivo-rejeicao{ font-size:12px; color:var(--giz-light); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }

  /* ---- Obras: duas colunas (Ajustes / Confecção), em grelha, mais
     compactas — ordenadas da mais antiga para a mais recente. ---- */
  .obras-duas-colunas{ display:grid; grid-template-columns:1fr; gap:26px; }
  @media (min-width:880px){ .obras-duas-colunas{ grid-template-columns:1fr 1fr; } }
  .obras-coluna-titulo{
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--caramelo-light);
    font-weight:600; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .obras-coluna-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(165px,1fr)); gap:10px; align-content:start; }
  .obras-grid-compacto .obra-card{ padding:10px 12px; margin-bottom:0; }
  .obras-grid-compacto .obra-cliente{ font-size:11px; }
  .obras-grid-compacto .obra-tipo,
  .obras-grid-compacto .obra-valores,
  .obras-grid-compacto .motivo-rejeicao,
  .obras-grid-compacto .estado-badge,
  .obras-grid-compacto .badge-urgente{ font-size:11px; }
  .obras-grid-compacto .ceo-obra-controls{ gap:6px; }
  .obras-grid-compacto .ceo-obra-controls button,
  .obras-grid-compacto .ceo-obra-controls .field{ font-size:11px; }
  .obra-acoes-toggle{ margin-top:10px; }
  .obra-acoes-toggle summary{
    cursor:pointer; list-style:none; font-size:11px; color:var(--caramelo-light);
    padding:6px 0; border-top:1px solid var(--line); user-select:none;
  }
  .obra-acoes-toggle summary::-webkit-details-marker{ display:none; }
  .obra-acoes-toggle .ceo-obra-controls{ margin-top:8px; padding-top:0; border-top:none; }
  .obra-media-tira{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .obra-foto-thumb{ width:40px; height:40px; object-fit:cover; border-radius:4px; border:1px solid var(--line); cursor:pointer; }
  .obra-foto-pendente-thumb{
    width:56px; height:56px; object-fit:cover; border-radius:4px; border:1px solid var(--line); position:relative;
  }

  .meta-card{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:22px; margin-bottom:16px; }
  .meta-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .meta-head h3{ font-size:16px; color:var(--linho); text-transform:capitalize; }
  .meta-head .periodo-tag{ font-size:11px; color:var(--linho-dim); }
  .meta-bar-track{ background:var(--carvao); border-radius:30px; height:8px; overflow:hidden; margin-bottom:6px; }
  .meta-bar-fill{ height:100%; background:var(--caramelo); border-radius:30px; transition:width .4s ease; }
  .meta-bar-fill.atingida{ background:var(--verde-alfaiate); }
  .meta-nums{ display:flex; justify-content:space-between; font-size:12px; color:var(--linho-dim); margin-bottom:14px; }
  .meta-frase{ font-size:13.5px; color:var(--caramelo-light); font-style:italic; line-height:1.5; }
  .meta-frase.atingida{ color:var(--verde-light); }
  .empty-state-small{ text-align:center; padding:30px 16px; color:var(--linho-dim); font-size:13px; }

  .loading-screen{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:80px 20px; color:var(--linho-dim); }

  .error-banner{
    background:rgba(194,64,46,0.12); border:1px solid var(--giz); color:var(--giz-light);
    padding:12px 16px; border-radius:5px; font-size:13px; margin-bottom:20px; text-align:left;
  }

  /* ---------- TABS (funcionário/cliente) ---------- */
  .panel-tabs{ display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .panel-tab{ background:transparent; color:var(--linho-dim); font-size:13px; padding:10px 16px; border-bottom:2px solid transparent; }
  .panel-tab.active{ color:var(--caramelo-light); border-bottom-color:var(--caramelo); }

  /* ---------- FORM FIELDS: ver bloco único definido mais acima ---------- */

  /* ---------- CONTROLOS DO CEO (obras/metas) ---------- */
  .ceo-obra-controls{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .ceo-obra-controls select{
    width:100%; background:var(--carvao); border:1px solid var(--line); color:var(--linho);
    font-size:13px; padding:9px 11px; border-radius:4px; font-family:inherit;
  }
  .totals-bar{ font-size:13px; color:var(--linho-dim); margin-bottom:16px; padding:12px 16px; background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; }

  .relatorio-kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin:20px 0; }
  .kpi-card{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
  .kpi-label{ font-size:11px; color:var(--linho-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .kpi-valor{ font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:600; color:var(--linho); }

  .regras-relatorio{
    background:rgba(194,64,46,0.08); border:1px solid rgba(194,64,46,0.35); border-radius:6px;
    padding:16px 18px; margin-bottom:20px; font-size:12.5px; line-height:1.65; color:var(--linho);
  }
  .regras-relatorio strong{ color:var(--giz-light); display:block; margin-bottom:8px; font-size:13px; }
  .regras-relatorio ul{ margin:0; padding-left:18px; }
  .regras-relatorio li{ margin-bottom:4px; color:var(--linho-dim); }
  .totals-bar .mono{ color:var(--caramelo-light); font-weight:600; }

  /* ---------- CAIXA DO DIA ---------- */
  .dia-header{ margin-bottom:16px; }
  .caixa-totais{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .caixa-total{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:16px 14px; text-align:center; }
  .caixa-total.destaque{ border-color:var(--caramelo); background:rgba(155,122,78,0.08); }
  .ct-label{ font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--linho-dim); margin-bottom:6px; }
  .ct-valor{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:600; }
  .ct-valor.verde{ color:var(--verde-light); }
  .ct-valor.giz{ color:var(--giz-light); }
  .ct-valor.caramelo{ color:var(--caramelo-light); }

  .medidas-bloco{ border:1px solid var(--line); border-radius:6px; padding:0; margin-bottom:16px; overflow:hidden; }
  .medidas-bloco summary{
    cursor:pointer; padding:12px 14px; font-size:13px; color:var(--caramelo-light);
    list-style:none; user-select:none;
  }
  .medidas-bloco summary::-webkit-details-marker{ display:none; }
  .medidas-bloco[open] summary{ border-bottom:1px solid var(--line); }
  .medidas-drawer-body{ padding:14px; }
  .medidas-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .medidas-grid + .medidas-grid{ margin-top:10px; }
  .medidas-grid .field{ margin-bottom:0; }
  .medidas-grid .field.full{ grid-column:1 / -1; }
  .medidas-resumo{ font-size:11px; color:var(--linho-dim); margin-top:4px; font-family:'JetBrains Mono', monospace; line-height:1.6; }
  @media (max-width:480px){
    .medidas-grid{ grid-template-columns:1fr; }
  }

  .obras-dia-lista{ margin-top:24px; }
  .dia-resumo{
    display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--linho-dim);
    padding:12px 16px; background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; margin-bottom:14px;
  }
  .obra-dia-row{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--carvao-2); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; margin-bottom:10px;
  }
  .obra-num{ font-size:11px; color:var(--linho-dim); flex-shrink:0; padding-top:2px; }
  .obra-dia-info{ flex:1; min-width:0; }
  .obra-dia-valores{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; text-align:right; }

  /* ---------- STOCK DE MATERIAIS ---------- */
  .stock-alerta{
    background:rgba(194,64,46,0.1); border:1px solid var(--giz); color:var(--giz-light);
    font-size:12.5px; line-height:1.6; padding:12px 14px; border-radius:5px; margin-bottom:16px;
  }
  .material-row{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--carvao-2); border:1px solid var(--line); border-radius:6px;
    padding:12px 16px; margin-bottom:8px;
  }
  .material-row.material-baixo{ border-color:var(--giz); }
  .material-info{ flex:1; min-width:140px; }
  .material-nome{ font-size:13.5px; color:var(--linho); font-weight:600; }
  .material-cat{ font-size:11px; color:var(--linho-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .material-qtd{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .material-actions{ display:flex; gap:6px; }

  /* ---------- NEGÓCIO (vendas, financeiro, clientes, marketing) ---------- */
  .negocio-section{ margin-bottom:32px; }
  .negocio-h{ font-size:16px; color:var(--linho); margin-bottom:14px; font-weight:600; }
  .ranking-row{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--linho);
    padding:9px 0; border-bottom:1px dashed var(--line);
  }
  .ranking-row:last-child{ border-bottom:none; }

  /* ---------- CONTROLOS GERAIS (usados em vários painéis) ---------- */
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--linho-dim);
    font-size:12px; padding:7px 12px; border-radius:4px;
  }
  .icon-btn:hover{ border-color:var(--caramelo); color:var(--caramelo-light); }
  .icon-btn.danger{ border-color:rgba(194,64,46,0.4); color:var(--giz-light); }
  .icon-btn.danger:hover{ border-color:var(--giz); background:rgba(194,64,46,0.08); }
  .badge-urgente{
    font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    padding:4px 10px; border-radius:30px; white-space:nowrap;
    border:1px solid var(--giz); color:var(--giz-light); background:rgba(194,64,46,0.08);
  }
  .obra-filtro-chip{
    background:transparent; border:1px solid var(--line); color:var(--linho-dim);
    font-size:12px; padding:7px 14px; border-radius:30px; cursor:pointer;
  }
  .obra-filtro-chip:hover{ border-color:var(--caramelo); color:var(--linho); }
  .obra-filtro-chip.ativo{ border-color:var(--caramelo); color:var(--caramelo-light); background:rgba(155,122,78,0.12); }
  .back-link{
    display:inline-block; font-size:12.5px; color:var(--linho-dim);
    margin-bottom:16px; cursor:pointer;
  }
  .back-link:hover{ color:var(--caramelo-light); }
  .section-eyebrow{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--caramelo-light); font-weight:600; }

  /* ---------- AVISO WHATSAPP AO CLIENTE ---------- */
  .wa-notify-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:#1FAA59; color:#fff; font-size:13px; font-weight:600;
    padding:11px 16px; border-radius:5px; text-decoration:none;
    margin-top:12px;
  }
  .wa-notify-btn:hover{ background:#189449; }
  .wa-notify-missing{
    font-size:11.5px; color:var(--linho-dim); font-style:italic;
    margin-top:12px; padding:8px 10px; background:var(--carvao); border-radius:4px;
  }

  /* ---------- BOTÕES DE LARGURA TOTAL (telas de login) ---------- */
  .btn-primary-full{
    width:100%; background:var(--caramelo); color:var(--carvao);
    font-size:14px; font-weight:700; letter-spacing:0.02em; padding:13px 0; border-radius:4px;
  }
  .btn-primary-full:hover{ background:var(--caramelo-light); }
  .btn-primary-full:disabled{ opacity:0.6; }
  .btn-ghost-full{
    width:100%; background:transparent; color:var(--linho-dim); border:1px solid var(--line);
    font-size:13px; padding:11px 0; border-radius:4px; margin-top:10px;
  }
  .btn-ghost-full:hover{ color:var(--linho); border-color:var(--caramelo); }

  /* ---------- FEED HOME (posts) ---------- */
  /* Gaveta retrátil da publicação — <details> nativo, sem JS extra para
     abrir/fechar. Só aparece no DOM quando a pessoa tem permissão
     (ver podePublicar em renderFeedTab), por isso fica oculta por
     padrão para quem não pode publicar. */
  .post-drawer{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    margin-bottom:28px; overflow:hidden;
  }
  .post-drawer summary{
    cursor:pointer; padding:16px 20px; font-size:13.5px; font-weight:600;
    color:var(--accent); list-style:none; user-select:none;
    display:flex; align-items:center; gap:9px;
  }
  .post-drawer summary::-webkit-details-marker{ display:none; }
  .post-drawer summary::before{ content:'▸'; font-size:11px; transition:transform .18s ease; }
  .post-drawer[open] summary::before{ transform:rotate(90deg); }
  .post-drawer[open] summary{ border-bottom:1px solid var(--border); }
  .post-drawer .drawer-body{ padding:20px; }

  .admin-img-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .post-card{
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:16px 18px; margin-bottom:14px;
  }
  .post-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; gap:10px; }
  .post-autor{ font-size:13.5px; font-weight:600; color:var(--text-main); }
  .post-data{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .post-texto{ font-size:13.5px; color:var(--text-main); line-height:1.6; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .post-ver-mais{ color:var(--caramelo-light); font-weight:600; cursor:pointer; }
  .post-ver-mais:hover{ text-decoration:underline; }

  /* Container fixo 16:9 para foto/vídeo: qualquer proporção ou orientação
     (vertical, horizontal, quadrada) encaixa sem esticar nem quebrar
     o alinhamento do feed — o ficheiro fica contido, com fundo preto
     a preencher o espaço sobrante. */
  .post-media-wrap{
    width:100%; aspect-ratio:16/9; background:#000; border-radius:5px;
    overflow:hidden; margin-top:4px;
  }
  .post-media{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }

  /* Barra de progresso simulada durante o upload para o Storage */
  .upload-progress{
    width:100%; height:6px; background:var(--bg-primary); border-radius:30px;
    overflow:hidden; margin:4px 0 14px; display:none;
  }
  .upload-progress-fill{ height:100%; width:0%; background:var(--accent); border-radius:30px; transition:width .2s ease; }

  /* ======================================================================
     VITRINE — loja pública (ateliê + e-books), antes do login.
     Reutiliza a mesma paleta do painel interno para manter uma só marca:
     carvão como base, linho como texto, caramelo como acento quente e
     verde-alfaiate/giz como toques pontuais (preço em destaque, selos).
     ====================================================================== */
  .vitrine{ min-height:100vh; }

  .vitrine-header{
    position:sticky; top:0; z-index:40; display:flex; align-items:center;
    justify-content:space-between; gap:16px; padding:16px 24px;
    background:rgba(28,26,23,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .vitrine-header .logo-mark{ font-size:15px; letter-spacing:0.14em; }
  .vitrine-nav{ display:flex; align-items:center; gap:22px; }
  .vitrine-nav a{
    color:var(--linho-dim); text-decoration:none; font-size:12.5px;
    letter-spacing:0.04em; transition:color .15s ease;
  }
  .vitrine-nav a:hover{ color:var(--linho); }
  .vitrine-entrar{
    color:var(--caramelo-light); border:1px solid var(--line); border-radius:30px;
    padding:7px 16px; font-size:12px; font-weight:600;
  }
  .vitrine-entrar:hover{ border-color:var(--caramelo); }

  /* ---- Hero: etiqueta de alfaiate + machado editorial, sem o cliché
     de "número grande + gradiente". A etiqueta cita os dois lados do
     negócio (ateliê físico e e-books) como um par de "ordens de fabrico". ---- */
  .vitrine-hero{
    padding:76px 24px 64px; max-width:920px; margin:0 auto; text-align:left;
  }
  .vitrine-etiqueta{
    display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--caramelo-light);
    border:1px solid var(--line); border-radius:3px; padding:6px 12px; margin-bottom:28px;
  }
  .vitrine-etiqueta::before{ content:''; font-size:12px; }
  .vitrine-hero h1{
    font-size:clamp(38px, 6.4vw, 68px); line-height:1.02; font-weight:700;
    max-width:14ch; margin-bottom:20px; letter-spacing:-0.01em;
  }
  .vitrine-hero h1 em{ color:var(--caramelo-light); font-style:normal; }
  .vitrine-slogan{ font-family:'Fraunces', serif; font-style:italic; font-size:17px; color:var(--caramelo-light); margin-bottom:14px; }
  .vitrine-hero p{ font-size:16px; color:var(--linho-dim); max-width:52ch; line-height:1.65; margin-bottom:24px; }

  .vitrine-cta-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .btn-vitrine-primaria, .btn-vitrine-secundaria{
    display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:4px;
    font-size:13.5px; font-weight:600; text-decoration:none; transition:transform .15s ease, background .15s ease;
  }
  .btn-vitrine-primaria{ background:var(--caramelo); color:var(--carvao); }
  .btn-vitrine-primaria:hover{ background:var(--caramelo-light); transform:translateY(-1px); }
  .btn-vitrine-secundaria{ border:1px solid var(--line); color:var(--linho); }
  .btn-vitrine-secundaria:hover{ border-color:var(--caramelo); transform:translateY(-1px); }

  .vitrine-resultados-row{
    display:flex; gap:28px; flex-wrap:wrap; margin-top:34px; padding-top:26px; border-top:1px solid var(--line);
  }
  .vitrine-resultados-row div{ display:flex; flex-direction:column; gap:4px; }
  .vitrine-resultados-row strong{ font-size:22px; color:var(--caramelo-light); font-family:'JetBrains Mono', monospace; }
  .vitrine-resultados-row span{ font-size:11.5px; color:var(--linho-dim); white-space:nowrap; }

  .vitrine-selos{ display:flex; gap:20px; flex-wrap:wrap; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }
  .vitrine-selos span{ font-size:11.5px; color:var(--linho-dim); white-space:nowrap; }

  /* ---- Divisor-costura: elemento de assinatura da página. Uma linha
     tracejada como um ponto de alinhavo, repetida entre secções — a
     única "ousadia" visual da página, usada com disciplina. ---- */
  .vitrine-costura{
    max-width:1100px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:14px;
  }
  .vitrine-costura::before, .vitrine-costura::after{
    content:''; flex:1; height:0; border-top:1.5px dashed var(--line);
  }
  .vitrine-costura span{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.16em; color:var(--linho-dim); text-transform:uppercase; white-space:nowrap; }

  .vitrine-secao{ max-width:1100px; margin:0 auto; padding:56px 24px; }
  .vitrine-secao-head{ margin-bottom:32px; max-width:60ch; }
  .vitrine-secao-head h2{ font-size:clamp(24px,3vw,32px); margin-bottom:10px; }
  .vitrine-secao-head p{ color:var(--linho-dim); font-size:14px; line-height:1.6; }

  /* ---- Catálogo (grelha partilhada por ateliê e e-books) ---- */
  .produto-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; }
  .produto-card{
    background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .15s ease, transform .15s ease;
  }
  .produto-card:hover{ border-color:var(--caramelo); transform:translateY(-2px); }
  .produto-capa{ width:100%; aspect-ratio:4/3; background:#000; overflow:hidden; position:relative; }
  .produto-capa img, .produto-capa video{ width:100%; height:100%; object-fit:cover; display:block; }
  .produto-capa.sem-imagem{ display:flex; align-items:center; justify-content:center; color:var(--linho-dim); font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--carvao-3); }
  .produto-selo{
    position:absolute; top:10px; left:10px; background:var(--giz); color:#fff; font-size:10.5px; font-weight:700;
    padding:4px 10px; border-radius:30px; letter-spacing:0.02em;
  }
  .produto-corpo{ padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .produto-tipo{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--verde-light); }
  .produto-nome{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; line-height:1.3; }
  .produto-rating{ font-size:11.5px; color:var(--caramelo-light); font-family:'JetBrains Mono', monospace; }
  .produto-desc{ font-size:12.5px; color:var(--linho-dim); line-height:1.55; flex:1; }
  .produto-rodape{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .produto-preco{ font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:600; color:var(--linho); }
  .produto-preco small{ font-size:10px; color:var(--linho-dim); font-weight:400; display:block; }
  .btn-add-carrinho{
    background:var(--caramelo); color:var(--carvao); border-radius:4px; padding:9px 14px;
    font-size:12px; font-weight:700; white-space:nowrap;
  }
  .btn-add-carrinho:hover{ background:var(--caramelo-light); }
  .btn-add-carrinho:disabled{ opacity:0.5; cursor:default; }
  /* Grelha compacta de 2 colunas no telemóvel — cartão mais alto do que
     largo faz caber só 1 por linha, o que parece lista; forçamos 2
     colunas e um cartão mais denso (imagem quadrada, menos texto). */
  @media (max-width:640px){
    .produto-grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .produto-card{ border-radius:8px; }
    .produto-capa{ aspect-ratio:1/1; }
    .produto-selo{ top:6px; left:6px; padding:3px 8px; font-size:9.5px; }
    .produto-corpo{ padding:8px 8px 10px; gap:4px; }
    .produto-tipo{ font-size:9px; }
    .produto-nome{ font-size:12.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .produto-desc{ display:none; }
    .produto-rating{ font-size:10px; }
    .produto-rodape{ flex-direction:column; align-items:stretch; gap:6px; margin-top:2px; }
    .produto-preco{ font-size:13px; }
    .produto-card .btn-vitrine-secundaria{ display:none; }
    .btn-add-carrinho{ width:100%; text-align:center; padding:7px 8px; font-size:11px; }
  }

  /* ---- Página de produto individual ---- */
  .produto-detalhe-media{ width:100%; aspect-ratio:4/3; background:#000; border-radius:6px; overflow:hidden; margin-bottom:18px; }
  .produto-detalhe-media img, .produto-detalhe-media video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .produto-detalhe-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .produto-detalhe-tabs button{
    background:none; border:1px solid var(--line); color:var(--linho-dim); border-radius:30px; padding:6px 14px; font-size:11.5px;
  }
  .produto-detalhe-tabs button.ativo{ border-color:var(--caramelo); color:var(--caramelo-light); }
  .estrela-input{ display:flex; gap:6px; font-size:22px; margin:6px 0 14px; }
  .estrela-input span{ cursor:pointer; color:var(--line); }
  .estrela-input span.ativa{ color:var(--caramelo); }
  .avaliacao-item{ border-top:1px solid var(--line); padding:12px 0; }
  .avaliacao-item .estrelas{ color:var(--caramelo); font-size:13px; }
  .avaliacao-item .nome{ font-size:12.5px; font-weight:600; margin-top:2px; }
  .avaliacao-item .comentario{ font-size:12.5px; color:var(--linho-dim); margin-top:4px; line-height:1.55; }
  .nivel-qtd-bar{ background:var(--carvao-2); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin:14px 0; }
  .nivel-qtd-linha{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--linho-dim); padding:5px 0; font-family:'JetBrains Mono', monospace; }
  .nivel-qtd-linha.ativo{ color:var(--linho); font-weight:700; }
  .nivel-qtd-linha em{ color:var(--verde-light); font-style:normal; }
  .nivel-qtd-nudge{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:var(--caramelo-light,var(--caramelo)); font-family:'Inter', sans-serif; }
  .nivel-qtd-nudge.nivel-qtd-max{ color:var(--verde-light); }
  .qtd-stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:4px; overflow:hidden; width:fit-content; }
  .qtd-stepper button{ width:38px; height:38px; background:var(--carvao-2); color:var(--linho); font-size:16px; font-weight:700; }
  .qtd-stepper button:hover{ background:var(--carvao-3); }
  .qtd-stepper input{ width:48px; text-align:center; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line); background:var(--carvao); color:var(--linho); height:38px; font-family:'JetBrains Mono', monospace; font-size:14px; }
  .qtd-atalhos{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .qtd-atalho-btn{ padding:6px 12px; border:1px solid var(--line); border-radius:20px; font-size:12px; color:var(--linho-dim); background:transparent; }
  .qtd-atalho-btn.ativo{ border-color:var(--caramelo); color:var(--caramelo); font-weight:600; }
  .barra-fixa-mobile{ display:none; }
  @media (max-width:640px){
    .barra-fixa-mobile{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:60; gap:10px;
      background:var(--carvao-2); border-top:1px solid var(--line);
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    }
    .barra-fixa-mobile a, .barra-fixa-mobile button{
      flex:1; text-align:center; padding:12px 10px; border-radius:6px; font-size:13px; font-weight:700;
    }
    .barra-fixa-whatsapp{ background:var(--verde-alfaiate); color:var(--linho); }
    .barra-fixa-comprar{ background:var(--caramelo); color:var(--carvao); }
    .vitrine{ padding-bottom:74px; }
  }
  .combo-nudge{
    background:rgba(155,122,78,0.12); border:1px solid var(--caramelo); border-radius:6px; padding:12px 14px;
    font-size:12px; color:var(--linho); margin-bottom:14px; line-height:1.55;
  }
  .combo-nudge a{ color:var(--caramelo-light); font-weight:600; }

  /* ---- Prova social: trabalhos recentes, puxados do feed real ---- */
  .trabalhos-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px; }
  .trabalho-item{ aspect-ratio:4/5; border-radius:5px; overflow:hidden; background:#000; }
  .trabalho-item img{ width:100%; height:100%; object-fit:cover; display:block; }


  /* ---- Confiança / como funciona o pagamento ---- */
  .confianca-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; }
  .confianca-item{ padding:18px 4px; border-top:1px solid var(--line); }
  .confianca-item .num{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--caramelo-light); margin-bottom:8px; display:block; }
  .confianca-item h3{ font-size:15px; margin-bottom:6px; }
  .confianca-item p{ font-size:12.5px; color:var(--linho-dim); line-height:1.6; }

  .vitrine-rodape{ border-top:1px solid var(--line); padding:36px 24px; text-align:center; }
  .vitrine-rodape p{ color:var(--linho-dim); font-size:12px; margin-top:8px; }
  .vitrine-rodape a{ color:var(--caramelo-light); }

  /* ---- Carrinho: botão flutuante + gaveta lateral ---- */
  .carrinho-fab{
    position:fixed; bottom:24px; right:24px; z-index:60; background:var(--caramelo); color:var(--carvao);
    border-radius:30px; padding:13px 20px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;
    box-shadow:0 8px 22px rgba(0,0,0,0.45);
  }
  .carrinho-fab .badge{ background:var(--carvao); color:var(--linho); border-radius:20px; font-size:11px; padding:2px 8px; }

// Lê o endereço da página à procura de um erro devolvido pelo Supabase
// (acontece quando o link de acesso expirou, já foi usado, ou falhou por
// outro motivo). Até agora, esse erro era ignorado silenciosamente e a
// pessoa só via "voltar ao ecrã de login", sem saber porquê. Isto lê
// tanto o fragmento (#erro=...) como os parâmetros (?erro=...), porque o
// Supabase pode devolver o erro de qualquer uma das duas formas.
function lerErroDeAutenticacaoNoUrl(){
  const hash = window.location.hash ? window.location.hash.substring(1) : '';
  const hashParams = new URLSearchParams(hash);
  const queryParams = new URLSearchParams(window.location.search);

  const erro = hashParams.get('error') || queryParams.get('error');
  const descricao = hashParams.get('error_description') || queryParams.get('error_description');

  if(!erro) return null;

  // Limpa o endereço depois de ler o erro, para que recarregar a página
  // não continue a mostrar o mesmo erro antigo.
  window.history.replaceState({}, document.title, window.location.pathname);

  return {
    codigo: erro,
    descricao: descricao ? decodeURIComponent(descricao.replace(/\+/g, ' ')) : 'Motivo não especificado.'
  };
}

async function init(){
  if(!supabaseReady){
    // A biblioteca do Supabase pode ter falhado a carregar por uma falha
    // pontual de rede (CDN lento/bloqueado, VPN ativa, ligação instável) —
    // não é necessariamente um problema de configuração do site. Tenta
    // recuperar antes de mostrar qualquer erro à pessoa.
    const recuperou = await tentarRecuperarSupabase();
    if(!recuperou){
      renderNotConfigured();
      return;
    }
  }

  // Antes de mais nada, verifica se o Supabase devolveu um erro explícito
  // (link expirado, já usado, etc.) — se sim, mostra-o claramente em vez
  // de simplesmente voltar ao ecrã de login sem explicação.
  const erroAuth = lerErroDeAutenticacaoNoUrl();
  if(erroAuth){
    renderErroDeLink(erroAuth);
    return;
  }

  // onAuthStateChange dispara imediatamente ao ser registado (com a
  // sessão atual, que pode ser nenhuma), e dispara de novo sempre que
  // o estado de login muda — incluindo quando o Supabase acaba de
  // processar o regresso do link de acesso. Reagimos sempre ao que
  // o evento diz, sem tentar adivinhar se "ainda falta" outro evento —
  // isso evitava reagir e prendia a página no ecrã de carregamento
  // quando não havia nenhum login em curso.
  sb.auth.onAuthStateChange((event, session) => {
    const novoUser = session ? session.user : null;
    currentAuthUser = novoUser;

    if(currentAuthUser){
      loadOrCreateUsuario();
    } else {
      currentUsuario = null;
      renderVitrineLoja();
    }
  });

  // Rede de segurança: no caso (raro) de a biblioteca não disparar
  // nenhum evento, evita ficar preso no ecrã de carregamento inicial.
  // Verifica o conteúdo real da página, não uma flag interna.
  setTimeout(() => {
    if(app.querySelector('.spinner-css')){
      renderVitrineLoja();
    }
  }, 4000);
}

let loadOrCreateEmAndamento = false;

async function loadOrCreateUsuario(){
  // Proteção contra o mesmo pedido a correr duas vezes ao mesmo tempo
  // (o Supabase pode disparar o aviso de sessão mais do que uma vez em
  // sequência rápida logo após o login, especialmente no primeiro
  // acesso de cada pessoa nova).
  if(loadOrCreateEmAndamento) return;
  loadOrCreateEmAndamento = true;

  try{
    const { data, error } = await sb.from('usuarios').select('*').eq('id', currentAuthUser.id).maybeSingle();
    if(error) throw error;

    if(data){
      currentUsuario = data;

      // Se for um e-mail de CEO e ainda não estiver marcado como tal, corrige automaticamente
      if(isCeoEmail(currentAuthUser.email) && (data.papel !== 'ceo' || data.estado !== 'aprovado')){
        const { data: updated, error: updErr } = await sb.from('usuarios')
          .update({ papel: 'ceo', estado: 'aprovado' })
          .eq('id', currentAuthUser.id)
          .select()
          .maybeSingle();
        if(!updErr && updated) currentUsuario = updated;
      }

      routeByUsuario();
    } else {
      // Primeiro login desta pessoa — se for CEO, cria já com esse papel;
      // qualquer outra pessoa entra automaticamente como cliente aprovado.
      // Só o CEO pode depois promover a funcionário, gerente administrativo, etc.
      const novoPapel = isCeoEmail(currentAuthUser.email) ? 'ceo' : 'cliente';
      const { data: created, error: createErr } = await sb.from('usuarios').insert({
        id: currentAuthUser.id,
        email: currentAuthUser.email,
        nome: currentAuthUser.user_metadata && currentAuthUser.user_metadata.full_name || currentAuthUser.email,
        papel: novoPapel,
        estado: 'aprovado'
      }).select().maybeSingle();

      if(createErr){
        // Código 23505 = "duplicate key": outra chamada, quase ao mesmo
        // tempo, já criou este registo primeiro. Não é um erro real —
        // apenas relemos o registo que já existe, em vez de conceder
        // permissão de auto-edição (o que seria um risco de segurança:
        // qualquer pessoa poderia tentar mudar o próprio papel para CEO).
        if(createErr.code === '23505'){
          const { data: existente, error: reErr } = await sb.from('usuarios').select('*').eq('id', currentAuthUser.id).maybeSingle();
          if(reErr) throw reErr;
          currentUsuario = existente;
          routeByUsuario();
          return;
        }
        throw createErr;
      }

      currentUsuario = created;
      routeByUsuario();
    }
  }catch(e){
    renderError('Não foi possível carregar os seus dados: ' + (e.message || 'erro desconhecido'));
  }finally{
    loadOrCreateEmAndamento = false;
  }
}

// Confere tipo e tamanho do ficheiro ANTES de tentar o upload — evita
// gastar dados/tempo a enviar algo que o Storage ia recusar de qualquer
// forma. Bloqueia imagens acima de 5MB e vídeos acima de 25MB.
function validateFile(file){
  const ehImagem = file.type.startsWith('image/');
  const ehVideo = file.type.startsWith('video/');
  if(!ehImagem && !ehVideo){
    return { ok:false, mensagem:'Escolha uma foto ou um vídeo.' };
  }
  const LIMITE_IMAGEM_BYTES = 5 * 1024 * 1024;
  const LIMITE_VIDEO_BYTES  = 25 * 1024 * 1024;
  const limite = ehVideo ? LIMITE_VIDEO_BYTES : LIMITE_IMAGEM_BYTES;
  if(file.size > limite){
    const limiteTexto = ehVideo ? '25MB' : '5MB';
    const tipoTexto = ehVideo ? 'vídeo' : 'foto';
    const tamanhoTexto = (file.size / 1024 / 1024).toFixed(1);
    return { ok:false, mensagem:`Este ${tipoTexto} tem ${tamanhoTexto}MB — o máximo permitido é ${limiteTexto}. Escolha um ficheiro mais leve.` };
  }
  return { ok:true, tipo: ehVideo ? 'video' : 'imagem' };
}

// Traduz erros técnicos do Supabase Storage numa mensagem acionável — o
// caso mais comum de falha aqui é o bucket ainda não existir no projeto
// Supabase (o SDK devolve "Bucket not found").
function mensagemErroPublicacao(e, nomeBucket){
  const msg = (e && e.message) || '';
  if(/bucket/i.test(msg) && /(not found|não encontrado|does not exist)/i.test(msg)){
    return `O espaço de armazenamento "${nomeBucket}" ainda não está criado no Supabase. Em Storage → New bucket, crie um bucket chamado exatamente "${nomeBucket}", marque-o como público e tente publicar de novo.`;
  }
  return 'Não foi possível publicar: ' + (msg || 'erro desconhecido');
}

// Trata o clique em "Publicar": valida, faz upload (com barra de progresso
// simulada, já que o SDK do Supabase não expõe progresso real de upload),
// grava o registo e atualiza o feed. Função isolada para manter
// renderFeedTab mais curta e fácil de seguir.
async function handlePostSubmit({ btn, errBox, progressWrap, progressFill, container, podePublicar, getTexto, getFicheiro, getEmProducao }){
  const texto = getTexto();
  const ficheiro = getFicheiro();
  errBox.style.display = 'none';

  if(!texto && !ficheiro){
    errBox.textContent = 'Escreva algo ou anexe uma foto/vídeo.';
    errBox.style.display = 'block';
    return;
  }

  btn.textContent = 'A guardar…';
  btn.disabled = true;
  let progressTimer = null;

  try{
    let midiaUrl = null;
    let tipoMidia = null;

    if(ficheiro){
      progressWrap.style.display = 'block';
      progressFill.style.width = '0%';
      let simulado = 0;
      progressTimer = setInterval(() => {
        simulado = Math.min(simulado + Math.random() * 18, 90);
        progressFill.style.width = simulado + '%';
      }, 220);

      const ext = (ficheiro.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `posts/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await sb.storage.from('dionuel-feed').upload(path, ficheiro, { cacheControl: '3600', upsert: false });
      if(upErr) throw upErr;
      const { data: urlData } = sb.storage.from('dionuel-feed').getPublicUrl(path);
      midiaUrl = urlData.publicUrl;
      tipoMidia = ficheiro.type.startsWith('video/') ? 'video' : 'imagem';

      clearInterval(progressTimer);
      progressFill.style.width = '100%';
    }

    const novoPost = {
      autor_id: currentAuthUser.id,
      texto: texto || null,
      midia_url: midiaUrl,
      tipo_midia: tipoMidia,
      em_producao: getEmProducao ? getEmProducao() : false
    };
    let { error: insErr } = await sb.from('posts').insert(novoPost);
    if(insErr && insErr.code === '42703'){
      // Coluna "em_producao" ainda não existe nesta base de dados (falta
      // correr o SQL enviado) — publica na mesma, sem essa marcação, em
      // vez de bloquear a publicação inteira.
      delete novoPost.em_producao;
      const retry = await sb.from('posts').insert(novoPost);
      insErr = retry.error;
    }
    if(insErr) throw insErr;

    showToast('Publicado ✓');
    await renderFeedTab(container, podePublicar);
  }catch(e){
    if(progressTimer) clearInterval(progressTimer);
    progressWrap.style.display = 'none';
    errBox.textContent = mensagemErroPublicacao(e, 'dionuel-feed');
    errBox.style.display = 'block';
    btn.textContent = 'Publicar';
    btn.disabled = false;
  }
}

// Constrói a listagem do feed inteiramente com createElement/textContent —
// zero innerHTML com dados escritos por pessoas. Mesmo que alguém escreva
// algo como "<img onerror=...>" no texto de uma publicação, aparece no
// ecrã como texto simples e nunca é executado como código (proteção XSS).
function renderFeedLista({ lista, data, podePublicar, container }){
  lista.textContent = '';

  if(!data || data.length === 0){
    const vazio = document.createElement('div');
    vazio.className = 'empty-state-small';
    vazio.textContent = 'Ainda não há publicações.' + (podePublicar ? ' Seja a primeira pessoa a partilhar algo!' : '');
    lista.appendChild(vazio);
    return;
  }

  function criarCard(p){
    const autorNome = p.usuarios ? (p.usuarios.nome || p.usuarios.email) : 'Equipa Dionuel';
    const podeApagar = p.autor_id === currentAuthUser.id || currentUsuario.papel === 'ceo';

    const card = document.createElement('div');
    card.className = 'post-card';
    card.dataset.postId = p.id;

    const head = document.createElement('div');
    head.className = 'post-head';

    const infoWrap = document.createElement('div');
    const nomeEl = document.createElement('div');
    nomeEl.className = 'post-autor';
    nomeEl.textContent = autorNome;
    const dataEl = document.createElement('div');
    dataEl.className = 'post-data';
    dataEl.textContent = new Date(p.criado_em).toLocaleDateString('pt-PT', { day:'numeric', month:'long', year:'numeric' });
    infoWrap.appendChild(nomeEl);
    infoWrap.appendChild(dataEl);
    head.appendChild(infoWrap);

    if(podeApagar){
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = 'Apagar';
      delBtn.addEventListener('click', async () => {
        if(!confirm('Apagar esta publicação?')) return;
        try{
          const { error } = await sb.from('posts').delete().eq('id', p.id);
          if(error) throw error;
          await renderFeedTab(container, podePublicar);
          showToast('Publicação apagada');
        }catch(e){
          alert('Não foi possível apagar: ' + (e.message || 'erro desconhecido'));
        }
      });
      head.appendChild(delBtn);
    }
    card.appendChild(head);

    if(p.texto){
      const textoEl = document.createElement('div');
      textoEl.className = 'post-texto';
      const LIMITE = 220;
      if(p.texto.length > LIMITE){
        textoEl.textContent = p.texto.slice(0, LIMITE).trim() + '… ';
        const verMais = document.createElement('span');
        verMais.className = 'post-ver-mais';
        verMais.textContent = 'Ver mais';
        verMais.addEventListener('click', () => {
          textoEl.textContent = p.texto;
        });
        textoEl.appendChild(verMais);
      } else {
        textoEl.textContent = p.texto;
      }
      card.appendChild(textoEl);
    }

    if(p.midia_url && (p.tipo_midia === 'imagem' || p.tipo_midia === 'video')){
      const wrap = document.createElement('div');
      wrap.className = 'post-media-wrap';
      let mediaEl;
      if(p.tipo_midia === 'imagem'){
        mediaEl = document.createElement('img');
        mediaEl.src = p.midia_url;
        mediaEl.alt = 'Publicação do atelier';
        mediaEl.loading = 'lazy';
      } else {
        mediaEl = document.createElement('video');
        mediaEl.src = p.midia_url;
        mediaEl.controls = true;
        mediaEl.preload = 'metadata';
      }
      mediaEl.className = 'post-media';
      wrap.appendChild(mediaEl);
      card.appendChild(wrap);
    }

    return card;
  }

  // Home mais limpa: mostra só as mais recentes de início, com um botão
  // para expandir o resto — evita um feed comprido logo na entrada.
  const LIMITE_INICIAL = 6;
  const visiveis = data.length > LIMITE_INICIAL ? data.slice(0, LIMITE_INICIAL) : data;
  const ocultas = data.length > LIMITE_INICIAL ? data.slice(LIMITE_INICIAL) : [];

  visiveis.forEach(p => lista.appendChild(criarCard(p)));

  if(ocultas.length > 0){
    const verMaisBtn = document.createElement('button');
    verMaisBtn.type = 'button';
    verMaisBtn.className = 'icon-btn';
    verMaisBtn.style.cssText = 'width:100%; text-align:center; margin-top:6px;';
    verMaisBtn.textContent = `Ver mais publicações (${ocultas.length})`;
    lista.appendChild(verMaisBtn);

    const ocultasWrap = document.createElement('div');
    ocultasWrap.style.display = 'none';
    ocultas.forEach(p => ocultasWrap.appendChild(criarCard(p)));
    lista.appendChild(ocultasWrap);

    verMaisBtn.addEventListener('click', () => {
      ocultasWrap.style.display = '';
      verMaisBtn.remove();
    });
  }
}

function routeByUsuario(){
  if(currentUsuario.papel === 'ceo'){
    renderCeoShell();
  } else if(currentUsuario.estado === 'rejeitado'){
    renderRejected();
  } else if(currentUsuario.papel === 'funcionario'){
    renderFuncionarioShell();
  } else if(currentUsuario.papel === 'gerente_administrativo'){
    renderFuncionarioShell(); // por agora, mesmas permissões/ecrã do funcionário
  } else if(currentUsuario.papel === 'afilhado'){
    renderAfilhadoShell();
  } else if(currentUsuario.papel === 'cliente'){
    renderVitrineLoja();
  } else {
    renderError('O seu utilizador tem um papel não reconhecido. Contacte o administrador.');
  }
}

// Limpa a cache do service worker (dados do Supabase guardados para modo
// offline) ao terminar sessão — num telemóvel partilhado da receção, os
// dados do cliente anterior não devem continuar acessíveis depois do
// logout, mesmo que só via inspeção do browser.
async function limparCacheOffline(){
  if('caches' in window){
    try{
      const nomes = await caches.keys();
      await Promise.all(nomes.map(n => caches.delete(n)));
    }catch(_e){ /* browser sem suporte a Cache Storage — ignora */ }
  }
}

async function signOut(){
  if(supabaseReady) await sb.auth.signOut();
  currentAuthUser = null;
  currentUsuario = null;
  await limparCacheOffline();
  renderVitrineLoja();
}

// Tenta recuperar de uma falha ao carregar a biblioteca do Supabase: espera
// um pouco (pode só estar lenta) e, se continuar em falta, tenta uma CDN
// alternativa antes de desistir. Isto evita que uma falha de rede pontual
// (VPN, CDN lento, ligação instável) pareça um "sistema por configurar".
async function tentarRecuperarSupabase(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return false;
  if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
    await carregarScriptComPromise('./vendor/supabase.js');
  }
  if(typeof window.supabase !== 'undefined' && window.supabase.createClient){
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true }
      });
      supabaseReady = true;
      return true;
    }catch(_e){ }
  }
  return false;
}
function carregarScriptComPromise(src){
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

// Sino de notificações (topo do painel) — mostra pedidos de novidades
// vindos da vitrine (e outros avisos do sistema, no futuro). Depende da
// tabela "notificacoes_sistema" (SQL enviado separadamente).
async function ativarSinoNotificacoes(){
  const btn = document.getElementById('sinoNotificacoesBtn');
  const badge = document.getElementById('sinoNotificacoesBadge');
  const drawer = document.getElementById('sinoNotificacoesDrawer');
  if(!btn) return;

  async function carregar(){
    try{
      const { data, error } = await sb.from('notificacoes_sistema').select('*').eq('lida', false).order('criado_em', { ascending:false }).limit(20);
      if(error) throw error;
      const lista = data || [];
      if(lista.length > 0){ badge.textContent = lista.length; badge.style.display = ''; }
      else { badge.style.display = 'none'; }

      drawer.innerHTML = lista.length === 0
        ? `<div class="empty-state-small">Sem notificações novas.</div>`
        : lista.map(n => `
            <div style="padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;">
              <div style="color:var(--linho); margin-bottom:4px;">${esc(n.mensagem)}</div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:var(--linho-dim); font-size:11px;">${new Date(n.criado_em).toLocaleString('pt-PT')}</span>
                <button type="button" class="icon-btn" data-marcar-lida="${n.id}" style="padding:2px 8px; font-size:11px;">Marcar lida</button>
              </div>
            </div>
          `).join('');

      drawer.querySelectorAll('[data-marcar-lida]').forEach(b => {
        b.addEventListener('click', async () => {
          await sb.from('notificacoes_sistema').update({ lida: true }).eq('id', b.dataset.marcarLida);
          carregar();
        });
      });
    }catch(e){
      // Tabela pode ainda não existir — falha silenciosa, sino fica sem badge.
    }
  }

  btn.addEventListener('click', () => {
    const aberto = drawer.style.display !== 'none';
    drawer.style.display = aberto ? 'none' : 'block';
    if(!aberto) carregar();
  });

  await carregar();
}

// Código curto e fácil de ditar por telefone — nome + sufixo aleatório.
function gerarCodigoAfilhado(nome){
  const base = (nome || 'PARCEIRO').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z]/g, '').slice(0, 6) || 'PARC';
  const sufixo = Math.random().toString(36).slice(2, 6).toUpperCase();
  return `${base}-${sufixo}`;
}

// 5% do valor pago pelo cliente em cada obra concluída de um cliente
// indicado — um único sítio para esta taxa, fácil de ajustar.
const TAXA_COMISSAO_AFILHADO = 0.05;
function calcularComissaoAfilhado(obra){
  return Math.max(0, Number(obra.valor_pago || 0) * TAXA_COMISSAO_AFILHADO);
}

// Gera a navegação principal como UM botão (mostra a secção atual) que
// abre um menu suspenso com todas as opções, agrupadas por área — em
// vez de uma fila de botões sempre visível.
function shellNavMenuHTML(dataAttr, tabAtual, grupos){
  let iconeAtual = '☰', rotuloAtual = 'Menu';
  grupos.forEach(g => g.itens.forEach(([valor, icone, rotulo]) => {
    if(valor === tabAtual){ iconeAtual = icone; rotuloAtual = rotulo; }
  }));
  return `
    <div class="dropdown-wrap" style="margin-bottom:24px;">
      <button type="button" class="shell-nav-btn" id="shellNavBtn_${dataAttr}">
        <span>${iconeAtual}</span> ${esc(rotuloAtual)} <span class="chevron">▾</span>
      </button>
      <div class="dropdown-menu" id="shellNavMenu_${dataAttr}">
        ${grupos.map(g => `
          <div class="dropdown-label">${esc(g.titulo)}</div>
          ${g.itens.map(([valor, icone, rotulo]) => `
            <button type="button" class="dropdown-item ${tabAtual===valor?'ativo':''}" data-${dataAttr}="${valor}">${icone} ${esc(rotulo)}</button>
          `).join('')}
        `).join('<div class="dropdown-divider"></div>')}
      </div>
    </div>
  `;
}

// Liga o clique de abrir/fechar de um menu suspenso. O fecho ao clicar
// fora é tratado uma única vez, de forma global (ver perto de init()).
function ativarDropdown(botaoId, menuId){
  const btn = document.getElementById(botaoId);
  const menu = document.getElementById(menuId);
  if(!btn || !menu) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.dropdown-menu.aberto').forEach(m => { if(m !== menu) m.classList.remove('aberto'); });
    menu.classList.toggle('aberto');
  });
  menu.addEventListener('click', (e) => e.stopPropagation());
}

async function loadMembers(){

  try{
    const { data, error } = await sb.from('usuarios').select('*').neq('papel', 'ceo').order('criado_em', { ascending: false });
    if(error) throw error;

    if(!data || data.length === 0){
      area.innerHTML = `<div class="empty-state"><div class="ic">○</div>Ainda não há outros membros registados.</div>`;
      return;
    }

    area.innerHTML = `<div class="approval-list">${data.map(u => `
      <div class="approval-row" data-id="${u.id}">
        <div class="info">
          <div class="nome">${esc(u.nome || u.email)}</div>
          <div class="email">${esc(u.email)}</div>
        </div>
        <span class="papel-pill">${PAPEL_LABELS[u.papel] || u.papel}</span>
        ${u.estado === 'rejeitado' ? '<span class="status-badge status-rejeitado" style="margin:0;">Suspenso</span>' : ''}
        <div class="dropdown-wrap">
          <button type="button" class="kebab-btn" id="membroMenuBtn_${u.id}">⋯</button>
          <div class="dropdown-menu direita" id="membroMenu_${u.id}">
            <div class="dropdown-label">Papel</div>
            ${u.papel === 'cliente' ? `<button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="funcionario" data-id="${u.id}">⬆ Promover a Parceiro</button>` : ''}
            ${u.papel === 'cliente' ? `<button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="afilhado" data-id="${u.id}">⬆ Promover a Parceiro Publicitário</button>` : ''}
            ${u.papel === 'afilhado' ? `<button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="cliente" data-id="${u.id}">⬇ Despromover a Cliente</button>` : ''}
            ${u.papel === 'funcionario' ? `
              <button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="gerente_administrativo" data-id="${u.id}">⬆ Promover a Gerente Administrativo</button>
              <button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="cliente" data-id="${u.id}">⬇ Tornar Cliente</button>
            ` : ''}
            ${u.papel === 'gerente_administrativo' ? `<button type="button" class="dropdown-item" data-membro-acao="papel" data-papel="funcionario" data-id="${u.id}">⬇ Despromover a Parceiro</button>` : ''}
            <div class="dropdown-divider"></div>
            <div class="dropdown-label">Acesso</div>
            ${u.estado === 'rejeitado'
              ? `<button type="button" class="dropdown-item" data-membro-acao="reativar" data-id="${u.id}">✓ Reativar acesso</button>`
              : `<button type="button" class="dropdown-item danger" data-membro-acao="dispensar" data-id="${u.id}">Dispensar (elimina do sistema)</button>`
            }
          </div>
        </div>
      </div>
    `).join('')}</div>`;

    data.forEach(u => ativarDropdown(`membroMenuBtn_${u.id}`, `membroMenu_${u.id}`));

    area.querySelectorAll('[data-membro-acao="papel"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try{
          const payload = { papel: btn.dataset.papel, estado: 'aprovado' };
          if(btn.dataset.papel === 'afilhado'){
            const linha = btn.closest('.approval-row');
            const nome = linha ? linha.querySelector('.nome').textContent : '';
            payload.codigo_afilhado = gerarCodigoAfilhado(nome);
          }
          let { error } = await sb.from('usuarios').update(payload).eq('id', btn.dataset.id);
          if(error && error.code === '23505'){
            // Colisão rara de código — tenta uma vez com outro sufixo.
            payload.codigo_afilhado = gerarCodigoAfilhado(payload.codigo_afilhado);
            const retry = await sb.from('usuarios').update(payload).eq('id', btn.dataset.id);
            error = retry.error;
          }
          if(error) throw error;
          await loadMembers();
          showToast('Papel atualizado ✓');
        }catch(e){ alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido')); }
      });
    });

    area.querySelectorAll('[data-membro-acao="dispensar"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const linha = btn.closest('.approval-row');
        const nome = linha ? linha.querySelector('.nome').textContent : 'este membro';
        if(!confirm(`Dispensar "${nome}"? Vai ser eliminado do sistema.`)) return;
        try{
          const { error } = await sb.from('usuarios').delete().eq('id', btn.dataset.id);
          if(error) throw error;
          await loadMembers();
          showToast('Membro dispensado e eliminado do sistema');
        }catch(e){
          // Se já tiver obras/despesas registadas, a base de dados normalmente
          // recusa apagar para não perder o histórico — mantemos o acesso
          // suspenso em vez de eliminar, para não perder esses registos.
          try{
            const { error: err2 } = await sb.from('usuarios').update({ estado: 'rejeitado' }).eq('id', btn.dataset.id);
            if(err2) throw err2;
            await loadMembers();
            showToast('Não foi possível eliminar (tem histórico registado) — acesso suspenso em vez disso');
          }catch(e2){ alert('Não foi possível dispensar: ' + (e2.message || 'erro desconhecido')); }
        }
      });
    });

    area.querySelectorAll('[data-membro-acao="reativar"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try{
          const { error } = await sb.from('usuarios').update({ estado: 'aprovado' }).eq('id', btn.dataset.id);
          if(error) throw error;
          await loadMembers();
          showToast('Acesso reativado');
        }catch(e){ alert('Não foi possível atualizar: ' + (e.message || 'erro desconhecido')); }
      });
    });
  }catch(e){
    area.innerHTML = `<div class="error-banner">Não foi possível carregar os membros: ${e.message || 'erro desconhecido'}</div>`;
  }
}

// Agrupa as obras em 4 blocos, do jeito que a equipa realmente trabalha:
// sem sinal pago, uma obra fica em "pendente" — só passa para "por fazer"
// quando há pelo menos algum pagamento registado (mesmo que seja só o
// sinal de 20%). Dentro de cada bloco, as urgentes aparecem primeiro.
function classificarObras(lista){
  const pendentes = [];
  const porFazer = [];
  const concluidas = [];
  const rejeitadas = [];
  (lista || []).forEach(o => {
    if(o.estado === 'concluido'){ concluidas.push(o); return; }
    if(o.estado === 'rejeitado'){ rejeitadas.push(o); return; }
    if(Number(o.valor_pago) > 0) porFazer.push(o); else pendentes.push(o);
  });
  const porPrioridade = (a, b) => {
    const pa = a.prioridade === 'urgente' ? 0 : 1;
    const pb = b.prioridade === 'urgente' ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return new Date(b.criado_em) - new Date(a.criado_em);
  };
  porFazer.sort(porPrioridade);
  pendentes.sort(porPrioridade);
  return { pendentes, porFazer, concluidas, rejeitadas };
}

// Liga/desliga a prioridade urgente de uma obra. Se a coluna ainda não
// existir na base de dados, avisa em vez de falhar em silêncio.
async function alternarPrioridadeObra(obraId, prioridadeAtual){
  const nova = prioridadeAtual === 'urgente' ? 'normal' : 'urgente';
  try{
    const { error } = await sb.from('obras').update({ prioridade: nova }).eq('id', obraId);
    if(error) throw error;
    return true;
  }catch(e){
    if(e.code === '42703'){
      alert('Ainda falta correr o SQL que adiciona a coluna "prioridade" na base de dados.');
    } else {
      alert('Não foi possível atualizar a prioridade: ' + (e.message || 'erro desconhecido'));
    }
    return false;
  }
}
